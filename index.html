// =====================================================
// CREATE VOICE WAVEFORM
// STABLE / DETERMINISTIC WAVEFORM
// =====================================================

window.createVoiceWaveform = function (id) {

    const waveform =
        document.getElementById(
            "voiceWaveform-" + id
        );


    if (!waveform) {
        return;
    }


    // =================================================
    // DON'T CREATE DUPLICATE BARS
    // =================================================

    if (
        waveform.querySelector(
            ".voiceWaveBar"
        )
    ) {

        return;

    }


    // =================================================
    // WAVEFORM BAR COUNT
    // =================================================

    const bars = 28;


    // =================================================
    // DETERMINISTIC WAVE PATTERN
    // =================================================

    const pattern = [
        8, 14, 20, 11,
        17, 7, 22, 13,
        18, 10, 24, 15,
        9, 19, 12, 23,
        16, 8, 21, 14,
        18, 10, 22, 13,
        17, 9, 20, 12,
        16, 8
    ];


    // =================================================
    // CREATE BARS
    // =================================================

    for (
        let i = 0;
        i < bars;
        i++
    ) {

        const bar =
            document.createElement(
                "span"
            );


        bar.className =
            "voiceWaveBar";


        // -------------------------------------------------
        // STABLE HEIGHT
        // -------------------------------------------------

        const height =
            pattern[
                i % pattern.length
            ];


        bar.style.setProperty(
            "--wave-height",
            height + "px"
        );


        // -------------------------------------------------
        // STABLE ANIMATION DELAY
        // -------------------------------------------------

        const delay =
            (
                (i % 7) *
                0.05
            ).toFixed(2);


        bar.style.setProperty(
            "--wave-delay",
            delay + "s"
        );


        waveform.appendChild(
            bar
        );

    }


    // =================================================
    // MARK WAVEFORM AS CREATED
    // =================================================

    waveform.dataset.waveformReady =
        "true";


    console.log(
        "〰️ Voice waveform created:",
        id
    );

};


// =====================================================
// ANIMATE VOICE WAVEFORM
// SYNCHRONIZED TO AUTHORITATIVE AUDIO TIMELINE
// =====================================================

window.animateVoiceWaveform = function (id, audio) {

    if (!audio) {
        return;
    }


    const waveform =
        document.getElementById(
            "voiceWaveform-" + id
        );

    const player =
        document.getElementById(
            "commentVoice-" + id
        );

    const time =
        document.getElementById(
            "voiceTime-" + id
        );


    if (!waveform) {
        return;
    }


    const bars =
        waveform.querySelectorAll(
            ".voiceWaveBar"
        );


    // =================================================
    // PREVENT DUPLICATE AUDIO LISTENERS
    // =================================================

    if (
        audio.dataset.waveformAnimated ===
        "true"
    ) {

        return;
    }


    audio.dataset.waveformAnimated =
        "true";


    // =================================================
    // GET AUTHORITATIVE DURATION
    // =================================================

    const getDuration =
        function () {

            if (
                typeof window.getAuthoritativeVoiceDuration ===
                "function"
            ) {

                const value =
                    Number(
                        window.getAuthoritativeVoiceDuration(
                            id
                        )
                    );


                if (
                    Number.isFinite(value) &&
                    value > 0
                ) {

                    return value;

                }

            }


            return 0;

        };


    // =================================================
    // UPDATE WAVEFORM
    // =================================================

    const updateWave =
        function () {

            let current =
                Number(
                    audio.currentTime
                );


            if (
                !Number.isFinite(current) ||
                current < 0
            ) {

                current = 0;

            }


            const duration =
                getDuration();


            // -----------------------------------------
            // NEVER EXCEED AUTHORITATIVE DURATION
            // -----------------------------------------

            if (
                duration > 0
            ) {

                current =
                    Math.min(
                        current,
                        duration
                    );

            }


            // -----------------------------------------
            // UPDATE TIME
            // -----------------------------------------

            if (time) {

                time.textContent =
                    window.formatVoiceTime(
                        current
                    );

            }


            // -----------------------------------------
            // UPDATE WAVEFORM
            // -----------------------------------------

            if (
                bars.length > 0 &&
                duration > 0
            ) {

                const progress =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            current / duration
                        )
                    );


                const activeBars =
                    Math.floor(
                        progress *
                        bars.length
                    );


                bars.forEach(
                    function (bar, index) {

                        if (
                            index <
                            activeBars
                        ) {

                            bar.classList.add(
                                "played"
                            );

                        }

                        else {

                            bar.classList.remove(
                                "played"
                            );

                        }

                    }
                );

            }


            // -----------------------------------------
            // PLAYING STATE
            // -----------------------------------------

            if (
                !audio.paused &&
                !audio.ended
            ) {

                if (player) {

                    player.classList.add(
                        "playing"
                    );

                }

            }

            else {

                if (player) {

                    player.classList.remove(
                        "playing"
                    );

                }

            }

        };


    // =================================================
    // AUDIO EVENTS
    // =================================================

    audio.addEventListener(
        "timeupdate",
        updateWave
    );


    audio.addEventListener(
        "seeked",
        updateWave
    );


    audio.addEventListener(
        "play",
        updateWave
    );


    audio.addEventListener(
        "pause",
        updateWave
    );


    audio.addEventListener(
        "loadedmetadata",
        function () {

            console.log(
                "🎧 BROWSER AUDIO DURATION:",
                audio.duration,
                "| AUTHORITATIVE:",
                getDuration()
            );


            updateWave();

        }
    );


    audio.addEventListener(
        "durationchange",
        updateWave
    );


    // =================================================
    // PLAYBACK ENDED
    // =================================================

    audio.addEventListener(
        "ended",
        function () {

            const duration =
                getDuration();


            // -----------------------------------------
            // FILL COMPLETE WAVEFORM
            // -----------------------------------------

            bars.forEach(
                function (bar) {

                    bar.classList.add(
                        "played"
                    );

                }
            );


            // -----------------------------------------
            // SHOW AUTHORITATIVE END TIME
            // -----------------------------------------

            if (time) {

                time.textContent =
                    duration > 0

                        ? window.formatVoiceTime(
                            duration
                        )

                        : "0:00";

            }


            if (player) {

                player.classList.remove(
                    "playing"
                );

            }

        }
    );


    // =================================================
    // INITIAL STATE
    // =================================================

    updateWave();

};

// =====================================================
// CLICK WAVEFORM TO SEEK
// SINGLE AUTHORITATIVE DURATION SOURCE
// =====================================================

window.setupVoiceWaveformSeek = function (id) {

    const waveform =
        document.getElementById(
            "voiceWaveform-" + id
        );

    const audio =
        document.getElementById(
            "voiceAudio-" + id
        );


    if (!waveform || !audio) {
        return;
    }


    // =================================================
    // PREVENT DUPLICATE SEEK LISTENERS
    // =================================================

    if (
        waveform.dataset.seekConnected === "true"
    ) {

        return;
    }


    waveform.dataset.seekConnected =
        "true";


    // =================================================
    // GET AUTHORITATIVE DURATION
    // =================================================

    const getDuration =
        function () {

            if (
                typeof window.getAuthoritativeVoiceDuration ===
                "function"
            ) {

                const duration =
                    Number(
                        window.getAuthoritativeVoiceDuration(
                            id
                        )
                    );


                if (
                    Number.isFinite(duration) &&
                    duration > 0
                ) {

                    return duration;

                }

            }


            return 0;

        };


    // =================================================
    // WAVEFORM CLICK
    // =================================================

    waveform.addEventListener(
        "click",
        function (event) {

            event.preventDefault();
            event.stopPropagation();


            // -----------------------------------------
            // GET AUTHORITATIVE DURATION
            // -----------------------------------------

            const duration =
                getDuration();


            if (
                !Number.isFinite(duration) ||
                duration <= 0
            ) {

                console.warn(
                    "⚠️ Voice duration unavailable:",
                    id
                );

                return;

            }


            // -----------------------------------------
            // GET WAVEFORM POSITION
            // -----------------------------------------

            const rect =
                waveform.getBoundingClientRect();


            if (
                !rect.width ||
                rect.width <= 0
            ) {

                return;

            }


            const clickPosition =
                event.clientX -
                rect.left;


            // -----------------------------------------
            // CALCULATE PERCENTAGE
            // -----------------------------------------

            const percentage =
                Math.max(
                    0,
                    Math.min(
                        1,
                        clickPosition /
                        rect.width
                    )
                );


            // -----------------------------------------
            // CALCULATE TARGET TIME
            // -----------------------------------------

            const targetTime =
                percentage *
                duration;


            console.log(
                "🎯 VOICE SEEK:",
                {
                    id: id,

                    percentage:
                        Math.round(
                            percentage * 100
                        ) + "%",

                    duration:
                        duration.toFixed(3) +
                        "s",

                    target:
                        targetTime.toFixed(3) +
                        "s"
                }
            );


            // -----------------------------------------
            // SEEK AUDIO
            // -----------------------------------------

            try {

                /*
                 * IMPORTANT:
                 * The actual HTML audio element controls
                 * playback. The database duration only
                 * determines where on the waveform the
                 * user should seek.
                 */

                const safeTarget =
                    Math.max(
                        0,
                        Math.min(
                            targetTime,
                            duration
                        )
                    );


                audio.currentTime =
                    safeTarget;


                // Immediately update waveform/time
                audio.dispatchEvent(
                    new Event("seeked")
                );

            }

            catch (error) {

                console.error(
                    "❌ Voice seek failed:",
                    error
                );

            }

        },
        {
            passive: false
        }
    );


    console.log(
        "🎯 Voice waveform seeking connected:",
        id,
        "| Duration:",
        getDuration()
    );

};

// =====================================================
// GET REAL VOICE AUDIO DURATION
// WEBM-SAFE VERSION
// =====================================================

window.getVoiceAudioDuration = async function (blob) {

    if (
        !blob ||
        blob.size <= 0
    ) {
        return 0;
    }


    return new Promise(function (resolve) {

        const url =
            URL.createObjectURL(blob);

        const audio =
            document.createElement("audio");

        audio.preload =
            "metadata";

        let finished = false;


        // =================================================
        // CLEANUP
        // =================================================

        const cleanup =
            function () {

                if (finished) {
                    return;
                }

                finished = true;


                try {
                    URL.revokeObjectURL(url);
                }
                catch (error) {
                    console.warn(
                        "⚠️ Voice URL cleanup failed:",
                        error
                    );
                }


                audio.onloadedmetadata = null;
                audio.ondurationchange = null;
                audio.onloadeddata = null;
                audio.onerror = null;


                audio.removeAttribute("src");


                try {
                    audio.load();
                }
                catch (error) {
                    // Ignore cleanup error
                }

            };


        // =================================================
        // FINISH
        // =================================================

        const finish =
            function (duration) {

                if (finished) {
                    return;
                }


                const value =
                    Number(duration);


                if (
                    Number.isFinite(value) &&
                    value > 0 &&
                    value !== Infinity
                ) {

                    cleanup();


                    const safeDuration =
                        Math.round(
                            value * 1000
                        ) / 1000;


                    console.log(
                        "🎧 REAL VOICE AUDIO DURATION:",
                        safeDuration.toFixed(3),
                        "seconds"
                    );


                    resolve(
                        safeDuration
                    );

                    return;
                }


                cleanup();


                console.warn(
                    "⚠️ Browser could not determine voice duration"
                );


                resolve(0);

            };


        // =================================================
        // METADATA
        // =================================================

        audio.onloadedmetadata =
            function () {

                const duration =
                    Number(
                        audio.duration
                    );


                console.log(
                    "🎧 VOICE METADATA:",
                    duration
                );


                if (
                    Number.isFinite(duration) &&
                    duration > 0 &&
                    duration !== Infinity
                ) {

                    finish(
                        duration
                    );

                }

            };


        // =================================================
        // DURATION CHANGE
        // =================================================

        audio.ondurationchange =
            function () {

                const duration =
                    Number(
                        audio.duration
                    );


                if (
                    Number.isFinite(duration) &&
                    duration > 0 &&
                    duration !== Infinity
                ) {

                    finish(
                        duration
                    );

                }

            };


        // =================================================
        // LOADED DATA FALLBACK
        // =================================================

        audio.onloadeddata =
            function () {

                const duration =
                    Number(
                        audio.duration
                    );


                if (
                    Number.isFinite(duration) &&
                    duration > 0 &&
                    duration !== Infinity
                ) {

                    finish(
                        duration
                    );

                }

            };


        // =================================================
        // ERROR
        // =================================================

        audio.onerror =
            function () {

                console.warn(
                    "⚠️ Could not decode voice audio metadata"
                );


                finish(0);

            };


        // =================================================
        // LOAD
        // =================================================

        audio.src =
            url;

        audio.load();


        // =================================================
        // SAFETY TIMEOUT
        // =================================================

        setTimeout(
            function () {

                if (finished) {
                    return;
                }


                const duration =
                    Number(
                        audio.duration
                    );


                if (
                    Number.isFinite(duration) &&
                    duration > 0 &&
                    duration !== Infinity
                ) {

                    finish(
                        duration
                    );

                }

                else {

                    console.warn(
                        "⚠️ Voice duration remained unavailable"
                    );


                    finish(0);

                }

            },
            5000
        );

    });

};


// =====================================================
// UPLOAD VOICE COMMENT

// =====================================================

window.uploadVoiceComment = async function (blob) {

    // =================================================
    // CHECK BLOB

    ) {

    }


    // =================================================

    let sessionResult;

    try {

            await supabase.auth.getSession();

    }

    catch (error) {

        console.error(
            "❌ Voice session error:",
            error
        );

        return false;

    }


    const session =
        sessionResult?.data?.session;


    if (!session) {

        if (
            typeof showToast ===
            "function"
        ) {

            showToast(
                "Login to post a voice comment."
            );

        }

        return false;

    }


    // =================================================
    // POST CHECK
    // =================================================

    if (!currentPostId) {

        if (
            typeof showToast ===
            "function"
        ) {

            showToast(
                "Could not find this post."
            );

        }

        return false;

    }


    // =================================================
    // GET REAL AUDIO DURATION
    // =================================================

    let realDuration = 0;


    if (
        typeof window.getVoiceAudioDuration ===
        "function"
    ) {

        try {

            realDuration =
                Number(
                    await window.getVoiceAudioDuration(
                        blob
                    )
                );

        }

        catch (error) {

            console.warn(
                "⚠️ Real voice duration detection failed:",
                error
            );

        }

    }


    // =================================================
    // FALLBACK TO RECORDING TIMER
    // =================================================

    if (
        !Number.isFinite(realDuration) ||
        realDuration <= 0
    ) {

        const measuredDuration =
            Number(
                window.recordedVoiceDuration
            );


        if (
            Number.isFinite(measuredDuration) &&
            measuredDuration > 0
        ) {

            realDuration =
                measuredDuration;

        }

    }


    // =================================================
    // FINAL SAFE DURATION
    // =================================================

    const safeDuration =
        Number.isFinite(realDuration) &&
        realDuration > 0
            ? Number(
                realDuration.toFixed(3)
            )
            : 0;


    if (safeDuration <= 0) {

        console.error(
            "❌ Voice duration unavailable. Upload cancelled."
        );


        if (
            typeof showToast ===
            "function"
        ) {

            showToast(
                "Could not determine voice duration."
            );

        }

        return false;

    }


    // =================================================
    // SAVE AUTHORITATIVE LOCAL DURATION
    // =================================================

    window.recordedVoiceDuration =
        safeDuration;


    console.log(
        "📤 AUTHORITATIVE VOICE UPLOAD DURATION:",
        safeDuration.toFixed(3),
        "seconds"
    );


    // =================================================
    // MIME TYPE
    // =================================================

    const mimeType =
        blob.type ||
        window.commentVoiceMimeType ||
        "audio/webm";


    // =================================================
    // FILE EXTENSION
    // =================================================

    let extension =
        "webm";


    if (
        mimeType.includes("mp4")
    ) {

        extension =
            "mp4";

    }

    else if (
        mimeType.includes("ogg")
    ) {

        extension =
            "ogg";

    }

    else if (
        mimeType.includes("wav")
    ) {

        extension =
            "wav";

    }


    // =================================================
    // FILE NAME
    // =================================================

    const fileName =
        "voice_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2) +
        "." +
        extension;


    // =================================================
    // UPLOAD
    // =================================================

    let uploadResult;

    try {

        uploadResult =
            await supabase
                .storage
                .from("voice-notes")
                .upload(
                    fileName,
                    blob,
                    {
                        upsert: false,
                        contentType: mimeType
                    }
                );

    }

    catch (error) {

        console.error(
            "❌ Voice upload exception:",
            error
        );


        if (
            typeof showToast ===
            "function"
        ) {

            showToast(
                "Couldn't upload voice comment."
            );

        }

        return false;

    }


    if (
        uploadResult.error
    ) {

        console.error(
            "❌ Voice storage upload failed:",
            uploadResult.error
        );


        if (
            typeof showToast ===
            "function"
        ) {

            showToast(
                "Couldn't upload voice comment."
            );

        }

        return false;

    }


    // =================================================
    // PUBLIC URL
    // =================================================

    const {
        data: urlData
    } =
        supabase
            .storage
            .from("voice-notes")
            .getPublicUrl(
                fileName
            );


    if (
        !urlData?.publicUrl
    ) {

        console.error(
            "❌ Could not create voice public URL"
        );


        if (
            typeof showToast ===
            "function"
        ) {

            showToast(
                "Couldn't create voice URL."
            );

        }

        return false;

    }


    // =================================================
    // REPLY DATA
    // =================================================

    const parentId =
        window.replyingToComment
            ? String(
                window.replyingToComment
            )
            : null;


    const replyUserId =
        window.replyingToUserId
            ? String(
                window.replyingToUserId
            )
            : null;


    // =================================================
    // INSERT COMMENT
    // =================================================

    let insertResult;

    try {

        insertResult =
            await supabase
                .from("comments")
                .insert({

                    post_id:
                        currentPostId,

                    user_id:
                        session.user.id,

                    content:
                        "",

                    media_url:
                        urlData.publicUrl,

                    media_type:
                        "voice",

                    voice_duration:
                        safeDuration,

                    parent_id:
                        parentId,

                    reply_to_user_id:
                        replyUserId

                })
                .select()
                .single();

    }

    catch (error) {

        console.error(
            "❌ Voice comment insert exception:",
            error
        );


        if (
            typeof showToast ===
            "function"
        ) {

            showToast(
                "Couldn't post voice comment."
            );

        }

        return false;

    }


    if (
        insertResult.error
    ) {

        console.error(
            "❌ Voice comment insert failed:",
            insertResult.error
        );


        if (
            typeof showToast ===
            "function"
        ) {

            showToast(
                "Couldn't post voice comment."
            );

        }

        return false;

    }


    // =================================================
    // CONFIRM DATABASE VALUE
    // =================================================

    console.log(
        "✅ VOICE COMMENT INSERTED",
        {
            id:
                insertResult.data?.id,

            voice_duration:
                insertResult.data?.voice_duration,

            media_url:
                insertResult.data?.media_url
        }
    );


    // =================================================
    // RESET REPLY
    // =================================================

    window.replyingToComment =
        null;

    window.replyingToUserId =
        null;


    const replyPreview =
        document.getElementById(
            "replyPreview"
        );


    if (replyPreview) {

        replyPreview.style.display =
            "none";

    }


    // =================================================
    // REFRESH COMMENTS
    // =================================================

    try {

        if (
            typeof loadComments ===
            "function"
        ) {

            await loadComments(
                currentPostId
            );

        }

    }

    catch (error) {

        console.error(
            "❌ Voice comment refresh failed:",
            error
        );

    }


    return true;

};

window.initCommentVoiceSystem = function () {

    console.log(
        "🎤 Initializing comment voice system..."
    );


    // =================================================
    // CONNECT VOICE BUTTON
    // =================================================

    const connectButton =
        function () {

            const voiceBtn =
                document.getElementById(
                    "voiceBtn"
                );


            if (!voiceBtn) {

                return false;

            }


            // -------------------------------------------------
            // SETUP BUTTON
            // -------------------------------------------------

            if (
                typeof window.setupCommentVoiceButton !==
                "function"
            ) {

                console.warn(
                    "⚠️ setupCommentVoiceButton() is not available yet"
                );

                return false;

            }


            try {

                return Boolean(
                    window.setupCommentVoiceButton()
                );

            }

            catch (error) {

                console.error(
                    "❌ Voice button setup failed:",
                    error
                );

                return false;

            }

        };


    // =================================================
    // BUTTON ALREADY EXISTS
    // =================================================

    if (connectButton()) {

        console.log(
            "✅ Comment voice button connected"
        );


        return true;

    }


    // =================================================
    // BODY NOT READY
    // =================================================

    if (!document.body) {

        console.warn(
            "⚠️ Document body is not ready"
        );


        return false;

    }


    // =================================================
    // REMOVE OLD OBSERVER
    // =================================================

    if (
        window.commentVoiceObserver
    ) {

        try {

            window.commentVoiceObserver.disconnect();

        }

        catch (error) {

            console.warn(
                "⚠️ Could not disconnect previous voice observer:",
                error
            );

        }


        window.commentVoiceObserver =
            null;

    }


    // =================================================
    // WATCH FOR VOICE BUTTON
    // =================================================

    const observer =
        new MutationObserver(
            function () {

                if (
                    connectButton()
                ) {

                    observer.disconnect();


                    if (
                        window.commentVoiceObserver ===
                        observer
                    ) {

                        window.commentVoiceObserver =
                            null;

                    }


                    console.log(
                        "✅ Comment voice button found and connected"
                    );

                }

            }
        );


    observer.observe(
        document.body,
        {
            childList: true,
            subtree: true
        }
    );


    window.commentVoiceObserver =
        observer;


    console.log(
        "👀 Waiting for comments voice button..."
    );


    return false;

};

function renderCommentReads(comment) {

    if (!comment.comment_reads || comment.comment_reads.length === 0) {
        return "";
    }

    const readers = [
    ...new Set(
        comment.comment_reads
        .map(r => r.profiles?.name)
        .filter(Boolean)
    )
];

    if (readers.length === 0) return "";

    let text = "";

    if (readers.length === 1) {
        text = `Seen by ${readers[0]}`;
    } else if (readers.length === 2) {
        text = `Seen by ${readers[0]} and ${readers[1]}`;
    } else {
        text = `Seen by ${readers[0]}, ${readers[1]} and ${readers.length - 2} others`;
    }

    return `
   <div
class="commentReads"
style="
margin-top:8px;
font-size:12px;
color:#8e8e8e;
">
        👁 ${text}
    </div>
    `;
}

// CLICKABLE + DYNAMIC-SAFE + ALWAYS SHOW COUNT
// =====================================================

window.renderCommentReactions = function (comment) {

    if (
        !comment ||
        !Array.isArray(comment.comment_reactions) ||
        comment.comment_reactions.length === 0
    ) {
        return "";
    }

    const grouped = {};

    comment.comment_reactions.forEach(reaction => {

        if (
            !reaction ||
            !reaction.emoji
        ) {
            return;
        }

        if (!grouped[reaction.emoji]) {
            grouped[reaction.emoji] = [];
        }

        grouped[reaction.emoji].push(
            reaction.user_id
        );

    });

    return Object.entries(grouped)
        .map(([emoji, users]) => {

            const safeEmoji =
                escapeHtml(emoji);

            const safeCommentId =
                String(comment.id);

            const count =
                users.length;

            return `
                <span
                    class="commentReactionBadge"
                    data-comment-id="${safeCommentId}"
                    data-reaction-emoji="${safeEmoji}"
                    role="button"
                    tabindex="0"
                    style="
                        display:inline-flex;
                        align-items:center;
                        gap:4px;
                        background:#232323;
                        color:white;
                        border-radius:15px;
                        padding:5px 9px;
                        font-size:13px;
                        cursor:pointer;
                        user-select:none;
                        position:relative;
                        z-index:20;
                        pointer-events:auto;
                    "
                >

                    <span
                        style="
                            pointer-events:none;
                        "
                    >
                        ${safeEmoji}
                    </span>

                    <span
                        class="commentReactionCount"
                        style="
                            color:#aaa;
                            font-size:11px;
                            pointer-events:none;
                        "
                    >
                        ${count}
                    </span>

                </span>
            `;

        })
        .join("");
};

            );

        const parentId =
            commentData?.parent_id ||
            null;

        // =================================================

        // =================================================

        if (parentId) {

            console.log(

                );

            if (threadButton) {

                threadButton.style.display =
                    "block";

                threadButton.textContent =
                    "Hide replies";

            }

        }

        // =================================================
        // WAIT FOR DOM TO SETTLE
        // =================================================

        await new Promise(resolve => {

            requestAnimationFrame(() => {

                requestAnimationFrame(
                    resolve
                );

            });

        });

        // =================================================
        // GET COMMENT AGAIN
        // =================================================

        comment =
            document.getElementById(
                `comment-${commentId}`
            );

        if (!comment) {

            console.error(
                "❌ COMMENT DISAPPEARED BEFORE RESTORE:",

            );

        // SCROLL EXACT COMMENT
        // =================================================

        const commentsBody =
            document.getElementById(
                "commentsBody"
            );

        if (commentsBody) {

            const bodyRect =
                commentsBody.getBoundingClientRect();

            const commentRect =
                comment.getBoundingClientRect();

            const currentScroll =
                commentsBody.scrollTop;

            const relativeTop =
                commentRect.top -
                bodyRect.top;

            const targetScroll =
                currentScroll +
                relativeTop -
                (
                    commentsBody.clientHeight / 2
                ) +
                (
                    comment.offsetHeight / 2
                );

            commentsBody.scrollTo({

                top:
                    Math.max(
                        0,
                        targetScroll
                    ),

                behavior:
                    "auto"

            comment.scrollIntoView({

                    "auto",

                block:
                    "center"

window.selectCommentReaction = async function(emoji) {

    const commentId = reactionCommentId;

    if (!commentId) {
        console.warn("No reaction comment selected");
        return;
    }

    /*
     * -----------------------------------------
     * CLOSE PICKER IMMEDIATELY
     * -----------------------------------------
     */

    const picker =
        document.getElementById("reactionPicker");

    if (picker) {

        picker.style.transform =
            "translateX(-50%) scale(0)";

        setTimeout(() => {

            picker.style.display = "none";

        }, 200);
    }

    /*
     * -----------------------------------------
     * GET SESSION
     * -----------------------------------------
     */

    const {
        data: { session },
        error: sessionError
    } = await supabase.auth.getSession();

    if (sessionError) {

        console.error(
            "Reaction session error:",
            sessionError
        );

        return;
    }

    /*
     * Reactions require login
     */

    if (!session) {
        return;
    }

    const userId =
        session.user.id;

    /*
     * -----------------------------------------
     * PREVENT DOUBLE REQUEST
     * -----------------------------------------
     */

    if (
        window.reactionProcessing &&
        window.reactionProcessing[commentId]
    ) {
        return;
    }

    window.reactionProcessing =
        window.reactionProcessing || {};

    window.reactionProcessing[commentId] = true;

    try {

        /*
         * -----------------------------------------
         * GET CURRENT REACTION
         * -----------------------------------------
         */

        const {
            data: existing,
            error: existingError
        } = await supabase
            .from("comment_reactions")
            .select(`
                id,
                emoji
            `)
            .eq(
                "comment_id",
                commentId
            )
            .eq(
                "user_id",
                userId
            )
            .maybeSingle();

        if (existingError) {

            console.error(
                "Check comment reaction:",
                existingError
            );

            return;
        }

        /*
         * -----------------------------------------
         * SAME EMOJI
         * REMOVE IT
         * -----------------------------------------
         */

        if (
            existing &&
            existing.emoji === emoji
        ) {

            const {
                error: deleteError
            } = await supabase
                .from("comment_reactions")
                .delete()
                .eq(
                    "id",
                    existing.id
                );

            if (deleteError) {

                console.error(
                    "Remove reaction:",
                    deleteError
                );

                return;
            }

            /*
             * Update UI immediately
             */

            await refreshCommentReactionUI(
                commentId
            );

            closeCommentMenu();

            return;
        }

        /*
         * -----------------------------------------
         * CHANGE EXISTING REACTION
         * -----------------------------------------
         */

        if (existing) {

            const {
                error: updateError
            } = await supabase
                .from("comment_reactions")
                .update({
                    emoji: emoji
                })
                .eq(
                    "id",
                    existing.id
                );

            if (updateError) {

                console.error(
                    "Change reaction:",
                    updateError
                );

                return;
            }

        }

        /*
         * -----------------------------------------
         * INSERT NEW REACTION
         * -----------------------------------------
         */

        else {

            const {
                error: insertError
            } = await supabase
                .from("comment_reactions")
                .insert({
                    comment_id:
                        commentId,

                    user_id:
                        userId,

                    emoji:
                        emoji
                });

            if (insertError) {

                console.error(
                    "Insert reaction:",
                    insertError
                );

                return;
            }
        }

        /*
         * -----------------------------------------
         * UPDATE REACTION UI IMMEDIATELY
         * -----------------------------------------
         */

        await refreshCommentReactionUI(
            commentId
        );

        /*
         * -----------------------------------------
         * GET COMMENT OWNER
         * -----------------------------------------
         */

        const {
            data: comment,
            error: commentError
        } = await supabase
            .from("comments")
            .select(`
                user_id,
                post_id
            `)
            .eq(
                "id",
                commentId
            )
            .single();

        if (commentError) {

            console.error(
                "Get comment owner:",
                commentError
            );

            return;
        }

        /*
         * -----------------------------------------
         * DON'T NOTIFY YOURSELF
         * -----------------------------------------
         */

        if (
            !comment ||
            comment.user_id === userId
        ) {
            return;
        }

        /*
         * -----------------------------------------
         * GET SENDER PROFILE
         * -----------------------------------------
         */

        const {
            data: profile,
            error: profileError
        } = await supabase
            .from("profiles")
            .select(`
                name,
                avatar_url
            `)
            .eq(
                "id",
                userId
            )
            .single();

        if (profileError || !profile) {

            console.error(
                "Get reaction profile:",
                profileError
            );

            return;
        }

        /*
         * -----------------------------------------
         * CHECK EXISTING NOTIFICATION
         * -----------------------------------------
         */

        const {
            data: existingNotif,
            error: notifCheckError
        } = await supabase
            .from("notifications")
            .select("*")
            .eq(
                "user_id",
                comment.user_id
            )
            .eq(
                "sender_id",
                userId
            )
            .eq(
                "type",
                "comment_reaction"
            )
            .eq(
                "comment_id",
                commentId
            )
            .maybeSingle();

        if (notifCheckError) {

            console.error(
                "Reaction notification check:",
                notifCheckError
            );
        }

        /*
         * -----------------------------------------
         * UPDATE NOTIFICATION
         * -----------------------------------------
         */

        if (existingNotif) {

            const {
                error: notifUpdateError
            } = await supabase
                .from("notifications")
                .update({

                    count:
                        (existingNotif.count || 1) + 1,

                    username:
                        profile.name,

                    avatar_url:
                        profile.avatar_url,

                    message:
                        `reacted ${emoji} to your comment`,

                    last_time:
                        new Date(),

                    read:
                        false
                })
                .eq(
                    "id",
                    existingNotif.id
                );

            if (notifUpdateError) {

                console.error(
                    "Update reaction notification:",
                    notifUpdateError
                );
            }

        }

        /*
         * -----------------------------------------
         * CREATE NOTIFICATION
         * -----------------------------------------
         */

        else {

            const {
                error: notifInsertError
            } = await supabase
                .from("notifications")
                .insert({

                    user_id:
                        comment.user_id,

                    sender_id:
                        userId,

                    username:
                        profile.name,

                    avatar_url:
                        profile.avatar_url,

                    type:
                        "comment_reaction",

                    comment_id:
                        commentId,

                    post_id:
                        comment.post_id,

                    message:
                        `reacted ${emoji} to your comment`,

                    count:
                        1,

                    created_at:
                        new Date(),

                    last_time:
                        new Date(),

                    read:
                        false
                });

            if (notifInsertError) {

                console.error(
                    "Insert reaction notification:",
                    notifInsertError
                );
            }
        }

    } finally {

        window.reactionProcessing[commentId] =
            false;
    }

    closeCommentMenu();
};

window.refreshCommentReactionUI = async function(commentId) {

    if (!commentId) {
        return;
    }


    // =================================================
    // LOAD REACTIONS
    // =================================================

    const {
        data: reactions,
        error
    } = await supabase
        .from("comment_reactions")
        .select(`
            id,
            user_id,
            emoji
        `)
        .eq(
            "comment_id",
            commentId
        );


    if (error) {

        console.error(
            "❌ Refresh reaction UI:",
            error
        );

        return;
    }


    // =================================================
    // FIND COMMENT
    // =================================================

    const comment =
        document.getElementById(
            "comment-" + commentId
        );


    if (!comment) {

        console.warn(
            "⚠️ Comment element not found:",
            commentId
        );

        return;
    }


    // =================================================
    // FIND REACTION CONTAINER
    // =================================================

    const reactionContainer =
        comment.querySelector(
            ".commentReactions"
        );


    if (!reactionContainer) {

        console.warn(
            "⚠️ Reaction container not found:",
            commentId
        );

        return;
    }


    // =================================================
    // NO REACTIONS
    // =================================================

    if (
        !Array.isArray(reactions) ||
        reactions.length === 0
    ) {

        reactionContainer.innerHTML = "";

        return;
    }


    // =================================================
    // USE THE SAME RENDERER EVERYWHERE
    // =================================================

    reactionContainer.innerHTML =
        window.renderCommentReactions({

            id:
                commentId,

            comment_reactions:
                reactions

        });


    console.log(
        "✅ Reaction UI refreshed:",
        {
            commentId,
            reactions: reactions.length
        }
    );

};

     */

        card.querySelector(

        );

        renderCommentReads(comment);

        }

            "beforeend",
            newReads
        );

async function listenToCommentTyping() {

if (commentsTypingChannel) {
    supabase.removeChannel(commentsTypingChannel);
}

commentsTypingChannel = supabase
.channel("comment_typing_" + currentPostId)

.on(
"postgres_changes",
{
event: "UPDATE",
schema: "public",
table: "profiles"
},
async (payload) => {

const profile = payload.new;

const {
    data: { session }
} = await supabase.auth.getSession();

if (!session) return;

// Ignore yourself
if (profile.id === session.user.id) return;

// Ignore updates not related to comment typing
if (
    payload.old.typing_comment === profile.typing_comment &&
    payload.old.typing_comment_post === profile.typing_comment_post
) {
    return;
}

const indicator =
document.getElementById("commentTypingIndicator");

if (!indicator) return;

if (
    profile.typing_comment === true &&
    String(profile.typing_comment_post) === String(currentPostId)
) {

    indicator.style.display = "block";
    indicator.textContent =
        `${profile.name || "Someone"} is typing...`;

} else {

    indicator.style.display = "none";

}

}

)

.subscribe();

}

async function pinComment(commentId) {

    const {
        data: { session }
    } = await supabase.auth.getSession();

    if (!session) return;

    if (session.user.id !== window.currentPostOwnerId) {
        showToast("Only the post owner can pin comments.");
        return;
    }

    const { data: comment, error } = await supabase
        .from("comments")
        .select("pinned")
        .eq("id", commentId)
        .single();

    if (error || !comment) return;

    // Limit to 3 pinned comments
    if (!comment.pinned) {

        const { count } = await supabase
            .from("comments")
            .select("*", { count: "exact", head: true })
            .eq("post_id", currentPostId)
            .eq("pinned", true);

        if (count >= 3) {
            showToast("You can only pin 3 comments.");
            return;
        }
    }

    const { error: updateError } = await supabase
        .from("comments")
        .update({
            pinned: !comment.pinned
        })
        .eq("id", commentId);

    if (updateError) {
        console.log(updateError);
        showToast("Couldn't update comment.");
        return;
    }

    commentsPage = 0;
    hasMoreComments = true;
    loadingComments = false;

    updateSingleComment(commentId);

    closeCommentMenu();
}

async function translateComment(commentId) {

    const box = document.getElementById("translation-" + commentId);
    const btn = document.getElementById("translateBtn-" + commentId);

    if (!box || !btn) return;

    // Already showing translation → show original
    if (box.style.display === "block") {

        box.style.display = "none";
        btn.innerHTML = "🌐 See translation";
        return;

    }

    const language = await getPreferredLanguage();

    const { data: comment } = await supabase
        .from("comments")
        .select(`
            content,
            language_code,
            translated_text,
            translation_status
        `)
        .eq("id", commentId)
        .single();

    if (!comment) return;

    // Already translated
    if (
        comment.translation_status === "completed" &&
        comment.translated_text
    ) {

        box.innerHTML = escapeHtml(comment.translated_text);
        box.style.display = "block";
        btn.innerHTML = "Show original";
        return;

    }

    showToast("Translating...");

    const translated = await translateText(
        comment.content,
        comment.language_code || "auto",
        language
    );

    if (!translated) {

        showToast("Translation failed");
        return;

    }

    box.innerHTML = escapeHtml(translated);
    box.style.display = "block";
    btn.innerHTML = "Show original";

    await supabase
        .from("comments")
        .update({
            translated_text: translated,
            translation_status: "completed"
        })
        .eq("id", commentId);

}

async function getPreferredLanguage() {

    const {
        data: { session }
    } = await supabase.auth.getSession();

    if (!session) {
        return navigator.language.split("-")[0];
    }

    const { data } = await supabase
        .from("profiles")
        .select("preferred_language")
        .eq("id", session.user.id)
        .single();

    if (!data) {
        return navigator.language.split("-")[0];
    }

    if (data.preferred_language === "auto") {
        return navigator.language.split("-")[0];
    }

    return data.preferred_language;
}

        );

    }, 600);


    // =================================================
    // CURRENT STATE
    // =================================================

    const historyState =
        history.state || null;

    const navigationState =
        window.appNavigation?.current || null;


    console.log(
        "📌 PROFILE CLOSE STATE:",
        {
            historyScreen:
                historyState?.appScreen || null,

            navigationScreen:
                navigationState?.screen || null,

            historyData:
                historyState?.data || null,

            navigationData:
                navigationState?.data || null
        }
    );


    // =================================================
    // NORMAL CASE
    // PROFILE IS THE CURRENT HISTORY ENTRY
    // =================================================

    if (
        historyState?.appScreen ===
        "profileScreen"
    ) {

        console.log(
            "↩️ PROFILE → HISTORY.BACK()"
        );

        history.back();

        return;
    }


    // =================================================
    // NAVIGATION MIRROR SAYS PROFILE
    // =================================================

    if (
        navigationState?.screen ===
        "profileScreen"
    ) {

        console.log(
            "↩️ PROFILE → NAVIGATION HISTORY.BACK()"
        );

        history.back();

        return;
    }


    // =================================================
    // SAFETY:
    // PROFILE MAY HAVE BEEN RENDERED WITHOUT
    // A PROPER HISTORY ENTRY.
    // =================================================

    console.warn(
        "⚠️ PROFILE HAS NO VALID HISTORY ENTRY"
    );


    // =================================================
    // FALLBACK → PREVIOUS NAVIGATION STATE
    // =================================================

    const previous =
        window.appNavigation?.stack?.length
            ? window.appNavigation.stack[
                window.appNavigation.stack.length - 1
            ]
            : null;


    if (previous?.screen) {

        console.log(
            "↩️ PROFILE FALLBACK → STACK:",
            previous
        );

        window.appNavigation.stack.pop();

        window.appNavigation.current = {
            screen:
                previous.screen,

            data:
                previous.data || {},

            scrollY:
                previous.scrollY || 0,

            timestamp:
                Date.now()
        };

        sessionStorage.setItem(
            "appNavigationState",
            JSON.stringify(
                window.appNavigation.current
            )
        );


        // Restore the previous screen
        // WITHOUT creating another history entry.

        if (
            typeof window.restoreNavigationState ===
            "function"
        ) {

            window.restoreNavigationState({
                screen:
                    previous.screen,

                data:
                    previous.data || {},

                scrollY:
                    previous.scrollY || 0
            });

            return;
        }
    }


    // =================================================
    // FINAL FALLBACK → HOME
    // =================================================

    console.log(
        "🏠 PROFILE → HOME FALLBACK"
    );

    if (
        typeof window.goHome ===
        "function"
    ) {

        window.goHome(false);

    } else {

        console.error(
            "❌ goHome() NOT FOUND"
        );
    }

// =====================================================
// OPEN PROFILE
// CENTRAL NAVIGATION SAFE
// PROFILE CAN OPEN FROM ANY SCREEN
// LOGGED-IN OR LOGGED-OUT USERS
// =====================================================

window.openProfile = async function (
    userId,
    name,
    navigationOptions = {}
) {
    console.log("👤 OPEN PROFILE:", userId);

    // =================================================
    // VALIDATE
    // =================================================

    if (!userId) {
        console.error("❌ Missing profile userId");
        return false;
    }

    const profileRequestId =
        (window._profileOpenRequestId || 0) + 1;

    window._profileOpenRequestId =
        profileRequestId;


    // =================================================
    // DETERMINE CURRENT NAVIGATION STATE
    // =================================================

    const currentNavigation =
        window.appNavigation?.current || null;

    const currentHistory =
        history.state || null;


    // =================================================
    // DETERMINE SOURCE
    // =================================================

    let navigationSource =
        navigationOptions.returnSource ||
        navigationOptions.source ||
        null;

    let sourceData =
        navigationOptions.sourceData ||
        null;


    // =================================================
    // USE CURRENT NAVIGATION STATE FIRST
    // =================================================

    if (!navigationSource) {

        const currentScreen =
            currentNavigation?.screen ||
            currentHistory?.appScreen ||
            null;

        const currentData =
            currentNavigation?.data ||
            currentHistory?.data ||
            {};

        switch (currentScreen) {

            case "commentsScreen":
                navigationSource = "comments";
                sourceData = sourceData || currentData;
                break;

            case "searchScreen":
                navigationSource = "search";
                sourceData = sourceData || currentData;
                break;

            case "notificationsScreen":
                navigationSource = "notifications";
                sourceData = sourceData || currentData;
                break;

            case "inboxScreen":
                navigationSource = "inbox";
                sourceData = sourceData || currentData;
                break;

            case "chatScreen":
                navigationSource = "chat";
                sourceData = sourceData || currentData;
                break;

            case "profileScreen":
                navigationSource = "profile";
                sourceData = sourceData || currentData;
                break;

            case "app":
                navigationSource = "home";
                sourceData = sourceData || currentData;
                break;
        }
    }


    // =================================================
    // VISIBLE SCREEN FALLBACK
    // =================================================

    if (!navigationSource) {

        const isVisible = id => {

            const element =
                document.getElementById(id);

            if (!element) {
                return false;
            }

            const style =
                getComputedStyle(element);

            return (
                style.display !== "none" &&
                style.visibility !== "hidden" &&
                style.opacity !== "0" &&
                style.pointerEvents !== "none"
            );
        };


        if (isVisible("commentsScreen")) {

            navigationSource = "comments";

        }
        else if (isVisible("searchScreen")) {

            navigationSource = "search";

        }
        else if (isVisible("notificationsScreen")) {

            navigationSource = "notifications";

        }
        else if (isVisible("inboxScreen")) {

            navigationSource = "inbox";

        }
        else if (isVisible("chatScreen")) {

            navigationSource = "chat";

        }
        else if (isVisible("profileScreen")) {

            navigationSource = "profile";

        }
        else if (isVisible("app")) {

            navigationSource = "home";
        }
    }


    // =================================================
    // FINAL FALLBACK
    // =================================================

    if (!navigationSource) {
        navigationSource = "home";
    }


    // =================================================
    // SAVE SOURCE
    // =================================================

    window.profileOpenedFrom =
        navigationSource;

    window.profileNavigationSource =
        navigationSource;


    console.log(
        "👤 PROFILE SOURCE:",
        navigationSource,
        sourceData
    );


    // =================================================
    // COMMENTS / REACTION RETURN STATE
    // =================================================

    let profileReturnPostId =
        navigationOptions.postId ||
        null;

    let profileReturnCommentId =
        navigationOptions.commentId

    let profileReturnEmoji =
        navigationOptions.emoji ||
        null;

    let fromReaction =
        navigationOptions.fromReaction === true;


    // =================================================
    // COMMENTS → PROFILE
    // =================================================

        navigationSource === "comments"

        ) {

            profileReturnCommentId =
                window.reactionProfileReturn.commentId
                    ? String(
                        window.reactionProfileReturn.commentId
                    )
                    : profileReturnCommentId;

            profileReturnEmoji =
                window.reactionProfileReturn.emoji ||
                profileReturnEmoji;

            fromReaction = true;
        }


        profileReturnPostId =
            profileReturnPostId ||
            sourceData?.postId ||
            window.commentsReturnPostId ||
            window.currentPostId ||
            null;


        profileReturnCommentId =
            profileReturnCommentId ||
            (
                sourceData?.commentId
                    ? String(sourceData.commentId)
                    : (
                        window.commentsReturnCommentId

                                window.commentsReturnCommentId
                            )
                            : null
                    )

        window.commentsWasOpen =
            true;

        window.commentsReturnPostId =
            profileReturnPostId;

        window.commentsReturnCommentId =
            profileReturnCommentId;
    }

    // =================================================
    // NON-COMMENT PROFILE
    // =================================================

        navigationOptions.restoring !== true &&

            false;

            null;

        window.commentsReturnCommentId =
            null;

            window.reactionProfileReturn =

        }
    }

    // =================================================

        source:

        sourceData:
            sourceData || {},

        postId:
            profileReturnPostId,

        commentId:
            profileReturnCommentId,

    // =================================================

        const {

        } = await supabase

        if (error) {

        }

        );

        );

        return false;
    }

    // =================================================

        window._profileOpenRequestId
    ) {

    ) {
