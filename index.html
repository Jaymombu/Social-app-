// =====================================================
// START COMMENT VOICE RECORDING — STABLE VERSION
// =====================================================

window.startCommentVoiceRecording = async function () {

    console.log("🎙️ START COMMENT VOICE");

    // -------------------------------------------------
    // ALREADY STARTING / RECORDING
    // -------------------------------------------------

    if (
        window.commentRecording ||
        window.commentVoiceStarting
    ) {

        console.log(
            "⚠️ Comment voice already starting/recording"
        );

        return;
    }


    // -------------------------------------------------
    // INITIAL STATE
    // -------------------------------------------------

    window.commentVoiceStarting = true;
    window.commentRecording = false;
    window.commentVoiceStopRequested = false;

    window.commentMediaRecorder = null;
    window.commentAudioChunks = [];


    const voiceBtn =
        window.getCommentVoiceButton();


    // -------------------------------------------------
    // BUTTON UI
    // -------------------------------------------------

    if (voiceBtn) {

        voiceBtn.innerHTML = "⏳";

        voiceBtn.style.background =
            "#ff3040";

        voiceBtn.style.transform =
            "scale(1.08)";
    }


    try {

        // -------------------------------------------------
        // MICROPHONE API CHECK
        // -------------------------------------------------

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Microphone API unavailable"
            );
        }


        console.log(
            "🎤 Requesting microphone permission..."
        );


        // -------------------------------------------------
        // REQUEST MICROPHONE
        // -------------------------------------------------

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: true
            });


        console.log(
            "✅ Microphone permission granted"
        );


        window.commentVoiceStream =
            stream;


        // -------------------------------------------------
        // USER RELEASED DURING PERMISSION POPUP
        // -------------------------------------------------

        if (
            window.commentVoiceStopRequested
        ) {

            console.log(
                "🛑 User released while permission was opening"
            );


            stream
                .getTracks()
                .forEach(
                    track => track.stop()
                );


            window.commentVoiceStream =
                null;

            window.commentVoiceStarting =
                false;

            window.commentRecording =
                false;

            window.resetCommentVoiceButton();

            return;
        }


        // -------------------------------------------------
        // FIND SUPPORTED FORMAT
        // -------------------------------------------------

        let mimeType = "";


        if (
            typeof MediaRecorder !==
            "undefined"
        ) {

            if (
                MediaRecorder.isTypeSupported(
                    "audio/webm;codecs=opus"
                )
            ) {

                mimeType =
                    "audio/webm;codecs=opus";

            }

            else if (
                MediaRecorder.isTypeSupported(
                    "audio/webm"
                )
            ) {

                mimeType =
                    "audio/webm";

            }

            else if (
                MediaRecorder.isTypeSupported(
                    "audio/mp4"
                )
            ) {

                mimeType =
                    "audio/mp4";

            }

        }


        // -------------------------------------------------
        // CREATE RECORDER
        // -------------------------------------------------

        let recorder;


        if (mimeType) {

            recorder =
                new MediaRecorder(
                    stream,
                    {
                        mimeType:
                            mimeType
                    }
                );

        }

        else {

            recorder =
                new MediaRecorder(
                    stream
                );

        }


        window.commentMediaRecorder =
            recorder;


        window.commentVoiceMimeType =
            recorder.mimeType ||
            mimeType ||
            "audio/webm";


        // -------------------------------------------------
        // DATA AVAILABLE
        // -------------------------------------------------

        recorder.ondataavailable =
            function (event) {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    window.commentAudioChunks.push(
                        event.data
                    );

                }

            };


        // -------------------------------------------------
        // RECORDER STOPPED
        // -------------------------------------------------

        recorder.onstop =
            function () {

                console.log(
                    "🛑 COMMENT RECORDER STOPPED"
                );


                const blob =
                    new Blob(
                        window.commentAudioChunks,
                        {
                            type:
                                recorder.mimeType ||
                                window.commentVoiceMimeType ||
                                "audio/webm"
                        }
                    );


                // -----------------------------------------
                // STOP MICROPHONE
                // -----------------------------------------

                if (
                    window.commentVoiceStream
                ) {

                    window.commentVoiceStream
                        .getTracks()
                        .forEach(
                            track => track.stop()
                        );

                }


                window.commentVoiceStream =
                    null;

                window.commentMediaRecorder =
                    null;

                window.commentAudioChunks =
                    [];

                window.commentRecording =
                    false;

                window.commentVoiceStarting =
                    false;


                window.resetCommentVoiceButton();


                // -----------------------------------------
                // CHECK RECORDING
                // -----------------------------------------

                if (
                    !blob ||
                    blob.size === 0
                ) {

                    console.warn(
                        "⚠️ No audio recorded"
                    );

                    return;
                }


                // -----------------------------------------
                // SAVE BLOB
                // -----------------------------------------

                window.recordedVoiceBlob =
                    blob;


                // -----------------------------------------
                // REMOVE OLD URL
                // -----------------------------------------

                if (
                    window.recordedVoiceUrl
                ) {

                    URL.revokeObjectURL(
                        window.recordedVoiceUrl
                    );

                }


                // -----------------------------------------
                // CREATE PREVIEW
                // -----------------------------------------

                window.recordedVoiceUrl =
                    URL.createObjectURL(
                        blob
                    );


                console.log(
                    "✅ VOICE READY:",
                    blob.size,
                    blob.type
                );


                // -----------------------------------------
                // SHOW PREVIEW
                // -----------------------------------------

                if (
                    typeof window.showVoicePreview ===
                    "function"
                ) {

                    window.showVoicePreview();

                }

            };


        // -------------------------------------------------
        // RECORDER ERROR
        // -------------------------------------------------

        recorder.onerror =
            function (event) {

                console.error(
                    "❌ COMMENT RECORDER ERROR:",
                    event
                );

            };


        // -------------------------------------------------
        // NOW RECORDING
        // -------------------------------------------------

        window.commentVoiceStarting =
            false;

        window.commentRecording =
            true;


        if (voiceBtn) {

            voiceBtn.innerHTML =
                "🔴";

        }


        // -------------------------------------------------
        // START
        // -------------------------------------------------

        recorder.start();


        console.log(
            "🎙️ COMMENT RECORDER STARTED"
        );


        // -------------------------------------------------
        // RELEASE HAPPENED DURING STARTUP
        // -------------------------------------------------

        if (
            window.commentVoiceStopRequested
        ) {

            console.log(
                "🛑 Stop requested immediately"
            );


            if (
                recorder.state !==
                "inactive"
            ) {

                recorder.stop();

            }

        }

    }

    catch (error) {

        console.error(
            "❌ COMMENT VOICE START ERROR:",
            error
        );


        // -------------------------------------------------
        // STOP STREAM
        // -------------------------------------------------

        if (
            window.commentVoiceStream
        ) {

            window.commentVoiceStream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }


        // -------------------------------------------------
        // RESET
        // -------------------------------------------------

        window.commentVoiceStream =
            null;

        window.commentMediaRecorder =
            null;

        window.commentAudioChunks =
            [];

        window.commentRecording =
            false;

        window.commentVoiceStarting =
            false;

        window.commentVoiceStopRequested =
            false;


        window.resetCommentVoiceButton();


        // -------------------------------------------------
        // ERROR MESSAGE
        // -------------------------------------------------

        if (
            error.name ===
            "NotAllowedError"
        ) {

            if (
                typeof showToast ===
                "function"
            ) {

                showToast(
                    "Microphone permission was denied."
                );

            }

        }

        else {

            if (
                typeof showToast ===
                "function"
            ) {

                showToast(
                    "Could not start voice recording."
                );

            }

        }

    }

};

// =====================================================
// STOP COMMENT VOICE RECORDING
// =====================================================

window.stopCommentVoiceRecording = function () {

    console.log(
        "🛑 stopCommentVoiceRecording() called"
    );

    // -------------------------------------------------
    // NOTHING RECORDING
    // -------------------------------------------------

    if (!window.commentRecording) {

        console.log(
            "ℹ️ No comment recording active"
        );

        return;
    }


    // -------------------------------------------------
    // TELL START FUNCTION TO STOP
    // -------------------------------------------------

    window.commentVoiceStopRequested = true;


    // -------------------------------------------------
    // CHECK FOR RECORDER
    // -------------------------------------------------

    const stopWhenReady = function () {

        const recorder =
            window.commentMediaRecorder;


        // ---------------------------------------------
        // RECORDER STILL NOT READY
        // ---------------------------------------------

        if (!recorder) {

            console.log(
                "⏳ Waiting for recorder..."
            );

            setTimeout(
                stopWhenReady,
                50
            );

            return;
        }


        // ---------------------------------------------
        // RECORDER ALREADY STOPPED
        // ---------------------------------------------

        if (
            recorder.state === "inactive"
        ) {

            console.log(
                "ℹ️ Recorder already inactive"
            );

            return;
        }


        // ---------------------------------------------
        // STOP RECORDER
        // ---------------------------------------------

        try {

            console.log(
                "🛑 Stopping recorder:",
                recorder.state
            );

            recorder.stop();

        }

        catch (error) {

            console.error(
                "❌ Error stopping recorder:",
                error
            );

        }

    };


    stopWhenReady();

};

// =====================================================
// FORMAT VOICE TIME
// =====================================================

window.formatVoiceTime = function (seconds) {

    if (
        !Number.isFinite(seconds) ||
        seconds < 0
    ) {
        return "0:00";
    }

    const minutes =
        Math.floor(seconds / 60);

    const remainingSeconds =
        Math.floor(seconds % 60);

    return (
        minutes +
        ":" +
        String(remainingSeconds).padStart(2, "0")
    );
};

// =====================================================
// SETUP COMMENT VOICE BUTTON
// HOLD = RECORD
// RELEASE = STOP
// =====================================================

window.setupCommentVoiceButton = function () {

    const voiceBtn =
        document.getElementById("voiceBtn");


    // -------------------------------------------------
    // BUTTON NOT FOUND
    // -------------------------------------------------

    if (!voiceBtn) {

        console.log(
            "⏳ Comment voice button not found yet"
        );

        return false;
    }


    // -------------------------------------------------
    // PREVENT DUPLICATE LISTENERS
    // -------------------------------------------------

    if (
        voiceBtn.dataset.commentVoiceReady === "true"
    ) {

        console.log(
            "✅ Comment voice button already connected"
        );

        return true;
    }


    console.log(
        "🎤 Connecting comment voice button..."
    );


    voiceBtn.dataset.commentVoiceReady =
        "true";


    let pressStarted = false;


    // =================================================
    // START RECORDING
    // =================================================

    const startRecording = function (event) {

        event.preventDefault();
        event.stopPropagation();


        if (pressStarted) {
            return;
        }


        pressStarted = true;


        console.log(
            "🎙️ COMMENT VOICE PRESS DOWN"
        );


        if (
            typeof window.startCommentVoiceRecording ===
            "function"
        ) {

            window.startCommentVoiceRecording();

        }

        else {

            console.error(
                "❌ startCommentVoiceRecording is missing"
            );

            pressStarted = false;

        }

    };


    // =================================================
    // STOP RECORDING
    // =================================================

    const stopRecording = function (event) {

        if (event) {

            event.preventDefault();
            event.stopPropagation();

        }


        if (!pressStarted) {
            return;
        }


        pressStarted = false;


        console.log(
            "🛑 COMMENT VOICE RELEASE"
        );


        if (
            typeof window.stopCommentVoiceRecording ===
            "function"
        ) {

            window.stopCommentVoiceRecording();

        }

        else {

            console.error(
                "❌ stopCommentVoiceRecording is missing"
            );

        }

    };


    // =================================================
    // POINTER DOWN
    // =================================================

    voiceBtn.addEventListener(
        "pointerdown",
        startRecording,
        {
            passive: false
        }
    );


    // =================================================
    // POINTER UP
    // =================================================

    voiceBtn.addEventListener(
        "pointerup",
        stopRecording,
        {
            passive: false
        }
    );


    // =================================================
    // POINTER CANCEL
    // =================================================

    voiceBtn.addEventListener(
        "pointercancel",
        stopRecording,
        {
            passive: false
        }
    );


    // =================================================
    // POINTER LEAVES BUTTON
    // =================================================

    voiceBtn.addEventListener(
        "pointerleave",
        function (event) {

            if (pressStarted) {

                stopRecording(event);

            }

        },
        {
            passive: false
        }
    );


    // =================================================
    // FINGER RELEASED OUTSIDE BUTTON
    // =================================================

    voiceBtn.addEventListener(
        "pointerup",
        function (event) {

            if (pressStarted) {

                stopRecording(event);

            }

        },
        {
            passive: false
        }
    );


    console.log(
        "✅ COMMENT voice button connected"
    );


    return true;

};

// =====================================================
// SHOW VOICE COMMENT PREVIEW
// =====================================================

window.showVoicePreview = function () {

    const preview =
        document.getElementById("voicePreview");

    const audio =
        document.getElementById("voicePreviewAudio");

    const playBtn =
        document.getElementById("voicePreviewPlay");

    const time =
        document.getElementById("voicePreviewTime");

    const deleteBtn =
        document.getElementById("voicePreviewDelete");

    const postBtn =
        document.getElementById("voicePreviewPost");


    // =================================================
    // CHECK ELEMENTS
    // =================================================

    if (!preview || !audio) {

        console.warn(
            "⚠️ Voice preview HTML not found"
        );

        return false;
    }


    if (!window.recordedVoiceUrl) {

        console.warn(
            "⚠️ No recorded voice URL"
        );

        return false;
    }


    // =================================================
    // LOAD AUDIO
    // =================================================

    audio.pause();

    audio.src =
        window.recordedVoiceUrl;

    audio.currentTime = 0;


    // =================================================
    // SHOW PREVIEW
    // =================================================

    preview.style.display = "block";


    if (playBtn) {

        playBtn.innerHTML = "▶";

    }


    if (time) {

        time.textContent = "0:00";

    }


    // =================================================
    // PLAY / PAUSE PREVIEW
    // =================================================

    if (playBtn) {

        playBtn.onclick =
            async function (event) {

                event.preventDefault();

                event.stopPropagation();


                if (audio.paused) {

                    try {

                        await audio.play();

                        playBtn.innerHTML = "⏸";

                    }

                    catch (error) {

                        console.error(
                            "❌ Preview playback error:",
                            error
                        );

                    }

                }

                else {

                    audio.pause();

                    playBtn.innerHTML = "▶";

                }

            };

    }


    // =================================================
    // TIME UPDATE
    // =================================================

    audio.ontimeupdate =
        function () {

            if (time) {

                time.textContent =
                    window.formatVoiceTime(
                        audio.currentTime
                    );

            }

        };


    // =================================================
    // AUDIO ENDED
    // =================================================

    audio.onended =
        function () {

            if (playBtn) {

                playBtn.innerHTML = "▶";

            }

        };


    // =================================================
    // DELETE
    // =================================================

    if (deleteBtn) {

        deleteBtn.onclick =
            function (event) {

                event.preventDefault();

                event.stopPropagation();

                window.clearVoicePreview();

            };

    }


    // =================================================
    // POST
    // =================================================

    if (postBtn) {

        postBtn.onclick =
            async function (event) {

                event.preventDefault();

                event.stopPropagation();


                if (
                    !window.recordedVoiceBlob ||
                    window.recordedVoiceBlob.size === 0
                ) {

                    if (
                        typeof showToast ===
                        "function"
                    ) {

                        showToast(
                            "No voice recording."
                        );

                    }

                    return;

                }


                postBtn.disabled = true;

                postBtn.innerHTML = "⏳";


                try {

                    const success =
                        await window.uploadVoiceComment(
                            window.recordedVoiceBlob
                        );


                    if (success) {

                        window.clearVoicePreview();

                    }

                }

                catch (error) {

                    console.error(
                        "❌ Voice comment post error:",
                        error
                    );

                    if (
                        typeof showToast ===
                        "function"
                    ) {

                        showToast(
                            "Couldn't post voice comment."
                        );

                    }

                }

                finally {

                    postBtn.disabled = false;

                    postBtn.innerHTML = "➤";

                }

            };

    }


    console.log(
        "🎧 Voice preview ready"
    );


    return true;

};

// =====================================================
// CLEAR VOICE COMMENT PREVIEW
// =====================================================

window.clearVoicePreview = function () {

    const preview =
        document.getElementById("voicePreview");

    const audio =
        document.getElementById("voicePreviewAudio");


    // =================================================
    // STOP AUDIO
    // =================================================

    if (audio) {

        audio.pause();

        audio.currentTime = 0;

        audio.removeAttribute("src");

        audio.load();

    }


    // =================================================
    // RELEASE OBJECT URL
    // =================================================

    if (window.recordedVoiceUrl) {

        try {

            URL.revokeObjectURL(
                window.recordedVoiceUrl
            );

        }

        catch (error) {

            console.warn(
                "⚠️ Could not revoke voice URL:",
                error
            );

        }

    }


    // =================================================
    // CLEAR RECORDING DATA
    // =================================================

    window.recordedVoiceUrl = null;

    window.recordedVoiceBlob = null;


    // =================================================
    // HIDE PREVIEW
    // =================================================

    if (preview) {

        preview.style.display = "none";

    }


    // =================================================
    // RESET PREVIEW BUTTONS
    // =================================================

    const playBtn =
        document.getElementById(
            "voicePreviewPlay"
        );

    const postBtn =
        document.getElementById(
            "voicePreviewPost"
        );


    if (playBtn) {

        playBtn.innerHTML = "▶";

    }


    if (postBtn) {

        postBtn.disabled = false;

        postBtn.innerHTML = "➤";

    }


    console.log(
        "🧹 Voice preview cleared"
    );

};

window.toggleVoice = function(id) {

    const audio =
        document.getElementById(
            "voiceAudio-" + id
        );

    const btn =
        document.getElementById(
            "voiceBtn-" + id
        );

    const waveform =
        document.getElementById(
            "voiceWaveform-" + id
        );

    const time =
        document.getElementById(
            "voiceTime-" + id
        );

    const player =
        document.getElementById(
            "commentVoice-" + id
        );


    if (!audio || !btn) {
        return;
    }


    // =================================================
    // CREATE WAVEFORM IF NEEDED
    // =================================================

    if (
        waveform &&
        !waveform.querySelector(
            ".voiceWaveBar"
        )
    ) {

        window.createVoiceWaveform(id);

    }


    // =================================================
    // STOP OTHER VOICE COMMENTS
    // =================================================

    document
        .querySelectorAll(
            ".commentVoice audio"
        )
        .forEach(function(otherAudio) {

            if (otherAudio !== audio) {

                otherAudio.pause();

                otherAudio.currentTime = 0;


                const otherId =
                    otherAudio.id.replace(
                        "voiceAudio-",
                        ""
                    );


                const otherBtn =
                    document.getElementById(
                        "voiceBtn-" + otherId
                    );


                if (otherBtn) {

                    otherBtn.innerHTML =
                        "▶";

                }


                const otherPlayer =
                    document.getElementById(
                        "commentVoice-" + otherId
                    );


                if (otherPlayer) {

                    otherPlayer.classList.remove(
                        "playing"
                    );

                }


                const otherWave =
                    document.getElementById(
                        "voiceWaveform-" + otherId
                    );


                if (otherWave) {

                    otherWave
                        .querySelectorAll(
                            ".voiceWaveBar"
                        )
                        .forEach(
                            function(bar) {

                                bar.classList.remove(
                                    "played"
                                );

                            }
                        );

                }

            }

        });


    // =================================================
    // PLAY
    // =================================================

    if (audio.paused) {

        audio.play()
            .then(function() {

                btn.innerHTML =
                    "⏸";


                if (player) {

                    player.classList.add(
                        "playing"
                    );

                }


                window.animateVoiceWaveform(
                    id,
                    audio
                );

            })
            .catch(function(error) {

                console.error(
                    "❌ Voice playback error:",
                    error
                );

            });

    }


    // =================================================
    // PAUSE
    // =================================================

    else {

        audio.pause();

        btn.innerHTML =
            "▶";


        if (player) {

            player.classList.remove(
                "playing"
            );

        }

    }


    // =================================================
    // PROGRESS
    // =================================================

    audio.ontimeupdate =
        function() {

            const percent =
                audio.duration &&
                isFinite(audio.duration)

                    ? (
                        audio.currentTime /
                        audio.duration
                    ) * 100

                    : 0;


            if (time) {

                time.textContent =
                    window.formatVoiceTime(
                        audio.currentTime
                    );

            }


            const bars =
                waveform
                    ? waveform.querySelectorAll(
                        ".voiceWaveBar"
                    )
                    : [];


            const activeBars =
                Math.floor(
                    (percent / 100) *
                    bars.length
                );


            bars.forEach(
                function(bar, index) {

                    if (
                        index <
                        activeBars
                    ) {

                        bar.classList.add(
                            "played"
                        );

                    }

                    else {

                        bar.classList.remove(
                            "played"
                        );

                    }

                }
            );

        };


    // =================================================
    // ENDED
    // =================================================

    audio.onended =
        function() {

            btn.innerHTML =
                "▶";


            if (player) {

                player.classList.remove(
                    "playing"
                );

            }


            if (time) {

                time.textContent =
                    window.formatVoiceTime(
                        audio.duration || 0
                    );

            }


            const bars =
                waveform
                    ? waveform.querySelectorAll(
                        ".voiceWaveBar"
                    )
                    : [];


            bars.forEach(
                function(bar) {

                    bar.classList.remove(
                        "played"
                    );

                }
            );

        };

};

// =====================================================
// CREATE CLASSIC VOICE WAVEFORM
// =====================================================

window.createVoiceWaveform = function(id) {

    const waveform =
        document.getElementById(
            "voiceWaveform-" + id
        );

    if (!waveform) {
        return;
    }

    waveform.innerHTML = "";

    const bars = 28;

    for (let i = 0; i < bars; i++) {

        const bar =
            document.createElement("span");

        bar.className =
            "voiceWaveBar";

        const height =
            6 + Math.floor(
                Math.random() * 20
            );

        const delay =
            (Math.random() * 0.7).toFixed(2);

        bar.style.setProperty(
            "--wave-height",
            height + "px"
        );

        bar.style.setProperty(
            "--wave-delay",
            delay + "s"
        );

        waveform.appendChild(bar);
    }

    console.log(
        "〰️ Classic voice waveform created:",
        id
    );
};


// =====================================================
// START VOICE WAVE ANIMATION
// =====================================================

window.animateVoiceWaveform = function(id, audio) {

    const player =
        document.getElementById(
            "commentVoice-" + id
        );

    if (!player || !audio) {
        return;

    if (audio.paused || audio.ended) {
        player.classList.remove("playing");
        return;
    }

    player.classList.add("playing");

};


// =====================================================
// INITIALIZE ALL VOICE COMMENT WAVEFORMS
// =====================================================

window.initVoiceCommentWaveforms = function() {

        document.querySelectorAll(
            ".commentVoice"
        );

    players.forEach(function(player) {

// =====================================================
// CONNECT ALL VOICE WAVEFORM CONTROLS
// =====================================================

window.connectVoiceWaveforms = function() {

    const players =
        document.querySelectorAll(
            ".commentVoice"
        );

    players.forEach(function(player) {

        const id =
            player.id.replace(
                "commentVoice-",
                ""
            );

        if (!id) {
            return;
        }

        // Create waveform first
        const waveform =
            document.getElementById(
                "voiceWaveform-" + id
            );

        if (
            waveform &&
            !waveform.querySelector(
                ".voiceWaveBar"
            )
        ) {

            window.createVoiceWaveform(id);

        }

        // Connect seeking
        if (
            typeof window.setupVoiceWaveformSeek ===
            "function"
        ) {

            window.setupVoiceWaveformSeek(id);

        }

    });

    console.log(
        "🎯 Voice waveform controls connected:",
        players.length
    );

};


// =====================================================
// CLICK WAVEFORM TO SEEK
// =====================================================

window.setupVoiceWaveformSeek = function(id) {

    const waveform =
        document.getElementById(
            "voiceWaveform-" + id
        );

    const audio =
        document.getElementById(
            "voiceAudio-" + id
        );

    if (!waveform || !audio) {
        return;
    }

    waveform.onclick = function(event) {

        if (
            !audio.duration ||
            !isFinite(audio.duration)
        ) {
            return;
        }

        const rect =
            waveform.getBoundingClientRect();

        const clickPosition =
            event.clientX - rect.left;

        const percentage =
            Math.max(
                0,
                Math.min(
                    1,
                    clickPosition / rect.width
                )
            );

        audio.currentTime =
            percentage * audio.duration;

        console.log(
            "🎯 Voice seek:",
            Math.round(percentage * 100) + "%"
        );

    };

};

// =====================================================
// UPLOAD VOICE COMMENT
// =====================================================

window.uploadVoiceComment = async function(blob) {

    // -------------------------------------------------
    // CHECK BLOB
    // -------------------------------------------------

    if (!blob || blob.size === 0) {

        showToast("No voice recording.");

        return false;
    }


    // -------------------------------------------------
    // SESSION
    // -------------------------------------------------

    let sessionResult;

    try {

        sessionResult =
            await supabase.auth.getSession();

    }

    catch (error) {

        console.error(
            "Voice session error:",
            error
        );

        return false;
    }


    const session =
        sessionResult?.data?.session;


    if (!session) {

        showToast(
            "Login to post a voice comment."
        );

        return false;
    }


    // -------------------------------------------------
    // POST CHECK
    // -------------------------------------------------

    if (!currentPostId) {

        showToast(
            "Could not find this post."
        );

        return false;
    }


    // -------------------------------------------------
    // MIME TYPE
    // -------------------------------------------------

    const mimeType =
        blob.type ||
        "audio/webm";


    let extension = "webm";


    if (mimeType.includes("mp4")) {

        extension = "mp4";

    }

    else if (mimeType.includes("ogg")) {

        extension = "ogg";

    }

    else if (mimeType.includes("wav")) {

        extension = "wav";
    }


    // -------------------------------------------------
    // FILE NAME
    // -------------------------------------------------

    const fileName =
        "voice_" +
        Date.now() +
        "_" +
        Math.random()
            .toString(36)
            .slice(2) +
        "." +
        extension;


    // -------------------------------------------------
    // UPLOAD
    // -------------------------------------------------

    let uploadResult;

    try {

        uploadResult =
            await supabase
                .storage
                .from("voice-notes")
                .upload(
                    fileName,
                    blob,
                    {
                        upsert: false,
                        contentType: mimeType
                    }
                );

    }

    catch (error) {

        console.error(
            "Voice upload exception:",
            error
        );

        showToast(
            "Couldn't upload voice comment."
        );

        return false;
    }


    if (uploadResult.error) {

        console.error(
            "Voice storage upload failed:",
            uploadResult.error
        );

        showToast(
            "Couldn't upload voice comment."
        );

        return false;
    }


    // -------------------------------------------------
    // PUBLIC URL
    // -------------------------------------------------

    const {
        data: urlData
    } =
        supabase
            .storage
            .from("voice-notes")
            .getPublicUrl(
                fileName
            );


    if (!urlData?.publicUrl) {

        console.error(
            "Could not create voice public URL"
        );

        showToast(
            "Couldn't create voice URL."
        );

        return false;
    }


    // -------------------------------------------------
    // REPLY DATA
    // -------------------------------------------------

    const parentId =
        window.replyingToComment
            ? String(
                window.replyingToComment
            )
            : null;

window.initCommentVoiceSystem = function () {

    console.log(
        "🎤 Initializing comment voice system..."
    );


    // -------------------------------------------------
    // TRY TO CONNECT BUTTON
    // -------------------------------------------------

    const connectButton = function () {

        const voiceBtn =
            document.getElementById("voiceBtn");


        if (!voiceBtn) {

            return false;
        }


        return window.setupCommentVoiceButton();

    };


    // -------------------------------------------------
    // BUTTON ALREADY EXISTS
    // -------------------------------------------------

    if (connectButton()) {

        console.log(
            "✅ Comment voice button connected immediately"
        );

        return true;
    }


    // -------------------------------------------------
    // WATCH FOR COMMENTS UI
    // -------------------------------------------------

    if (
        !document.body
    ) {

        return false;
    }


    // Remove previous observer if one exists

    if (
        window.commentVoiceObserver
    ) {

        try {

            window.commentVoiceObserver.disconnect();

        }

        catch (error) {

            console.warn(
                "⚠️ Could not disconnect old observer:",
                error
            );

        }

    }


    const observer =
        new MutationObserver(
            function () {

                if (connectButton()) {

                    observer.disconnect();

                    window.commentVoiceObserver =
                        null;

                    console.log(
                        "✅ Comment voice button found and connected"
                    );

                }

            }
        );


    observer.observe(
        document.body,
        {
            childList: true,
            subtree: true
        }
    );


    window.commentVoiceObserver =
        observer;


    console.log(
        "👀 Waiting for comments voice button..."
    );


    return false;

};

function renderCommentReads(comment) {

    if (!comment.comment_reads || comment.comment_reads.length === 0) {
        return "";
    }

    const readers = [
    ...new Set(
        comment.comment_reads
        .map(r => r.profiles?.name)
        .filter(Boolean)
    )
];

    if (readers.length === 0) return "";

    let text = "";

    if (readers.length === 1) {
        text = `Seen by ${readers[0]}`;
    } else if (readers.length === 2) {
        text = `Seen by ${readers[0]} and ${readers[1]}`;
    } else {
        text = `Seen by ${readers[0]}, ${readers[1]} and ${readers.length - 2} others`;
    }

    return `
   <div
class="commentReads"
style="
margin-top:8px;
font-size:12px;
color:#8e8e8e;
">
        👁 ${text}
    </div>
    `;
}

window.renderCommentReactions = function(comment) {

    if (
        !comment ||
        !Array.isArray(comment.comment_reactions) ||
        comment.comment_reactions.length === 0
    ) {
        return "";
    }

    const grouped = {};

    comment.comment_reactions.forEach(
        reaction => {

            if (
                !reaction ||
                !reaction.emoji
            ) {
                return;
            }

            if (
                !grouped[reaction.emoji]
            ) {
                grouped[reaction.emoji] = [];
            }

            grouped[reaction.emoji].push(
                reaction.user_id
            );
        }
    );

    return Object.entries(grouped)
        .map(([emoji, users]) => {

            return `
                <span
                    class="commentReactionBadge"
                    data-comment-id="${comment.id}"
                    data-reaction-emoji="${escapeHtml(emoji)}"
                    style="
                        display:inline-flex;
                        align-items:center;
                        gap:4px;
                        background:#232323;
                        color:white;
                        border-radius:15px;
                        padding:5px 9px;
                        font-size:13px;
                        cursor:pointer;
                        user-select:none;
                    "
                >
                    ${escapeHtml(emoji)}

                    <span
                        style="
                            color:#aaa;
                            font-size:11px;
                        "
                    >
                        ${users.length}
                    </span>
                </span>
            `;

        })
        .join("");
};

window.selectCommentReaction = async function(emoji) {

    const commentId = reactionCommentId;

    if (!commentId) {
        console.warn("No reaction comment selected");
        return;
    }

    /*
     * -----------------------------------------
     * CLOSE PICKER IMMEDIATELY
     * -----------------------------------------
     */

    const picker =
        document.getElementById("reactionPicker");

    if (picker) {

        picker.style.transform =
            "translateX(-50%) scale(0)";

        setTimeout(() => {

            picker.style.display = "none";

        }, 200);
    }

    /*
     * -----------------------------------------
     * GET SESSION
     * -----------------------------------------
     */

    const {
        data: { session },
        error: sessionError
    } = await supabase.auth.getSession();

    if (sessionError) {

        console.error(
            "Reaction session error:",
            sessionError
        );

        return;
    }

    /*
     * Reactions require login
     */

    if (!session) {
        return;
    }

    const userId =
        session.user.id;

    /*
     * -----------------------------------------
     * PREVENT DOUBLE REQUEST
     * -----------------------------------------
     */

    if (
        window.reactionProcessing &&
        window.reactionProcessing[commentId]
    ) {
        return;
    }

    window.reactionProcessing =
        window.reactionProcessing || {};

    window.reactionProcessing[commentId] = true;

    try {

        /*
         * -----------------------------------------
         * GET CURRENT REACTION
         * -----------------------------------------
         */

        const {
            data: existing,
            error: existingError
        } = await supabase
            .from("comment_reactions")
            .select(`
                id,
                emoji
            `)
            .eq(
                "comment_id",
                commentId
            )
            .eq(
                "user_id",
                userId
            )
            .maybeSingle();

        if (existingError) {

            console.error(
                "Check comment reaction:",
                existingError
            );

            return;
        }

        /*
         * -----------------------------------------
         * SAME EMOJI
         * REMOVE IT
         * -----------------------------------------
         */

        if (
            existing &&
            existing.emoji === emoji
        ) {

            const {
                error: deleteError
            } = await supabase
                .from("comment_reactions")
                .delete()
                .eq(
                    "id",
                    existing.id
                );

            if (deleteError) {

                console.error(
                    "Remove reaction:",
                    deleteError
                );

                return;
            }

            /*
             * Update UI immediately
             */

            await refreshCommentReactionUI(
                commentId
            );

            closeCommentMenu();

            return;
        }

        /*
         * -----------------------------------------
         * CHANGE EXISTING REACTION
         * -----------------------------------------
         */

        if (existing) {

            const {
                error: updateError
            } = await supabase
                .from("comment_reactions")
                .update({
                    emoji: emoji
                })
                .eq(
                    "id",
                    existing.id
                );

            if (updateError) {

                console.error(
                    "Change reaction:",
                    updateError
                );

                return;
            }

        }

        /*
         * -----------------------------------------
         * INSERT NEW REACTION
         * -----------------------------------------
         */

        else {

            const {
                error: insertError
            } = await supabase
                .from("comment_reactions")
                .insert({
                    comment_id:
                        commentId,

                    user_id:
                        userId,

                    emoji:
                        emoji
                });

            if (insertError) {

                console.error(
                    "Insert reaction:",
                    insertError
                );

                return;
            }
        }

        /*
         * -----------------------------------------
         * UPDATE REACTION UI IMMEDIATELY
         * -----------------------------------------
         */

        await refreshCommentReactionUI(
            commentId
        );

        /*
         * -----------------------------------------
         * GET COMMENT OWNER
         * -----------------------------------------
         */

        const {
            data: comment,
            error: commentError
        } = await supabase
            .from("comments")
            .select(`
                user_id,
                post_id
            `)
            .eq(
                "id",
                commentId
            )
            .single();

        if (commentError) {

            console.error(
                "Get comment owner:",
                commentError
            );

            return;
        }

        /*
         * -----------------------------------------
         * DON'T NOTIFY YOURSELF
         * -----------------------------------------
         */

        if (
            !comment ||
            comment.user_id === userId
        ) {
            return;
        }

        /*
         * -----------------------------------------
         * GET SENDER PROFILE
         * -----------------------------------------
         */

        const {
            data: profile,
            error: profileError
        } = await supabase
            .from("profiles")
            .select(`
                name,
                avatar_url
            `)
            .eq(
                "id",
                userId
            )
            .single();

        if (profileError || !profile) {

            console.error(
                "Get reaction profile:",
                profileError
            );

            return;
        }

        /*
         * -----------------------------------------
         * CHECK EXISTING NOTIFICATION
         * -----------------------------------------
         */

        const {
            data: existingNotif,
            error: notifCheckError
        } = await supabase
            .from("notifications")
            .select("*")
            .eq(
                "user_id",
                comment.user_id
            )
            .eq(
                "sender_id",
                userId
            )
            .eq(
                "type",
                "comment_reaction"
            )
            .eq(
                "comment_id",
                commentId
            )
            .maybeSingle();

        if (notifCheckError) {

            console.error(
                "Reaction notification check:",
                notifCheckError
            );
        }

        /*
         * -----------------------------------------
         * UPDATE NOTIFICATION
         * -----------------------------------------
         */

        if (existingNotif) {

            const {
                error: notifUpdateError
            } = await supabase
                .from("notifications")
                .update({

                    count:
                        (existingNotif.count || 1) + 1,

                    username:
                        profile.name,

                    avatar_url:
                        profile.avatar_url,

                    message:
                        `reacted ${emoji} to your comment`,

                    last_time:
                        new Date(),

                    read:
                        false
                })
                .eq(
                    "id",
                    existingNotif.id
                );

            if (notifUpdateError) {

                console.error(
                    "Update reaction notification:",
                    notifUpdateError
                );
            }

        }

        /*
         * -----------------------------------------
         * CREATE NOTIFICATION
         * -----------------------------------------
         */

        else {

            const {
                error: notifInsertError
            } = await supabase
                .from("notifications")
                .insert({

                    user_id:
                        comment.user_id,

                    sender_id:
                        userId,

                    username:
                        profile.name,

                    avatar_url:
                        profile.avatar_url,

                    type:
                        "comment_reaction",

                    comment_id:
                        commentId,

                    post_id:
                        comment.post_id,

                    message:
                        `reacted ${emoji} to your comment`,

                    count:
                        1,

                    created_at:
                        new Date(),

                    last_time:
                        new Date(),

                    read:
                        false
                });

            if (notifInsertError) {

                console.error(
                    "Insert reaction notification:",
                    notifInsertError
                );
            }
        }

    } finally {

        window.reactionProcessing[commentId] =
            false;
    }

    closeCommentMenu();
};

window.refreshCommentReactionUI = async function(commentId) {

    if (!commentId) return;

    const {
        data: reactions,
        error
    } = await supabase
        .from("comment_reactions")
        .select(`
            id,
            user_id,
            emoji
        `)
        .eq(
            "comment_id",
            commentId
        );

    if (error) {

        console.error(
            "Refresh reaction UI:",
            error
        );

        return;
    }

    /*
     * -----------------------------------------
     * FIND COMMENT ELEMENT
     * -----------------------------------------
     */

    const comment =
        document.getElementById(
            "comment-" + commentId
        );

    if (!comment) {
        return;
    }

    /*
     * -----------------------------------------
     * FIND REACTION CONTAINER
     * -----------------------------------------
     */

    let reactionContainer =
        comment.querySelector(
            ".commentReactions"
        );

    if (!reactionContainer) {
        return;
    }

    /*
     * -----------------------------------------
     * EMPTY
     * -----------------------------------------
     */

    if (
        !Array.isArray(reactions) ||
        reactions.length === 0
    ) {

        reactionContainer.innerHTML = "";

        return;
    }

    /*
     * -----------------------------------------
     * GROUP REACTIONS
     * -----------------------------------------
     */

    const grouped = {};

    reactions.forEach(reaction => {

        if (!reaction.emoji) {
            return;
        }

        if (!grouped[reaction.emoji]) {

            grouped[reaction.emoji] = 0;
        }

        grouped[reaction.emoji]++;
    });

    /*
     * -----------------------------------------
     * RENDER REACTIONS
     * -----------------------------------------
     */

    reactionContainer.innerHTML =
        Object.entries(grouped)
            .map(
                ([emoji, count]) => `
                    <span
                        style="
                            display:inline-flex;
                            align-items:center;
                            gap:4px;
                            background:#232323;
                            border-radius:14px;
                            padding:4px 8px;
                            font-size:13px;
                        "
                    >
                        ${escapeHtml(emoji)}

                        ${
                            count > 1
                            ? `
                                <span
                                    style="
                                        color:#aaa;
                                        font-size:11px;
                                    "
                                >
                                    ${count}
                                </span>
                            `
                            : ""
                        }
                    </span>
                `
            )
            .join("");
};

async function updateSingleComment(commentId) {

    const {
        data: { session }
    } = await supabase.auth.getSession();

    const myId = session?.user?.id || null;

    const { data: comment, error } = await supabase
        .from("comments")
        .select(`
            *,
            comment_likes(
                user_id
            ),
            comment_reactions(
                user_id,
                emoji
            ),
            comment_reads(
                user_id,
                profiles(
                    id,
                    name
                )
            )
        `)
        .eq("id", commentId)
        .single();

    if (error) {
        console.error("updateSingleComment:", error);
        return;
    }

    if (!comment) return;

    /*
     * -----------------------------------------
     * LIKE COUNT
     * -----------------------------------------
     */

    const likeCount =
        document.getElementById(
            "commentLikeCount-" + commentId
        );

    if (likeCount) {

        likeCount.textContent =
            comment.comment_likes?.length || 0;

    }

    /*
     * -----------------------------------------
     * LIKE BUTTON
     * -----------------------------------------
     */

    const likeButton =
        document.getElementById(
            "commentLike-" + commentId
        );

    if (likeButton) {

        const liked =
            comment.comment_likes?.some(
                like => like.user_id === myId
            );

        likeButton.style.background =
            liked
                ? "#ff3040"
                : "#232323";

    }

    /*
     * -----------------------------------------
     * REACTIONS
     * -----------------------------------------
     */

    const card =
        document.getElementById(
            "comment-" + commentId
        );

    if (!card) return;

    const reactionContainer =
        card.querySelector(
            ".commentReactions"
        );

    if (reactionContainer) {

        reactionContainer.innerHTML =
            renderCommentReactions(comment);

    }

    /*
     * -----------------------------------------
     * SEEN BY
     * -----------------------------------------
     */

    const oldReads =
        card.querySelector(
            ".commentReads"
        );

    const newReads =
        renderCommentReads(comment);

    if (oldReads) {

        if (newReads) {

            oldReads.outerHTML =
                newReads;

        } else {

            oldReads.remove();

        }

    } else if (newReads) {

        card.insertAdjacentHTML(
            "beforeend",
            newReads
        );

    }

}

async function listenToCommentTyping() {

if (commentsTypingChannel) {
    supabase.removeChannel(commentsTypingChannel);
}

commentsTypingChannel = supabase
.channel("comment_typing_" + currentPostId)

.on(
"postgres_changes",
{
event: "UPDATE",
schema: "public",
table: "profiles"
},
async (payload) => {

const profile = payload.new;

const {
    data: { session }
} = await supabase.auth.getSession();

if (!session) return;

// Ignore yourself
if (profile.id === session.user.id) return;

// Ignore updates not related to comment typing
if (
    payload.old.typing_comment === profile.typing_comment &&
    payload.old.typing_comment_post === profile.typing_comment_post
) {
    return;
}

const indicator =
document.getElementById("commentTypingIndicator");

if (!indicator) return;

if (
    profile.typing_comment === true &&
    String(profile.typing_comment_post) === String(currentPostId)
) {

    indicator.style.display = "block";
    indicator.textContent =
        `${profile.name || "Someone"} is typing...`;

} else {

    indicator.style.display = "none";

}

}

)

.subscribe();

}

async function pinComment(commentId) {

    const {
        data: { session }
    } = await supabase.auth.getSession();

    if (!session) return;

    if (session.user.id !== window.currentPostOwnerId) {
        showToast("Only the post owner can pin comments.");
        return;
    }

    const { data: comment, error } = await supabase
        .from("comments")
        .select("pinned")
        .eq("id", commentId)
        .single();

    if (error || !comment) return;

    // Limit to 3 pinned comments
    if (!comment.pinned) {

        const { count } = await supabase
            .from("comments")
            .select("*", { count: "exact", head: true })
            .eq("post_id", currentPostId)
            .eq("pinned", true);

        if (count >= 3) {
            showToast("You can only pin 3 comments.");
            return;
        }
    }

    const { error: updateError } = await supabase
        .from("comments")
        .update({
            pinned: !comment.pinned
        })
        .eq("id", commentId);

    if (updateError) {
        console.log(updateError);
        showToast("Couldn't update comment.");
        return;
    }

    commentsPage = 0;
    hasMoreComments = true;
    loadingComments = false;

    updateSingleComment(commentId);

    closeCommentMenu();
}

async function translateComment(commentId) {

    const box = document.getElementById("translation-" + commentId);
    const btn = document.getElementById("translateBtn-" + commentId);

    if (!box || !btn) return;

    // Already showing translation → show original
    if (box.style.display === "block") {

        box.style.display = "none";
        btn.innerHTML = "🌐 See translation";
        return;

    }

    const language = await getPreferredLanguage();

    const { data: comment } = await supabase
        .from("comments")
        .select(`
            content,
            language_code,
            translated_text,
            translation_status
        `)
        .eq("id", commentId)
        .single();

    if (!comment) return;

    // Already translated
    if (
        comment.translation_status === "completed" &&
        comment.translated_text
    ) {

        box.innerHTML = escapeHtml(comment.translated_text);
        box.style.display = "block";
        btn.innerHTML = "Show original";
        return;

    }

    showToast("Translating...");

    const translated = await translateText(
        comment.content,
        comment.language_code || "auto",
        language
    );

    if (!translated) {

        showToast("Translation failed");
        return;

    }

    box.innerHTML = escapeHtml(translated);
    box.style.display = "block";
    btn.innerHTML = "Show original";

    await supabase
        .from("comments")
        .update({
            translated_text: translated,
            translation_status: "completed"
        })
        .eq("id", commentId);

}

async function getPreferredLanguage() {

    const {
        data: { session }
    } = await supabase.auth.getSession();

    if (!session) {
        return navigator.language.split("-")[0];
    }

    const { data } = await supabase
        .from("profiles")
        .select("preferred_language")
        .eq("id", session.user.id)
        .single();

    if (!data) {
        return navigator.language.split("-")[0];
    }

    if (data.preferred_language === "auto") {
        return navigator.language.split("-")[0];
    }

    return data.preferred_language;
}

if (
  session?.user?.id &&
  session.user.id !== userId
) {

  // ==========================================
  // CHECK ACTUAL FOLLOW
  // ==========================================

  const { data: existingFollow, error: followError } =
    await supabase
      .from("follows")
      .select("id")
      .eq("follower_id", session.user.id)
      .eq("following_id", userId)
      .maybeSingle();


  // ==========================================
  // CHECK PENDING REQUEST
  // ==========================================

  const { data: pendingRequest, error: requestError } =
    await supabase
      .from("follow_requests")
      .select("id,status")
      .eq("sender_id", session.user.id)
      .eq("receiver_id", userId)
      .eq("status", "pending")
      .maybeSingle();


  if (followError) {
    console.error("❌ FOLLOW CHECK ERROR:", followError);
  }

  if (requestError) {
    console.error("❌ REQUEST CHECK ERROR:", requestError);
  }


  const isFollowing = !!existingFollow;
  const isPending = !!pendingRequest;


  // ==========================================
  // DETERMINE BUTTON STATE
  // ==========================================

  let buttonText = "Follow";
  let buttonBackground = "#1d9bf0";

  if (isFollowing) {

    buttonText = "Following";
    buttonBackground = "#444";

  } else if (isPending) {

    buttonText = "Requested";
    buttonBackground = "#444";

  }


  // ==========================================
  // CREATE BUTTON
  // ==========================================

  followContainer.innerHTML = `
    <button id="followBtn"
      style="
        margin-top:10px;
        padding:8px 14px;
        border:none;
        border-radius:8px;
        background:${buttonBackground};
        color:white;
        cursor:pointer;
      ">
      ${buttonText}
    </button>
  `;


  document.getElementById("followBtn").onclick =
    async () => {

      if (!session?.user) {
        alert("Please log in first.");
        return;
      }


      // ========================================
      // ALREADY FOLLOWING → UNFOLLOW
      // ========================================

      if (isFollowing) {

        const { error } = await supabase
          .from("follows")
          .delete()
          .eq("follower_id", session.user.id)
          .eq("following_id", userId);


        if (error) {

          console.error(
            "❌ UNFOLLOW ERROR:",
            error
          );

          alert(
            "Failed to unfollow:\n\n" +
            error.message
          );

          return;
        }


        alert("Unfollowed.");

        openProfile(userId, name);

        return;
      }


      // ========================================
      // REQUEST ALREADY PENDING
      // ========================================

      if (isPending) {

        alert("⏳ Follow request is already pending.");

        return;
      }


      // ========================================
      // SEND FOLLOW REQUEST
      // ========================================

      const result =
        await window.followUser(userId);


      console.log(
        "👤 FOLLOW RESULT:",
        result
      );


      if (result === "pending") {

        alert("✅ Follow request sent.");

      }


      else if (result === "following") {

        alert(
          "You are already following this user."
        );

      }


      else if (result === false) {

        return;

      }


      // ========================================
      // REFRESH PROFILE
      // ========================================

      openProfile(userId, name);

    };

}
};

async function loadProfilePosts(userId) {

    const container =
        document.getElementById("profilePosts");

    if (!container) return;

    container.innerHTML = "Loading...";

    // -----------------------------------------
    // GET POSTS
    // -----------------------------------------

    const {
        data: posts,
        error
    } = await supabase
        .from("posts")
        .select("*")
        .eq("user_id", userId)
        .order("pinned", {
            ascending: false
        })
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(
            "❌ PROFILE POSTS ERROR:",
            error
        );

        container.innerHTML =
            "Error loading posts";

        return;
    }

    if (!posts || posts.length === 0) {

        container.innerHTML =
            "No posts yet";

        return;
    }


    // -----------------------------------------
    // GET CURRENT PROFILE
    // -----------------------------------------

    const {
        data: profile,
        error: profileError
    } = await supabase
        .from("profiles")
        .select(`
            id,
            name,
            username,
            avatar_url,
            verified
        `)
        .eq("id", userId)
        .maybeSingle();

    if (profileError) {

        console.error(
            "❌ PROFILE DATA ERROR:",
            profileError
        );
    }


    // -----------------------------------------
    // ATTACH CURRENT PROFILE TO EVERY POST
    // -----------------------------------------

    posts.forEach(post => {

        post.profiles =
            profile || null;

        post.name =
            profile?.name ||
            "User";

        post.username =
            profile?.username ||
            "";

        post.avatar_url =
            profile?.avatar_url ||
            "";

        post.verified =
            profile?.verified ||
            false;

    });


    // -----------------------------------------
    // RENDER
    // -----------------------------------------

    container.replaceChildren();

    window.renderedPosts =
        new Set();

    posts.forEach(post => {

        const el =
            renderPostElement(post);

        if (el) {
            container.appendChild(el);
        }

    });

}

video.onended = () => {

    const next = page.nextElementSibling;

    next.scrollIntoView({
        behavior: "smooth",

    });

    setTimeout(() => {

        const nextVideo = next.querySelector("video");

function observeProfileVideos(container){
  
  container.style.scrollSnapType = "y mandatory";
container.style.scrollBehavior = "smooth";


    const observer = new IntersectionObserver(entries => {

        entries.forEach(entry => {

            const video = entry.target.querySelector("video");
            if (!video) return;

            if (entry.isIntersecting && entry.intersectionRatio > 0.75) {

  // Pause all other videos
container.querySelectorAll("video").forEach(v => {

    if (v !== video) {

        v.pause();

    }

});

const currentIndex = Number(entry.target.dataset.index);

window.profileVideoIndex = currentIndex;

video.style.opacity = "1";

video.currentTime = 0;

video.play().catch(() => {});

// Buffer nearby videos
const nextPage = entry.target.nextElementSibling;

if (nextPage) {

    const nextVideo = nextPage.querySelector("video");

    if (nextVideo) {

        nextVideo.preload = "auto";
        nextVideo.load();

    }

}

const prevPage = entry.target.previousElementSibling;

if (prevPage) {

    const prevVideo = prevPage.querySelector("video");

    if (prevVideo) {

        prevVideo.preload = "auto";
        prevVideo.load();

    }

}

window.profileVideoIndex = currentIndex;


} else {

    video.pause();
    video.currentTime = 0;

}

        });

    }, {
        threshold: 0.75
    });

    container.querySelectorAll(".profile-video-item")
        .forEach(page => observer.observe(page));
        
}

async function loadProfileVideos(userId) {

    const container =
        document.getElementById("profilePosts");

    if (!container) return;

    container.innerHTML =
        "Loading videos...";


    // =====================================================
    // GET VIDEOS
    // =====================================================

    const {
        data: posts,
        error: postsError
    } = await supabase
        .from("posts")
        .select("*")
        .eq("user_id", userId)
        .eq("media_type", "video")
        .order("created_at", {
            ascending: false
        });


    if (postsError) {

        console.error(
            "❌ PROFILE VIDEOS ERROR:",
            postsError
        );

        container.innerHTML =
            "Error loading videos";

        return;
    }


    if (!posts || posts.length === 0) {

        container.innerHTML =
            "No videos yet";

        return;
    }


    // =====================================================
    // GET LATEST PROFILE DATA
    // =====================================================

    const {
        data: profile,
        error: profileError
    } = await supabase
        .from("profiles")
        .select(`
            id,
            name,
            username,
            avatar_url,
            verified
        `)
        .eq("id", userId)
        .maybeSingle();


    if (profileError) {

        console.error(
            "❌ VIDEO PROFILE ERROR:",
            profileError
        );
    }


    // =====================================================
    // ATTACH LATEST PROFILE TO EVERY VIDEO
    // =====================================================

    posts.forEach(post => {

        post.profiles =
            profile || null;

        post.name =
            profile?.name ||
            "User";

        post.username =
            profile?.username ||
            "";

        post.avatar_url =
            profile?.avatar_url ||
            "";

        post.verified =
            profile?.verified ||
            false;

    });


    // =====================================================
    // SAVE PROFILE VIDEOS
    // =====================================================

    window.profileVideos =
        posts;


    // =====================================================
    // RENDER VIDEO GRID
    // =====================================================

    container.innerHTML = `

            grid-template-columns:repeat(3,1fr);

                        text-shadow:0 0 10px black;

window.backToMyProfile = async function () {

  try {

    const {
      data,
      error
    } = await supabase.auth.getSession();

    if (error) {
      console.error("BACK PROFILE SESSION ERROR:", error);
      alert("Could not get your session");
      return;
    }

    const user = data.session?.user;

    if (!user) {
      alert("You are not logged in");
      return;
    }

    console.log("🔙 BACK TO PROFILE:", user.id);

    await window.openProfile(
      user.id,
      user.email
    );

  } catch (e) {

    console.error("BACK TO PROFILE ERROR:", e);

    alert("Back error: " + e.message);

  }

};
