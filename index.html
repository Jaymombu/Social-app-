window.followUser = async function(userId){

    if(!session?.user){
        alert("Login first");
        return false;
    }

    if(!userId){
        console.error("❌ Missing user ID");
        return false;
    }

    const currentUserId = session.user.id;

    // Don't follow yourself
    if(String(userId) === String(currentUserId)){
        return false;
    }

    console.log("👤 FOLLOW REQUEST:", {
        sender_id: currentUserId,
        receiver_id: userId
    });


    // ==========================================
    // CHECK TARGET FOLLOW SETTINGS
    // ==========================================

    const { data: targetProfile, error: profileError } =
        await supabase
            .from("profiles")
            .select("allow_followers")
            .eq("id", userId)
            .single();

    if(profileError){

        console.error(
            "❌ PROFILE ERROR:",
            profileError
        );

        alert("Could not check this user's follow settings.");

        return false;
    }


    // ==========================================
    // USER DOES NOT ACCEPT FOLLOWERS
    // ==========================================

    if(targetProfile?.allow_followers === "nobody"){

        alert("This user is not accepting followers.");

        return false;
    }


    // ==========================================
    // CHECK IF ALREADY FOLLOWING
    // ==========================================

    const {
        data: existingFollow,
        error: followCheckError
    } = await supabase
        .from("follows")
        .select("id")
        .eq("follower_id", currentUserId)
        .eq("following_id", userId)
        .maybeSingle();


    if(followCheckError){

        console.error(
            "❌ FOLLOW CHECK ERROR:",
            followCheckError
        );

        return false;
    }


    if(existingFollow){

        console.log("ℹ️ Already following");

        return "following";
    }


    // ==========================================
    // CHECK EXISTING REQUEST
    // ==========================================

    const {
        data: existingRequest,
        error: requestCheckError
    } = await supabase
        .from("follow_requests")
        .select("id,status")
        .eq("sender_id", currentUserId)
        .eq("receiver_id", userId)
        .eq("status", "pending")
        .maybeSingle();


    if(requestCheckError){

        console.error(
            "❌ REQUEST CHECK ERROR:",
            requestCheckError
        );

        return false;
    }


    if(existingRequest){

        console.log(
            "⏳ Request already pending"
        );

        return "pending";
    }


    // ==========================================
    // CREATE FOLLOW REQUEST
    // ==========================================

    const { error: requestError } =
        await supabase
            .from("follow_requests")
            .insert({
                sender_id: currentUserId,
                receiver_id: userId,
                status: "pending",
                created_at: new Date().toISOString()
            });


    if(requestError){

        console.error(
            "❌ FOLLOW REQUEST INSERT ERROR:",
            requestError
        );

        alert(
            "❌ Failed to send follow request:\n\n" +
            requestError.message
        );

        return false;
    }


    console.log(
        "✅ FOLLOW REQUEST CREATED"
    );


    // ==========================================
    // GET SENDER PROFILE
    // ==========================================

    const { data: me } = await supabase
        .from("profiles")
        .select("name, avatar_url")
        .eq("id", currentUserId)
        .single();


    // ==========================================
    // SEND REQUEST NOTIFICATION
    // ==========================================

    const { error: notificationError } =
        await supabase
            .from("notifications")
            .insert({

                user_id: userId,

                sender_id: currentUserId,

                username: me?.name || "User",

                avatar_url: me?.avatar_url || null,

                type: "follow_request",

                message: "sent you a follow request",

                read: false,

                created_at: new Date().toISOString(),

                last_time: new Date().toISOString()

            });


    if(notificationError){

        console.error(
            "⚠️ NOTIFICATION ERROR:",
            notificationError
        );

    }


    console.log(
        "⏳ FOLLOW REQUEST PENDING"
    );


    return "pending";
};

window.openFollowRequests = async function () {

    if (!session?.user) {
        alert("Login first");
        return;
    }

    const currentUserId = session.user.id;

    // ==========================================
    // LOAD PENDING REQUESTS
    // ==========================================

    const { data: requests, error } = await supabase
        .from("follow_requests")
        .select(`
            id,
            sender_id,
            receiver_id,
            status,
            created_at
        `)
        .eq("receiver_id", currentUserId)
        .eq("status", "pending")
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(
            "❌ LOAD FOLLOW REQUESTS ERROR:",
            error
        );

        alert(
            "Failed to load follow requests:\n\n" +
            error.message
        );

        return;
    }


    console.log(
        "📥 FOLLOW REQUESTS:",
        requests
    );


    // ==========================================
    // REMOVE OLD SCREEN
    // ==========================================

    document
        .getElementById("followRequestsScreen")
        ?.remove();


    // ==========================================
    // FULL SCREEN
    // ==========================================

    const screen = document.createElement("div");

    screen.id = "followRequestsScreen";

    screen.style.cssText = `
        position:fixed;
        inset:0;
        width:100%;
        height:100%;
        background:#111;
        color:white;
        z-index:999999999;
        overflow-y:auto;
        -webkit-overflow-scrolling:touch;
    `;


    // ==========================================
    // HEADER
    // ==========================================

    const header = document.createElement("div");

    header.style.cssText = `
        position:sticky;
        top:0;
        z-index:10;
        height:60px;
        display:flex;
        align-items:center;
        gap:15px;
        padding:0 15px;
        background:#181818;
        border-bottom:1px solid #292929;
        box-sizing:border-box;
    `;


    header.innerHTML = `

        <button
            id="closeFollowRequests"
            style="
                width:40px;
                height:40px;
                border:none;
                border-radius:50%;
                background:#333;
                color:white;
                font-size:22px;
                cursor:pointer;
            "
        >
            ←
        </button>

        <div style="
            font-size:20px;
            font-weight:bold;
        ">
            Follow Requests
        </div>

    `;


    screen.appendChild(header);


    // ==========================================
    // CONTENT
    // ==========================================

    const content = document.createElement("div");

    content.style.cssText = `
        padding:0 15px 30px;
        box-sizing:border-box;
    `;


    screen.appendChild(content);


    // ==========================================
    // NO REQUESTS
    // ==========================================

    if (!requests || requests.length === 0) {

        content.innerHTML = `

            <div style="
                text-align:center;
                padding:100px 20px;
                color:#aaa;
            ">

                <div style="
                    font-size:60px;
                    margin-bottom:20px;
                ">
                    👥
                </div>

                <div style="
                    font-size:20px;
                    color:white;
                    font-weight:bold;
                    margin-bottom:10px;
                ">
                    No follow requests
                </div>

                <div style="
                    font-size:14px;
                    color:#888;
                ">
                    You don't have any pending follow requests.
                </div>

            </div>

        `;

    } else {

        // ==========================================
        // REQUESTS
        // ==========================================

        for (const request of requests) {

            // ==========================================
            // LOAD PROFILE
            // ==========================================

            const {
                data: profile,
                error: profileError
            } = await supabase
                .from("profiles")
                .select(`
                    id,
                    name,
                    username,
                    avatar_url
                `)
                .eq("id", request.sender_id)
                .maybeSingle();


            if (profileError) {

                console.error(
                    "❌ PROFILE ERROR:",
                    profileError
                );

            }


            // ==========================================
            // ROW
            // ==========================================

            const row = document.createElement("div");

            row.style.cssText = `
                display:flex;
                align-items:center;
                gap:14px;
                padding:16px 0;
                border-bottom:1px solid #292929;
            `;


            // ==========================================
            // AVATAR
            // ==========================================

            const avatar = document.createElement("img");

            avatar.src =
                profile?.avatar_url ||
                "https://via.placeholder.com/60";

            avatar.style.cssText = `
                width:58px;
                height:58px;
                border-radius:50%;
                object-fit:cover;
                background:#333;
                flex-shrink:0;
            `;


            // ==========================================
            // INFO
            // ==========================================

            const info = document.createElement("div");

            info.style.cssText = `
                flex:1;
                min-width:0;
            `;


            const name =
                profile?.name ||
                profile?.username ||
                "User";


            info.innerHTML = `

                <div style="
                    font-size:16px;
                    font-weight:bold;
                    color:white;
                    overflow:hidden;
                    text-overflow:ellipsis;
                    white-space:nowrap;
                ">
                    ${escapeHtml(name)}
                </div>

                ${
                    profile?.username
                    ? `
                    <div style="
                        color:#888;
                        font-size:13px;
                        margin-top:3px;
                    ">
                        @${escapeHtml(profile.username)}
                    </div>
                    `
                    : ""
                }

                <div style="
                    color:#999;
                    font-size:13px;
                    margin-top:5px;
                ">
                    Wants to follow you
                </div>

            `;


            // ==========================================
            // BUTTONS
            // ==========================================

            const buttons = document.createElement("div");

            buttons.style.cssText = `
                display:flex;
                gap:7px;
                flex-shrink:0;
            `;


            // ==========================================
            // ACCEPT
            // ==========================================

            const accept = document.createElement("button");

            accept.innerHTML = "Accept";

            accept.style.cssText = `
                border:none;
                border-radius:8px;
                padding:10px 13px;
                background:#0095f6;
                color:white;
                font-weight:bold;
                cursor:pointer;
            `;


            // ==========================================
            // DECLINE
            // ==========================================

            const decline = document.createElement("button");

            decline.innerHTML = "Decline";

            decline.style.cssText = `
                border:none;
                border-radius:8px;
                padding:10px 13px;
                background:#333;
                color:white;
                font-weight:bold;
                cursor:pointer;
            `;


            // ==========================================
            // ACCEPT CLICK
            // ==========================================

            accept.onclick = async function () {

                if (accept.disabled) return;

                accept.disabled = true;
                decline.disabled = true;

                accept.innerHTML = "Accepting...";

                await window.acceptFollowRequest(
                    request.id,
                    request.sender_id
                );

            };


            // ==========================================
            // DECLINE CLICK
            // ==========================================

            decline.onclick = async function () {

                if (decline.disabled) return;

                accept.disabled = true;
                decline.disabled = true;

                decline.innerHTML = "Declining...";

                await window.declineFollowRequest(
                    request.id
                );

            };


            buttons.appendChild(accept);
            buttons.appendChild(decline);


            row.appendChild(avatar);
            row.appendChild(info);
            row.appendChild(buttons);

            content.appendChild(row);

        }

    }


    // ==========================================
    // ADD SCREEN
    // ==========================================

    document.body.appendChild(screen);


    // ==========================================
    // CLOSE
    // ==========================================

    document
    .getElementById("closeFollowRequests")
    .onclick = async function () {

        screen.remove();

        // ==========================================
        // RETURN TO NOTIFICATIONS
        // ==========================================

        if (openedFollowRequestsFromNotification) {

            console.log(
                "🔔 RETURNING TO NOTIFICATIONS FROM FOLLOW REQUESTS"
            );

            openedFollowRequestsFromNotification = false;

            document.body.style.overflow = "";

            const notificationsScreen =
                document.getElementById(
                    "notificationsScreen"
                );

            if (notificationsScreen) {

                notificationsScreen.style.display =
                    "flex";

            }

            await loadNotifications();

            return;
        }

    };

};

window.acceptFollowRequest = async function(requestId, senderId){

    if(!session?.user){
        alert("Login first");
        return;
    }

    // ==========================================
    // CREATE ACTUAL FOLLOW
    // ==========================================

    const { error: followError } = await supabase
        .from("follows")
        .insert({
            follower_id: senderId,
            following_id: session.user.id
        });

    if(followError){

        console.error(
            "❌ ACCEPT FOLLOW ERROR:",
            followError
        );

        alert(
            "Failed to accept request:\n\n" +
            followError.message
        );

        return;
    }


    // ==========================================
    // DELETE REQUEST
    // ==========================================

    const { error: deleteError } = await supabase
        .from("follow_requests")
        .delete()
        .eq("id", requestId);

    if(deleteError){

        console.error(
            "❌ DELETE REQUEST ERROR:",
            deleteError
        );

        alert(
            "Follow accepted, but request could not be removed."
        );

        return;
    }


    // ==========================================
    // GET MY PROFILE
    // ==========================================

    const { data: me } = await supabase
        .from("profiles")
        .select("name, avatar_url")
        .eq("id", session.user.id)
        .single();


    // ==========================================
    // NOTIFY REQUESTER
    // ==========================================

    const { error: notificationError } = await supabase
        .from("notifications")
        .insert({
            user_id: senderId,
            sender_id: session.user.id,
            username: me?.name || "User",
            avatar_url: me?.avatar_url || null,
            type: "follow_accept",
            message: "accepted your follow request",
            read: false,
            created_at: new Date().toISOString(),
            last_time: new Date().toISOString()
        });


    if(notificationError){

        console.error(
            "⚠️ ACCEPT NOTIFICATION ERROR:",
            notificationError
        );

    }


    alert("✅ Follow request accepted.");
    
    if (typeof window.loadFollowingUsers === "function") {
    await window.loadFollowingUsers();
}

    openFollowRequests();
};

window.declineFollowRequest = async function(requestId){

    .delete()

  alert("Follow request declined.");

  openFollowRequests();

};

overlay.ontouchstart = (e) => {
  galleryTouchStartX = e.touches[0].clientX;
};

overlay.ontouchmove = (e) => {
  galleryTouchEndX = e.touches[0].clientX;
};

overlay.ontouchend = () => {

  const diff = galleryTouchStartX - galleryTouchEndX;

  if (Math.abs(diff) < 50) return;

  if (diff > 0) {
    nextPhoto();
  } else {
    previousPhoto();
  }

};

const img = document.getElementById("galleryPhoto");

let zoomed = false;

img.ondblclick = () => {

  zoomed = !zoomed;

  if (zoomed) {

  img.style.transform =
    `translate(${photoX}px, ${photoY}px) scale(2)`;

} else {

  photoX = 0;
  photoY = 0;

  img.style.transform = "scale(1)";
}

};

img.ontouchstart = (e) => {

  if (!zoomed) return;

  draggingPhoto = true;

  dragStartX = e.touches[0].clientX - photoX;
  dragStartY = e.touches[0].clientY - photoY;

};

img.ontouchmove = (e) => {

  if (!draggingPhoto || !zoomed) return;

  photoX = e.touches[0].clientX - dragStartX;
  photoY = e.touches[0].clientY - dragStartY;

  img.style.transform =
    `translate(${photoX}px, ${photoY}px) scale(2)`;

};

img.ontouchend = () => {

 draggingPhoto = false;

 const now = Date.now();

 if(now-lastPhotoTap < 300){

 zoomed=!zoomed;

 if(zoomed){

 img.style.transform =
 `translate(${photoX}px,${photoY}px) scale(2)`;

 }else{

 photoX=0;
 photoY=0;

 img.style.transform="scale(1)";

 }

 }

 lastPhotoTap=now;

};
preloadGalleryImages();

}

function preloadGalleryImages(){

  if(!window.profileGallery.length) return;

  const next =
    window.profileGallery[
      (window.profileGalleryIndex + 1) %
      window.profileGallery.length
    ];

  const prev =
    window.profileGallery[
      (window.profileGalleryIndex - 1 + window.profileGallery.length) %
      window.profileGallery.length
    ];

  if(next){
    const img = new Image();
    img.src = next.file_url;
  }

  if(prev){
    const img = new Image();
    img.src = prev.file_url;
  }

}

window.previousPhoto = function(){
  
  photoX = 0;
  photoY = 0;
  draggingPhoto = false;

  const img =
    document.getElementById("galleryPhoto");

  img.style.transform = "translateX(100%)";
  img.style.opacity = "0";

  setTimeout(()=>{

    if(window.profileGalleryIndex>0){
      window.profileGalleryIndex--;
    }else{
      window.profileGalleryIndex =
        window.profileGallery.length-1;

    renderPhotoGallery();

  },250);

};

window.nextPhoto = function(){
  
   photoX = 0;
   photoY = 0;
   draggingPhoto = false;

  const img =
    document.getElementById("galleryPhoto");

  img.style.transform = "translateX(-100%)";
  img.style.opacity = "0";

    if(window.profileGalleryIndex <
       window.profileGallery.length-1){
      window.profileGalleryIndex++;
    }else{
      window.profileGalleryIndex = 0;

    renderPhotoGallery();

  },250);

};

window.togglePinnedSearch = function(id){

  let pinned = JSON.parse(
    localStorage.getItem("pinnedSearches") || "[]"
  );

  if(pinned.includes(id)){
    pinned = pinned.filter(x => x !== id);
  }else{
    pinned.unshift(id);
  }

  localStorage.setItem(
    "pinnedSearches",
    JSON.stringify(pinned)
  );

  searchUsers();
};

function isPinned(id){

  const pinned = JSON.parse(
    localStorage.getItem("pinnedSearches") || "[]"
  );

  return pinned.includes(id);

}

function formatSearchTime(date) {

  if (!date) return "";

  const diff = Date.now() - new Date(date).getTime();

  const mins = Math.floor(diff / 60000);

  if (mins < 1) return "Just now";

  if (mins < 60) return `${mins} min ago`;

  const hrs = Math.floor(mins / 60);

  if (hrs < 24) return `${hrs} hr ago`;

  const days = Math.floor(hrs / 24);

  if (days === 1) return "Yesterday";

  return `${days} days ago`;

}

    console.timeEnd("updateOnlineStatus");

    console.time("registerPush");
    try {

    } catch (err) {

    console.timeEnd("loadUnreadMessages");

console.log(

);

function listenToChatStatus(userId) {

  if (window.chatStatusChannel) {
    supabase.removeChannel(window.chatStatusChannel);
  }

  window.chatStatusChannel = supabase
    .channel("chat_status_" + userId)
    .on(
      "postgres_changes",
      {
        event: "UPDATE",
        schema: "public",
        table: "profiles",
        filter: `id=eq.${userId}`
      },
     (payload) => {

  const profile = payload.new;

  const status = document.getElementById("chatStatus");

  if(!status || !profile) return;

  status.innerText =
    profile.online
      ? "🟢 Online"
      : profile.last_seen
        ? `Last seen ${formatLastSeen(profile.last_seen)}`
        : "Offline";

}
    )
    .subscribe();

window.editMessage = async function(messageId) {

  const { data: message } = await supabase
    .from("messages")
    .select("content, sender_id")
    .eq("id", messageId)
    .single();

  if (!message) return;

  if (!session?.user || message.sender_id !== session.user.id) {
  alert("You can only edit your own messages.");
  return;
}

  const newText = prompt(
    "Edit message:",
    message.content
  );

  if (
    newText === null ||
    newText.trim() === "" ||
    newText === message.content
  ) {
    return;
  }

  const { error } = await supabase
  .from("messages")
  .update({
    content: newText.trim(),
    edited: true,
    edited_at: new Date()
  })
  .eq("id", messageId);

  if (error) {
    alert(error.message);
    return;
  }

  loadMessages();

  document.getElementById("messageMenu")?.remove();

};

    document.getElementById("chatMedia");

    fileInput.files[0];

  alert("Please login first");
  return;
}

  // allow text OR media
  if (
    !input.value.trim() &&
    !file
  ) return;

  let mediaUrl = null;
  let mediaType = null;
  let fileName = null;

  // =====================
  // UPLOAD FILE
  // =====================
  
  if (file) {

  const allowed = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "video/mp4",
    "video/webm"
  ];

  if (!allowed.includes(file.type)) {
    alert("Unsupported file type");
    return;
  }

}

if (file && file.size > 50 * 1024 * 1024) {
  alert("File too large");
  return;
}

  if (file) {

  `${session.user.id}_${Date.now()}_${file.name}`;

      await supabase.storage
        .from("chat-media")

      alert(uploadError.message);

    if (translated) {

            .from("messages")

                translation_status: "completed"
            })
            .eq("id", insertedMessage.id);

    }

}
  
  // Notify the receiver

const { data: existing } = await supabase

function listenTyping(userId) {

  if (window.typingChannel) {
    supabase.removeChannel(window.typingChannel);
  }

  window.typingChannel = supabase
    .channel("typing_" + userId)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "typing_status",
        filter: `user_id=eq.${userId}`
      },
      (payload) => {

        const row = payload.new;

        if (!row) return;

        document.getElementById("typingIndicator").style.display =
          row.typing ? "block" : "none";

      }
    )
    .subscribe();

}

function listenForSeenMessages(userId) {

  if (window.messageSeenChannel) {
    supabase.removeChannel(window.messageSeenChannel);
  }

  window.messageSeenChannel = supabase
    .channel("seen_" + userId)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages",
        filter: `receiver_id=eq.${session.user.id}`
      },
      async (payload) => {

        const msg = payload.new;

        if (msg.sender_id !== userId) return;

        await supabase
          .from("messages")
          .update({
            seen: true,
            seen_at: new Date(),
            delivered: true
          })
          .eq("id", msg.id);

        await loadUnreadMessages();

        loadMessages();

        if (
          document.getElementById("inboxScreen")?.style.display === "flex"
        ) {
          openInbox();
        }

      }
    )
    .subscribe();

}

window.searchMessages = function () {

  const value = document
    .getElementById("chatSearch")
    .value
    .toLowerCase()
    .trim();

  searchResults = [];
  currentSearchIndex = -1;

  document.querySelectorAll(".chatMessage").forEach(msg => {

    msg.style.outline = "";

    if (
      value &&
      (msg.dataset.message || "").includes(value)
    ) {
      searchResults.push(msg);
    }

  });

  if (searchResults.length) {
    currentSearchIndex = 0;
    highlightSearchResult();
  }

};

function highlightSearchResult() {

  document
    .querySelectorAll(".chatMessage")
    .forEach(m => m.style.outline = "");

  const msg = searchResults[currentSearchIndex];

  if (!msg) return;

  msg.style.outline = "2px solid #1d9bf0";

  msg.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}

window.nextSearchResult = function () {

  if (!searchResults.length) return;

  currentSearchIndex =
    (currentSearchIndex + 1) %
    searchResults.length;

  highlightSearchResult();

};

window.previousSearchResult = function () {

  if (!searchResults.length) return;

  currentSearchIndex =
    (currentSearchIndex - 1 + searchResults.length) %
    searchResults.length;

  highlightSearchResult();

};

window.formatLastSeen = function(date){

  if(!date) return "Offline";

  const now = new Date();

  const last = new Date(date);

  const diff =
    Math.floor(
      (now-last)/1000
    );


  if(diff < 60){

    return "just now";

  }


  if(diff < 3600){

    return Math.floor(diff/60)+" min ago";

  }


  if(diff < 86400){

    return Math.floor(diff/3600)+" hours ago";

  }


  return last.toLocaleDateString();

};

let currentY = 0;

let startY = 0;



// DOUBLE TAP ZOOM

// TOUCH START
img.addEventListener("touchstart", e => {

  // PINCH START
  if (e.touches.length === 2) {

    startDistance = getDistance(
      e.touches[0],
      e.touches[1]
    );
  }

  // DRAG START
  if (e.touches.length === 1 && scale > 1) {

    );

    scale *= newDistance / startDistance;

    scale = Math.max(

        .filter(Boolean)
    )
  ];

  if (!senderIds.length) return;

  const { data, error } = await supabase
    .from("profiles")
    .select(`
      id,
      name,
      username,
      avatar_url
    `)
    .in("id", senderIds);

  if (error) {
    console.log(
      "❌ NOTIFICATION PROFILE ERROR:",
      error
    );
    return;
  }

  (data || []).forEach(profile => {

    window.notificationProfileCache.set(
      profile.id,
      profile
    );

  });

};

// =====================================================

async function loadNotifications() {

  if (!currentUser) return;

  const { data, error } = await supabase
    .from("notifications")
    .select("*")
    .eq("user_id", currentUser.id);

  console.log("CURRENT USER:", currentUser.id);
  console.log("NOTIFICATION ERROR:", error);
  console.log("NOTIFICATION DATA:", data);

  if (error) {
    console.log(error);
    return;
  }

  notificationCache =
    mergeFromServer(
      [...notificationCache],
      data || []
    );


  // Get latest sender profiles
  await loadNotificationProfiles(
    notificationCache
  );


  // =====================================================
  // START FROM CACHE
  // =====================================================

  let notifications =
    [...notificationCache].sort(
      (a, b) =>
        new Date(
          b.last_time || b.created_at
        ) -
        new Date(
          a.last_time || a.created_at
        )
    );


  // =====================================================
  // FILTER
  // =====================================================

  if (notificationFilter !== "all") {

    if (notificationFilter === "stories") {

      notifications =
        notifications.filter(n =>
          n.type === "story_reply" ||
          n.type === "story_reaction"
        );

    } else {

      notifications =
        notifications.filter(
          n =>
            n.type === notificationFilter
        );

    }

  }


  // =====================================================
  // SEARCH
  // =====================================================

  const search =
    document
      .getElementById("notificationSearch")
      ?.value
      ?.toLowerCase()
      .trim() || "";


  if (search) {

    notifications =
      notifications.filter(n => {

        const profile =
          window.notificationProfileCache.get(
            n.sender_id
          ) || {};


        const currentName =
          profile.name ||
          profile.username ||
          "";


        const currentUsername =
          profile.username ||
          "";


        const message =
          n.message || "";


        return (
          currentName
            .toLowerCase()
            .includes(search) ||

          currentUsername
            .toLowerCase()
            .includes(search) ||

          message
            .toLowerCase()
            .includes(search)
        );

      });

  }


  // =====================================================
  // RENDER
  // =====================================================

  const list =
    document.getElementById(
      "notificationsList"
    );


  if (!list) {

    console.warn(
      "notificationsList missing in DOM"
    );

    return;

  }


  renderNotifications(
    notifications
  );

}

    })

  // =====================================================

  if (data.type === "story_reaction") {

      data.story_id,
      {

        story_id: data.story_id
      }
    );

        openExactPostFromNotification(data.post_id);

}


  // =====================================================

        openedCommentsFromNotification = true;

        await openComments(
    data.post_id,

);

}

// =====================================================
// COMMENT LIKE

        await openComments(

if (data.type === "comment_reply") {

        openedCommentsFromNotification = true;

        await openComments(

            data.comment_id
        );

    }

    return;
}

// =====================================================
// COMMENT REACTION
// =====================================================

if (data.type === "comment_reaction") {

    if (data.post_id && data.comment_id) {

        openedCommentsFromNotification = true;

        await openComments(
    data.post_id,
    data.comment_id
);

    }

    return;
}

  // =====================================================
  // FOLLOW
  // =====================================================

  if (data.type === "follow") {

    if (data.sender_id) {

        openedProfileFromNotification = true;

        openProfile(
            data.sender_id,
            data.username || "User"
        );

    }

    return;
}
  
  
  // =====================================================
// FOLLOW ACCEPTED
// =====================================================

if (data.type === "follow_accept") {

  if (data.sender_id) {

    // Remember that this profile was opened from notifications
    openedProfileFromNotification = true;

    openProfile(
      data.sender_id,
      data.username || "User"
    );

  }

  return;
}


  // =====================================================
  // MESSAGE
  // =====================================================

  if (
    data.type === "message" ||
    data.type === "message_reaction"
  ) {

    if (data.sender_id) {

      openChat(
        data.sender_id,
        data.username || "User"
      );

    }

    return;

  }


  // =====================================================
  // PROFILE UPDATE
  // =====================================================

  if (data.type === "profile_update") {

    if (data.sender_id) {

      openedProfileFromNotification =
        true;


      openProfile(
        data.sender_id,
        data.username || "User"
      );

    }

    return;

  }


// =====================================================
// FOLLOW REQUEST
// =====================================================

if (data.type === "follow_request") {

    openedFollowRequestsFromNotification = true;

    openFollowRequests();

    return;
}


  renderNotifications();

};

// =====================================================
// MERGE NOTIFICATION
// =====================================================

function mergeNotification(n) {

  const index =
    notificationCache.findIndex(
      x => x.id === n.id
    );


  if (index >= 0) {

    notificationCache[index] = {
      ...notificationCache[index],
      ...n
    };

  } else {

    notificationCache.unshift({
      ...n,
      count: n.count || 1
    });

  }


  notificationCache.sort(
    (a, b) =>
      new Date(
        b.last_time ||
        b.created_at
      ) -
      new Date(
        a.last_time ||
        a.created_at
      )
  );

}


// =====================================================
// MERGE SERVER DATA
// =====================================================

function mergeFromServer(
  cache,
  serverData
) {

  const map =
    new Map();


  // Server data wins
  serverData.forEach(n => {

    map.set(
      n.id,
      {
        ...n
      }
    );

  });


  // Keep local items not yet on server
  cache.forEach(n => {

    if (!map.has(n.id)) {

      map.set(
        n.id,
        {
          ...n
        }
      );

    }

  });


  return [
    ...map.values()
  ].sort(
    (a, b) =>
      new Date(
        b.last_time ||
        b.created_at
      ) -
      new Date(
        a.last_time ||
        a.created_at
      )
  );

}

      let icon = "🔔";

        n.type ===

        "story_reaction"

        n.type ===
        "like"
      )
        icon = "❤️";


      if (
        n.type ===
        "comment"
      )
        icon = "📝";


      if (
        n.type ===
        "comment_like"
      )
        icon = "❤️";


      if (
        n.type ===
        "comment_reply"
      )
        icon = "↩️";


      if (
        n.type ===
        "comment_reaction"
      )
        icon = "😊";


      if (
        n.type ===
        "follow"
      )
        icon = "👤";


      if (
        n.type ===
        "follow_request"
      )
        icon = "👥";

          "follow_accept"

      if (
        n.type ===
        "message"
      )
        icon = "📩";


      if (

        "message_reaction"

      if (

      // =================================================

      const time =

      // =================================================

      let text =

      // =================================================

      // =================================================

      if (n.count > 1) {

        if (
          n.type ===

        }

        else if (

// =====================================================
// FORMAT TIME
// =====================================================

function formatTime(dateString) {

  const mins =
    Math.floor(
      (
        Date.now() -
        new Date(
          dateString
        )
      ) / 60000
    );


  if (mins < 1)
    return "now";


  if (mins < 60)
    return mins + "m";


  if (mins < 1440)
    return (
      Math.floor(
        mins / 60
      ) + "h"
    );


  return (
    Math.floor(
      mins / 1440
    ) + "d"
  );

}

// =====================================================
// NOTIFICATION REALTIME
// =====================================================

function getNotifKey(n) {

  return n.id;

}


if (!window.notificationsSubscription) {

  window.notificationsSubscription =
    supabase
      .channel(
        "notifications_channel"
      )

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "notifications"
        },

        async payload => {

          const n =
            payload.new;


          if (
            !currentUser ||
            n.user_id !==
              currentUser.id
          ) {

            return;

          }


          // Load latest sender profile
          if (n.sender_id) {

            const {
              data: profile
            } =
              await supabase
                .from("profiles")
                .select(`
                  id,
                  name,
                  username,
                  avatar_url
                `)
                .eq(
                  "id",
                  n.sender_id
                )
                .maybeSingle();


            if (profile) {

              window
                .notificationProfileCache
                .set(
                  profile.id,
                  profile
                );

            }

          }


          const key =
            getNotifKey(n);


          if (
            seenNotifications.has(
              key
            )
          ) {

            return;

          }


          seenNotifications.add(
            key
          );


          // Sync other tab
          if (
            window.tabChannel
          ) {

            tabChannel.postMessage(
              n
            );

          }


          mergeNotification(n);

          loadUnreadCount();

          showToastNotification(n);


          const screen =
            document.getElementById(
              "notificationsScreen"
            );


          if (
            screen &&
            screen.style.display ===
              "flex"
          ) {

            renderNotifications(
              notificationCache
            );

          }

        }
      )

      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "notifications"
        },

        payload => {

          const updated =
            payload.new;

          const item =
            notificationCache.find(
              n =>
                n.id ===
                updated.id
            );

          if (item) {

            Object.assign(
              item,
              updated
            );

          }

          renderNotifications(
            notificationCache
          );

          loadUnreadCount();

        }
      )

      .subscribe();

}

// =====================================================
// CROSS-TAB NOTIFICATIONS
// =====================================================

if (
  window.tabChannel &&
  !window.notificationTabListenerAttached
) {

  window.notificationTabListenerAttached =
    true;

  tabChannel.onmessage =
    event => {

      const n =
        event.data;

      if (
        !currentUser ||
        n.user_id !==
          currentUser.id
      ) {

        return;

      }

      const key =
        getNotifKey(n);

      if (
        seenNotifications.has(
          key
        )
      ) {

        return;

      }

      seenNotifications.add(
        key
      );

      mergeNotification(n);

      loadUnreadCount();

      showToastNotification(n);

      const screen =
        document.getElementById(
          "notificationsScreen"
        );

      if (
        screen &&
        screen.style.display ===
          "flex"
      ) {

        renderNotifications(
          notificationCache
        );

      }

    };

}

async function openExactPostFromNotification(postId) {

    console.log("❤️ OPENING EXACT LIKED POST:", postId);

    // ------------------------------------------
    // REMEMBER WE CAME FROM NOTIFICATIONS
    // ------------------------------------------

    openedLikedPostFromNotification = true;

    // ------------------------------------------
    // HIDE NOTIFICATIONS
    // ------------------------------------------

    const notificationsScreen =
        document.getElementById("notificationsScreen");

    if (notificationsScreen) {
        notificationsScreen.style.display = "none";
    }

    // ------------------------------------------
    // SHOW MAIN APP
    // ------------------------------------------

    const app =
        document.getElementById("app");

    if (app) {
        app.style.display = "";
    }

    document.body.style.overflow = "";

    // ------------------------------------------
    // CHECK IF EXACT POST IS ALREADY RENDERED
    // ------------------------------------------

    let postElement =
        document.getElementById(`post-${postId}`);

    if (postElement) {

        console.log(
            "✅ EXACT LIKED POST ALREADY EXISTS"
        );

        postElement.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        highlightExactPost(postElement);

        return;
    }

    // ------------------------------------------
    // POST IS NOT IN CURRENT FEED
    // LOAD IT
    // ------------------------------------------

    console.log(
        "📥 EXACT POST NOT IN CURRENT FEED:",
        postId
    );

    const { data: post, error } =
        await supabase
            .from("posts")
            .select("*")
            .eq("id", postId)
            .single();

    if (error || !post) {

        console.error(
            "❌ COULD NOT LOAD EXACT LIKED POST:",
            error
        );

        return;
    }

    // ------------------------------------------
    // LOAD PROFILE
    // ------------------------------------------

    if (post.user_id) {

        const { data: profile } =
            await supabase
                .from("profiles")
                .select(`
                    id,
                    name,
                    username,
                    avatar_url,
                    cover_url,
                    verified
                `)
                .eq("id", post.user_id)
                .maybeSingle();

        post.profile = profile || null;
    }

    // ------------------------------------------
    // LOAD SAVED STATE
    // ------------------------------------------

    if (session?.user?.id) {

        const { data: saved } =
            await supabase
                .from("saved_posts")
                .select("id")
                .eq("user_id", session.user.id)
                .eq("post_id", postId)
                .maybeSingle();

        post.saved = !!saved;
    }

    // ------------------------------------------
    // ADD POST TO POSTS STATE
    // ------------------------------------------

    if (!window.postsState) {
        window.postsState = [];
    }

    const existingIndex =
        window.postsState.findIndex(
            p => String(p.id) === String(postId)
        );

    if (existingIndex >= 0) {

        window.postsState[existingIndex] = {
            ...window.postsState[existingIndex],
            ...post
        };

    } else {

        window.postsState.unshift(post);
    }

    // ------------------------------------------
    // RENDER FEED
    // ------------------------------------------

    renderFeed(window.postsState);

    // ------------------------------------------
    // FIND EXACT POST AFTER RENDER
    // ------------------------------------------

    requestAnimationFrame(() => {

        const exactPost =
            document.getElementById(
                `post-${postId}`
            );

        if (!exactPost) {

            console.error(
                "❌ EXACT POST STILL NOT FOUND:",
                postId
            );

            return;
        }

        console.log(
            "🎯 FOUND EXACT LIKED POST:",
            exactPost.id
        );

        exactPost.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        highlightExactPost(exactPost);

    });
}

function highlightExactPost(postElement) {

    console.log(
        "✨ HIGHLIGHTING:",
        postElement.id
    );

    postElement.style.transition =
        "box-shadow 0.3s ease, transform 0.3s ease";

    postElement.style.boxShadow =
        "0 0 0 3px #ff3040";

    postElement.style.transform =
        "scale(1.01)";

    setTimeout(() => {

        postElement.style.boxShadow = "";
        postElement.style.transform = "";

    }, 2500);
}

async function registerPush() {

  if (
    !("serviceWorker" in navigator) ||
    !("Notification" in window)
  ) {
    console.log("Push notifications not supported.");
    return;
  }

  const permission = await Notification.requestPermission();

  if (permission !== "granted") return;

  const reg = await navigator.serviceWorker.register("./sw.js");

  const subscription = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(
"BKasJ4tLBWnUvRWEUMvqcWeqUq9qKmFeqvH-tNotanADuKj0aLixYV2xnkTurxdvV-ACw3QuFKvG2ZRZ_tEyuGk"
)
  });

  await supabase.from("push_subscriptions").upsert({
    user_id: currentUser.id,
    subscription
  });

  window.userSubscription = subscription;
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding)
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
}

const videoObserver = new IntersectionObserver(
  (entries) => {

    entries.forEach((entry) => {

      const video =
        entry.target.querySelector("video");

      if (!video) return;

      if (
        entry.isIntersecting &&
        entry.intersectionRatio >= 0.75
      ) {

        // 🔥 ONLY ONE HOME VIDEO CAN PLAY
        document
          .querySelectorAll("#posts .post-card video")
          .forEach((otherVideo) => {

            if (otherVideo !== video) {
              otherVideo.pause();
            }

          });

        video.play().catch(() => {});

      } else {

        video.pause();

      }

    });

  },
  {
    threshold: [0.6, 0.75, 0.9]
  }
);


// =====================================================
// HOME FEED VIDEO OBSERVER
// =====================================================

function observeVideos() {

  console.log("🎬 observeVideos START");

  videoObserver.disconnect();

  const posts =
    document.querySelectorAll("#posts .post-card");

  const videos =
    document.querySelectorAll("#posts .post-card video");

  console.log("🎬 HOME POSTS:", posts.length);
  console.log("🎬 HOME VIDEOS:", videos.length);

  videos.forEach(video => {

    console.log(
      "🎬 VIDEO:",
      video,
      "paused:",
      video.paused
    );

    video.pause();

  });

  posts.forEach(post => {

    console.log(
      "👀 OBSERVING POST:",
      post.id
    );

    videoObserver.observe(post);

  });

  console.log("🎬 observeVideos END");

}
