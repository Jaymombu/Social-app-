window.saveLanguage = async function () {

    console.log("💾 SAVE LANGUAGE");

    const {
        data: { session }
    } = await supabase.auth.getSession();

    if (!session) {
        console.warn("⚠️ LANGUAGE SAVE: USER NOT LOGGED IN");
        return;
    }

    const languageSelect =
        document.getElementById("languageSelect");

    if (!languageSelect) {
        console.error("❌ LANGUAGE SELECT NOT FOUND");
        return;
    }

    const language = languageSelect.value;

    // =================================================
    // SAVE TO DATABASE
    // =================================================

    const { error } = await supabase
        .from("profiles")
        .update({
            preferred_language: language
        })
        .eq("id", session.user.id);

    if (error) {

        console.error(
            "❌ LANGUAGE SAVE FAILED:",
            error
        );

        showToast("Couldn't save language.");
        return;
    }

    console.log(
        "✅ LANGUAGE SAVED:",
        language
    );

    showToast("Language updated.");

    // =================================================
    // LANGUAGE → PROFILE SETTINGS
    // =================================================

    if (
        history.state?.appScreen ===
        "languageSettingsScreen"
    ) {

        history.back();
        return;
    }

    if (
        window.appNavigation?.current?.screen ===
        "languageSettingsScreen"
    ) {

        history.back();
        return;
    }

    // =================================================
    // FALLBACK
    // =================================================

    if (
        typeof window.openProfileSettings ===
        "function"
    ) {

        window.openProfileSettings(false);
    }
};

window.followUser = async function(userId){

    if(!session?.user){
        alert("Login first");
        return false;
    }

    if(!userId){
        console.error("❌ Missing user ID");
        return false;
    }

    const currentUserId = session.user.id;

    // Don't follow yourself
    if(String(userId) === String(currentUserId)){
        return false;
    }

    console.log("👤 FOLLOW REQUEST:", {
        sender_id: currentUserId,
        receiver_id: userId
    });


    // ==========================================
    // CHECK TARGET FOLLOW SETTINGS
    // ==========================================

    const { data: targetProfile, error: profileError } =
        await supabase
            .from("profiles")
            .select("allow_followers")
            .eq("id", userId)
            .single();

    if(profileError){

        console.error(
            "❌ PROFILE ERROR:",
            profileError
        );

        alert("Could not check this user's follow settings.");

        return false;
    }


    // ==========================================
    // USER DOES NOT ACCEPT FOLLOWERS
    // ==========================================

    if(targetProfile?.allow_followers === "nobody"){

        alert("This user is not accepting followers.");

        return false;
    }


    // ==========================================
    // CHECK IF ALREADY FOLLOWING
    // ==========================================

    const {
        data: existingFollow,
        error: followCheckError
    } = await supabase
        .from("follows")
        .select("id")
        .eq("follower_id", currentUserId)
        .eq("following_id", userId)
        .maybeSingle();


    if(followCheckError){

        console.error(
            "❌ FOLLOW CHECK ERROR:",
            followCheckError
        );

        return false;
    }


    if(existingFollow){

        console.log("ℹ️ Already following");

        return "following";
    }


    // ==========================================
    // CHECK EXISTING REQUEST
    // ==========================================

    const {
        data: existingRequest,
        error: requestCheckError
    } = await supabase
        .from("follow_requests")
        .select("id,status")
        .eq("sender_id", currentUserId)
        .eq("receiver_id", userId)
        .eq("status", "pending")
        .maybeSingle();


    if(requestCheckError){

        console.error(
            "❌ REQUEST CHECK ERROR:",
            requestCheckError
        );

        return false;
    }


    if(existingRequest){

        console.log(
            "⏳ Request already pending"
        );

        return "pending";
    }


    // ==========================================
    // CREATE FOLLOW REQUEST
    // ==========================================

    const { error: requestError } =
        await supabase
            .from("follow_requests")
            .insert({
                sender_id: currentUserId,
                receiver_id: userId,
                status: "pending",
                created_at: new Date().toISOString()
            });


    if(requestError){

        console.error(
            "❌ FOLLOW REQUEST INSERT ERROR:",
            requestError
        );

        alert(
            "❌ Failed to send follow request:\n\n" +
            requestError.message
        );

        return false;
    }


    console.log(
        "✅ FOLLOW REQUEST CREATED"
    );


    // ==========================================
    // GET SENDER PROFILE
    // ==========================================

    const { data: me } = await supabase
        .from("profiles")
        .select("name, avatar_url")
        .eq("id", currentUserId)
        .single();


    // ==========================================
    // SEND REQUEST NOTIFICATION
    // ==========================================

    const { error: notificationError } =
        await supabase
            .from("notifications")
            .insert({

                user_id: userId,

                sender_id: currentUserId,

                username: me?.name || "User",

                avatar_url: me?.avatar_url || null,

                type: "follow_request",

                message: "sent you a follow request",

                read: false,

                created_at: new Date().toISOString(),

                last_time: new Date().toISOString()

            });


    if(notificationError){

        console.error(
            "⚠️ NOTIFICATION ERROR:",
            notificationError
        );

    }


    console.log(
        "⏳ FOLLOW REQUEST PENDING"
    );


    return "pending";
};

window.openFollowRequests = async function (

        addHistory,
        source
    });

        alert("Login first");
        return;
    }

    const currentUserId = session.user.id;

    // =================================================
    // DETERMINE SOURCE
    // =================================================

    if (!source) {

        if (window.openedFollowRequestsFromNotification === true) {
            source = "notifications";
        }

        else if (
            window.openedFollowRequestsFromSettings === true
        ) {
            source = "profileSettings";
        }

        else {
            source = "profileSettings";
        }
    }

    // =================================================
    // CENTRAL NAVIGATION
    // =================================================

    if (typeof window.navigateToScreen === "function") {

        window.navigateToScreen(
            "followRequestsScreen",
            {
                userId: currentUserId,
                source: source
            },
            addHistory

    console.log(
        "👥 FOLLOW REQUESTS SOURCE:",
        source
    );

    // =================================================

    // =================================================

        .from("follow_requests")
        .select(`

            receiver_id,
            status,

window.acceptFollowRequest = async function(requestId, senderId){

    if(!session?.user){
        alert("Login first");
        return;
    }

    // ==========================================
    // CREATE ACTUAL FOLLOW
    // ==========================================

    const { error: followError } = await supabase
        .from("follows")
        .insert({
            follower_id: senderId,
            following_id: session.user.id
        });

    if(followError){

        console.error(
            "❌ ACCEPT FOLLOW ERROR:",
            followError
        );

        alert(
            "Failed to accept request:\n\n" +
            followError.message
        );

        return;
    }


    // ==========================================
    // DELETE REQUEST
    // ==========================================

    const { error: deleteError } = await supabase
        .from("follow_requests")
        .delete()
        .eq("id", requestId);

    if(deleteError){

        console.error(
            "❌ DELETE REQUEST ERROR:",
            deleteError
        );

        alert(
            "Follow accepted, but request could not be removed."
        );

        return;
    }


    // ==========================================
    // GET MY PROFILE
    // ==========================================

    const { data: me } = await supabase
        .from("profiles")
        .select("name, avatar_url")
        .eq("id", session.user.id)
        .single();


    // ==========================================
    // NOTIFY REQUESTER
    // ==========================================

    const { error: notificationError } = await supabase
        .from("notifications")
        .insert({
            user_id: senderId,
            sender_id: session.user.id,
            username: me?.name || "User",
            avatar_url: me?.avatar_url || null,
            type: "follow_accept",
            message: "accepted your follow request",
            read: false,
            created_at: new Date().toISOString(),
            last_time: new Date().toISOString()
        });


    if(notificationError){

        console.error(
            "⚠️ ACCEPT NOTIFICATION ERROR:",
            notificationError
        );

    }


    alert("✅ Follow request accepted.");
    
    if (typeof window.loadFollowingUsers === "function") {
    await window.loadFollowingUsers();
}

    openFollowRequests(false, window.currentFollowRequestsSource);
};

window.declineFollowRequest = async function(requestId){

  await supabase
    .from("follow_requests")
    .delete()
    .eq("id", requestId);

  alert("Follow request declined.");

  openFollowRequests(false, window.currentFollowRequestsSource);

};

window.savePrivacySettings = async function () {

    console.log("💾 SAVE PRIVACY SETTINGS");

    if (!session?.user) {
        alert("Login first");
        return;
    }

    // =================================================
    // GET CURRENT VALUES
    // =================================================

    const privateAccount =
        document.getElementById("privateAccount");

    const showOnline =
        document.getElementById("showOnline");

    const showLastSeen =
        document.getElementById("showLastSeen");

    const allowMessages =
        document.getElementById("allowMessages");

    const allowFollowers =
        document.getElementById("allowFollowers");

    if (
        !privateAccount ||
        !showOnline ||
        !showLastSeen ||
        !allowMessages ||
        !allowFollowers
    ) {
        console.error(
            "❌ PRIVACY SAVE: SETTINGS ELEMENTS MISSING"
        );

        return;
    }

    // =================================================
    // UPDATE DATABASE
    // =================================================

    const { error } = await supabase
        .from("profiles")
        .update({

            private_account:
                privateAccount.checked,

            show_online:
                showOnline.checked,

            show_last_seen:
                showLastSeen.checked,

            allow_messages:
                allowMessages.value,

            allow_followers:
                allowFollowers.value

        })
        .eq("id", session.user.id);

    if (error) {

        console.error(
            "❌ PRIVACY SAVE FAILED:",
            error
        );

        alert("Failed saving settings");
        return;
    }

    console.log("✅ PRIVACY SETTINGS SAVED");

    alert("Privacy settings saved.");

    // =================================================
    // PRIVACY → PROFILE SETTINGS
    // =================================================

    if (
        history.state?.appScreen ===
        "privacySettingsScreen"
    ) {
        history.back();
        return;
    }

    if (
        window.appNavigation?.current?.screen ===
        "privacySettingsScreen"
    ) {
        history.back();
        return;
    }

    // =================================================
    // FALLBACK
    // =================================================

    if (
        typeof window.openProfileSettings ===
        "function"
    ) {
        window.openProfileSettings(false);
    }
};

window.openPhotoGallery = function (index, userId) {
    console.log("🖼️ OPEN PHOTO GALLERY:", index, userId);

    const gallery =
        Array.isArray(window.profileGallery)
            ? window.profileGallery
            : [];

    if (!gallery.length) {
        console.warn("⚠️ PHOTO GALLERY IS EMPTY");
        return;
    }

    index = Number(index);

    if (
        !Number.isInteger(index) ||
        index < 0 ||
        index >= gallery.length
    ) {
        console.warn(
            "⚠️ INVALID PHOTO GALLERY INDEX:",
            index
        );

        index = 0;
    }

    window.profileGalleryIndex = index;

    /*
     * Reset gallery interaction state.
     */
    window.photoGalleryState = {
        zoomed: false,
        photoX: 0,
        photoY: 0,
        dragging: false,
        dragStartX: 0,
        dragStartY: 0,
        touchStartX: 0,
        touchEndX: 0,
        lastTap: 0,
        changing: false
    };

// =================================================
// RESET GALLERY CLOSE LOCK
// =================================================

window.photoGalleryClosing = false;

    /*
     * Remove any stale gallery.
     */
    const existingGallery =
        document.getElementById("photoGallery");

    if (existingGallery) {
        existingGallery.remove();
    }

    /*
     * Capture the screen underneath the gallery.
     */
    const currentNavigation =
        window.appNavigation?.current || null;

    const historyScreen =
        history.state?.appScreen || null;

    const sourceScreen =
        currentNavigation?.screen ||
        historyScreen ||
        "profileScreen";

    const sourceData =
        currentNavigation?.data || {};

    const galleryData = {
        sourceScreen,
        sourceData,
        index,
        userId: userId || null
    };

    /*
     * Create exactly one browser-history entry.
     */
    if (history.state?.appScreen !== "photoGallery") {
        history.pushState(
            {
                appScreen: "photoGallery",
                data: galleryData,
                scrollY: 0
            },
            "",
            location.href
        );
    } else {
        history.replaceState(
            {
                appScreen: "photoGallery",
                data: galleryData,
                scrollY: 0
            },
            "",
            location.href
        );
    }

    /*
     * Keep the application's navigation state synchronized.
     */
    if (window.appNavigation) {
        window.appNavigation.current = {
            screen: "photoGallery",
            data: galleryData,
            scrollY: 0,
            timestamp: Date.now()
        };

        sessionStorage.setItem(
            "appNavigationState",
            JSON.stringify(
                window.appNavigation.current
            )
        );
    }

    /*
     * Reuse an existing media viewer if the app already
     * has one. Otherwise create the gallery overlay.
     */
    let overlay =
        document.getElementById("photoGallery");

    if (!overlay) {
        overlay =
            document.createElement("div");

        overlay.id = "photoGallery";

        overlay.style.cssText = `
            position:fixed;
            inset:0;
            width:100vw;
            height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            background:#000;
            z-index:2147483646;
            overflow:hidden;
            visibility:visible;
            opacity:1;
            pointer-events:auto;
            touch-action:none;
        `;

/*
 * PHOTO GALLERY MUST BE A TOP-LEVEL OVERLAY.
 *
 * Do NOT place it inside #mediaViewer because
 * #mediaViewer can be display:none.
 */
document.body.appendChild(overlay);

}
    /*
     * Lock background scrolling.
     */
    try {
        if (
            typeof window.lockBackground ===
            "function"
        ) {
            window.lockBackground();
        } else {
            document.body.style.overflow = "hidden";
        }
    } catch (error) {
        console.warn(
            "⚠️ PHOTO GALLERY BACKGROUND LOCK FAILED:",
            error
        );

        document.body.style.overflow = "hidden";
    }

    renderPhotoGallery();
};


window.renderPhotoGallery = function () {

    const overlay =
        document.getElementById("photoGallery");

    if (!overlay) {
        console.warn(
            "⚠️ PHOTO GALLERY OVERLAY NOT FOUND"
        );
        return;
    }

    const gallery =
        Array.isArray(window.profileGallery)
            ? window.profileGallery
            : [];

    if (!gallery.length) {
        console.warn(
            "⚠️ CANNOT RENDER EMPTY PHOTO GALLERY"
        );

        window.closePhotoGallery(false);
        return;
    }

    let index =
        Number(window.profileGalleryIndex);

    if (
        !Number.isInteger(index) ||
        index < 0 ||
        index >= gallery.length
    ) {
        index = 0;
        window.profileGalleryIndex = 0;
    }

    const post =
        gallery[index];

    if (!post) {
        console.warn(
            "⚠️ PHOTO NOT FOUND:",
            index
        );
        return;
    }

    const imageUrl =
        typeof post.file_url === "string"
            ? post.file_url.trim()
            : "";

    if (!imageUrl) {
        console.warn(
            "⚠️ PHOTO URL MISSING:",
            post
        );
        return;
    }

    /*
     * Reset interaction state every time the photo changes.
     */
    const state =
        window.photoGalleryState ||
        {};

    state.zoomed = false;
    state.photoX = 0;
    state.photoY = 0;
    state.dragging = false;
    state.touchStartX = 0;
    state.touchEndX = 0;

    let touchStartX = 0;

        },
        {
            passive: true
        }
    );

    image.addEventListener(
        "touchmove",
        event => {

            if (
                !state.zoomed ||
                !state.dragging ||
                !event.touches?.length
            ) {
                return;
            }

            const touch =
                event.touches[0];

            state.photoX =
                touch.clientX -
                state.dragStartX;

            state.photoY =
                touch.clientY -
                state.dragStartY;

            image.style.transform =
                `translate(${state.photoX}px,${state.photoY}px) scale(2)`;
        },
        {
            passive: true
        }
    );

    image.addEventListener(
        "touchend",
        () => {
            state.dragging = false;
        }
    );

    /*
     * PRELOAD NEIGHBORING PHOTOS
     */
    preloadGalleryImages();

    console.log(
        "✅ PHOTO GALLERY RENDERED:",
        {
            index,
            total: gallery.length,
            postId: post.id
        }
    );
};


window.preloadGalleryImages = function () {

    const gallery =
        Array.isArray(window.profileGallery)
            ? window.profileGallery
            : [];

    if (!gallery.length) return;

    const length =
        gallery.length;

    const nextIndex =
        (Number(window.profileGalleryIndex) + 1) %
        length;

    const previousIndex =
        (
            Number(window.profileGalleryIndex) -
            1 +
            length
        ) %
        length;

    const next =
        gallery[nextIndex];

    const previous =
        gallery[previousIndex];

    if (next?.file_url) {
        const image =
            new Image();

        image.src =
            String(next.file_url).trim();
    }

    if (previous?.file_url) {
        const image =
            new Image();

        image.src =
            String(previous.file_url).trim();
    }
};


window.previousPhoto = function () {

    if (
        !Array.isArray(window.profileGallery) ||
        !window.profileGallery.length
    ) {
        return;
    }

    // =================================================
    // ONLY ONE PHOTO → DO NOTHING
    // =================================================
    if (window.profileGallery.length <= 1) {
        return;
    }

    const state =
        window.photoGalleryState ||
        {};

    if (state.changing === true) {
        return;
    }

    state.changing = true;

    state.photoX = 0;
    state.photoY = 0;
    state.zoomed = false;
    state.dragging = false;

    window.photoGalleryState =
        state;

    const image =
        document.getElementById(
            "galleryPhoto"
        );

    if (image) {
        image.style.transform =
            "translateX(100%) scale(1)";

        image.style.opacity =
            "0";
    }

    setTimeout(() => {

        const gallery =
            window.profileGallery;

        let index =
            Number(
                window.profileGalleryIndex
            );

        if (!Number.isInteger(index)) {
            index = 0;
        }

index--;

if (index < 0) {
    index =
        gallery.length - 1;
}

        window.profileGalleryIndex =
            index;

        /*
         * Keep the browser state synchronized
         * without creating another history entry.
         */
        if (
            history.state?.appScreen ===
            "photoGallery"
        ) {
            const data =
                history.state.data || {};

            history.replaceState(
                {
                    ...history.state,
                    data: {
                        ...data,
                        index
                    }
                },
                "",
                location.href
            );
        }

        renderPhotoGallery();

    }, 200);
};

window.closePhotoGallery = function (
    useHistory = true
) {

    // =================================================
    // PREVENT DUPLICATE CLOSE / DOUBLE HISTORY BACK
    // =================================================

    if (window.photoGalleryClosing === true) {
        console.log(
            "⏳ PHOTO GALLERY CLOSE ALREADY RUNNING"
        );
        return;
    }

    window.photoGalleryClosing = true;

    console.log(
        "🔙 CLOSE PHOTO GALLERY"
    );

    const gallery =
        document.getElementById(
            "photoGallery"
        );

    if (gallery) {
        gallery.remove();
    }

    window.photoGalleryState = null;

    /*
     * Restore background scrolling.
     */
    try {
        document.body.style.overflow = "";

        if (
            typeof window.unlockBackground ===
            "function"
        ) {
            window.unlockBackground();
        }
    } catch (error) {
        console.warn(
            "⚠️ PHOTO GALLERY BACKGROUND UNLOCK FAILED:",
            error
        );
    }

    if (
        useHistory &&
        history.state?.appScreen ===
            "photoGallery"
    ) {
        history.back();
        return;
    }

    /*
     * If this function was called because
     * popstate already happened, don't call
     * history.back() again.
     */
    if (
        window.appNavigation &&
        history.state?.appScreen !==
            "photoGallery"
    ) {
        window.appNavigation.current = {
            screen:
                history.state?.appScreen ||
                "app",
            data:
                history.state?.data ||
                {},
            scrollY:
                history.state?.scrollY ||
                0,
            timestamp: Date.now()
        };

        sessionStorage.setItem(
            "appNavigationState",
            JSON.stringify(
                window.appNavigation.current
            )
        );
    }
};

            }

            window.openChat(
                userId,

                {
                    source: "search"

            );

        }

        // =================================================
        // SEARCH / HISTORY → PROFILE

            event.target.closest(".search-profile-row");

        // Ignore PIN / REMOVE / MESSAGE buttons

            return;

            row.dataset.userId;

            {
                source: "search",

            }
        );

    localStorage.getItem("pinnedSearches") || "[]"
  );

  if(pinned.includes(id)){
    pinned = pinned.filter(x => x !== id);
  }else{
    pinned.unshift(id);
  }

  localStorage.setItem(
    "pinnedSearches",
    JSON.stringify(pinned)
  );

  searchUsers();
};

function isPinned(id){

  const pinned = JSON.parse(
    localStorage.getItem("pinnedSearches") || "[]"
  );

  return pinned.includes(id);

}

function formatSearchTime(date) {

  if (!date) return "";

  const diff = Date.now() - new Date(date).getTime();

  const mins = Math.floor(diff / 60000);

  if (mins < 1) return "Just now";

  if (mins < 60) return `${mins} min ago`;

  const hrs = Math.floor(mins / 60);

  if (hrs < 24) return `${hrs} hr ago`;

  const days = Math.floor(hrs / 24);

  if (days === 1) return "Yesterday";

  return `${days} days ago`;

}

    console.time("loadUnreadCount");

    try {
      await loadUnreadCount();
    } catch (err) {
      console.log("Unread notification count error:", err);
    }

    console.timeEnd("loadUnreadCount");


    console.time("loadUnreadMessages");

    try {
      await loadUnreadMessages();
    } catch (err) {
      console.log("Unread message count error:", err);
    }

    console.timeEnd("loadUnreadMessages");

  }


  // ===================================================
  // ATTACH EVENTS
  // ===================================================

  setTimeout(() => {

    try {
      attachEvents();
    } catch (err) {
      console.error("❌ attachEvents error:", err);
    }

  }, 0);


  // ===================================================
  // HOME ACTIVE
  // ===================================================

  if (typeof setActiveTopButton === "function") {
    setActiveTopButton("homeBtn");
  }


  // ===================================================
  // FORCE TOP BAR VISIBLE ON START
  // ===================================================

  if (typeof restoreTopBar === "function") {
    restoreTopBar();
  }


  // ===================================================
  // FINISHED
  // ===================================================

  console.log(
    "startApp finished in",
    Math.round(performance.now() - t0),
    "ms"
  );

};

// =====================================================
// CHAT
// =====================================================

let swipeStartX = 0;
let swipeStartY = 0;
let moveX = 0;

let searchResults = [];
let currentSearchIndex = -1;

let selectedMessages = [];
let selectionMode = false;

let currentChatUser = null;
let chatOpenedFrom = null;

// =====================================================
// OPEN CHAT
// CENTRAL NAVIGATION SAFE
// SOURCE-AWARE / RESTORE-SAFE
// =====================================================

window.openChat = async function (
    userId,
    name,
    navigationOptions = {}
) {

    console.log(
        "💬 OPENING CHAT:",
        userId,
        navigationOptions
    );

    // =====================================================
    // AUTH
    // =====================================================

    if (!session?.user) {

        alert("Please login first.");

        return;
    }

    if (!userId) {

        console.error(
            "❌ Missing chat userId"
        );

        return;
    }

    // =====================================================
    // DETERMINE CHAT SOURCE
    // =====================================================

    let chatSource =
        navigationOptions.source ||
        null;

    if (!chatSource) {

        const currentScreen =
            window.appNavigation?.current?.screen ||
            history.state?.appScreen ||
            null;

        if (currentScreen === "inboxScreen") {

            chatSource = "inbox";

        } else if (
            currentScreen === "searchScreen"
        ) {

            chatSource = "search";

        } else if (
            currentScreen === "notificationsScreen"
        ) {

            chatSource = "notifications";

        } else if (
            currentScreen === "profileScreen"
        ) {

            chatSource = "profile";

        } else if (
            currentScreen === "app"
        ) {

            chatSource = "home";
        }
    }

    if (!chatSource) {

        chatSource =
            window.chatOpenedFrom ||
            "inbox";
    }

    // =====================================================
    // SAVE SOURCE
    // =====================================================

    chatOpenedFrom =
        chatSource;

    window.chatOpenedFrom =
        chatSource;

    console.log(
        "💬 CHAT SOURCE:",
        chatSource
    );

    // =====================================================
    // CHECK MESSAGE PERMISSION
    //
    // IMPORTANT:
    // NO NAVIGATION HISTORY YET.
    // =====================================================

    const {
        data: targetProfile,
        error: permissionError
    } = await supabase
        .from("profiles")
        .select("*")
        .eq("id", userId)
        .maybeSingle();

    if (permissionError) {

        console.error(
            "❌ CHAT PERMISSION CHECK ERROR:",
            permissionError
        );

        alert(
            "Could not open this chat."
        );

        return;
    }

    if (!targetProfile) {

        console.error(
            "❌ CHAT TARGET PROFILE NOT FOUND:",
            userId
        );

        alert(
            "User not found."
        );

        return;
    }

    // =====================================================
    // MESSAGE PERMISSION
    // =====================================================

    if (
        targetProfile.allow_messages ===
        "nobody"
    ) {

        alert(
            "This user is not accepting messages."
        );

        return;
    }

    // =====================================================
    // FOLLOWER-ONLY MESSAGES
    // =====================================================

    if (
        targetProfile.allow_messages ===
        "followers"
    ) {

        const {
            data: follows,
            error: followError
        } = await supabase
            .from("follows")
            .select("id")
            .eq(
                "follower_id",
                session.user.id
            )
            .eq(
                "following_id",
                userId
            )
            .maybeSingle();

        if (followError) {

            console.error(
                "❌ MESSAGE FOLLOW CHECK ERROR:",
                followError
            );

            alert(
                "Could not verify messaging permissions."
            );

            return;
        }

        if (!follows) {

            alert(
                "Only followers can message this user."
            );

            return;
        }
    }

    // =====================================================
    // SET CURRENT CHAT
    // =====================================================

    currentChatUser =
        userId;

    // =====================================================
    // SAVE CHAT RETURN STATE
    // =====================================================

    window._chatReturnState = {

        source:
            chatSource,

        userId:
            userId,

        name:
            targetProfile.name ||
            name ||
            "User"
    };

    // =====================================================
    // HIDE COMPETING SCREENS
    // =====================================================

    [
        "inboxScreen",
        "searchScreen",
        "notificationsScreen",
        "commentsScreen",
        "profileScreen",
        "profileSettingsScreen",
        "editProfileScreen",
        "languageSettingsScreen",
        "privacySettingsScreen",
        "followRequestsScreen",
        "savedPostsScreen",
        "storyViewer",
        "mediaViewer"
    ].forEach(id => {

        if (
            document.getElementById(id)
        ) {

            hideScreen(id);
        }
    });

    // =====================================================
    // HIDE HOME
    // =====================================================

    const app =
        document.getElementById("app");

    if (app) {

        app.style.display = "none";
        app.style.visibility = "hidden";
        app.style.opacity = "0";
        app.style.pointerEvents = "none";
    }

    // =====================================================
    // SHOW CHAT
    // =====================================================

    if (
        !showScreen("chatScreen")
    ) {

        console.error(
            "❌ Could not open chatScreen"
        );

        return;
    }

    const chatScreen =
        document.getElementById(
            "chatScreen"
        );

    if (chatScreen) {

        chatScreen.style.zIndex =
            "5000";
    }

    // =====================================================
    // HIDE TOP BAR
    // =====================================================

    if (typeof hideTopBar === "function") {
        hideTopBar();
    }

    // =====================================================
    // LOCK BACKGROUND
    // =====================================================

    if (typeof lockBackground === "function") {
        lockBackground();
    }

    // =====================================================
    // CHAT NAME
    // =====================================================

    const chatName =
        document.getElementById(
            "chatName"
        );

    if (chatName) {

        chatName.innerText =
            targetProfile.name ||
            name ||
            "User";
    }

    // =====================================================
    // CHAT AVATAR
    // =====================================================

    const chatAvatar =
        document.getElementById(
            "chatAvatar"
        );

    if (chatAvatar) {

        chatAvatar.src =
            targetProfile.avatar_url ||
            (
                "https://ui-avatars.com/api/?name=" +
                encodeURIComponent(
                    targetProfile.name ||
                    name ||
                    "User"
                )
            );
    }

    // =====================================================
    // ONLINE STATUS
    // =====================================================

    const status =
        document.getElementById(
            "chatStatus"
        );

    if (status) {

        status.innerText =
            targetProfile.online
                ? "🟢 Online"
                : targetProfile.last_seen
                    ? `Last seen ${formatLastSeen(
                        targetProfile.last_seen
                    )}`
                    : "Offline";
    }

    // =====================================================
    // CENTRAL NAVIGATION
    //
    // IMPORTANT:
    // RESTORATION NEVER CREATES NEW HISTORY.
    // =====================================================

    const restoring =
        navigationOptions.restoring === true ||
        window.appNavigation?.restoring === true;

    if (typeof window.navigateToScreen === "function") {

        window.navigateToScreen(
            "chatScreen",
            {
                userId:
                    userId,

                name:
                    targetProfile.name ||
                    name ||
                    "User",

                source:
                    chatSource
            },
            !restoring
        );

    }

    console.log(
        "🧭 CHAT NAVIGATION:",
        window.appNavigation?.current
    );

    // =====================================================
    // MARK MESSAGES AS SEEN
    // =====================================================

    await supabase
        .from("messages")
        .update({
            seen: true,
            seen_at: new Date(),
            delivered: true
        })
        .eq(
            "sender_id",
            userId
        )
        .eq(
            "receiver_id",
            session.user.id
        )
        .eq(
            "seen",
            false
        );

    // =====================================================
    // UPDATE BADGE
    // =====================================================

    await loadUnreadMessages();

    // =====================================================
    // LOAD CHAT
    // =====================================================

    await loadMessages();

    // =====================================================
    // REALTIME
    // =====================================================

    listenToChatStatus(userId);

    listenTyping(userId);

    listenForSeenMessages(userId);

    console.log(
        "💬 CHAT OPENED SUCCESSFULLY:",
        userId
    );
};

function listenToChatStatus(userId) {

  if (window.chatStatusChannel) {
    supabase.removeChannel(window.chatStatusChannel);
  }

  window.chatStatusChannel = supabase
    .channel("chat_status_" + userId)
    .on(
      "postgres_changes",
      {
        event: "UPDATE",
        schema: "public",
        table: "profiles",
        filter: `id=eq.${userId}`
      },
     (payload) => {

  const profile = payload.new;

  const status = document.getElementById("chatStatus");

  if(!status || !profile) return;

  status.innerText =
    profile.online
      ? "🟢 Online"
      : profile.last_seen
        ? `Last seen ${formatLastSeen(profile.last_seen)}`
        : "Offline";

}
    )
    .subscribe();

}

    .from("messages")
    .select("id")
    .eq("receiver_id", currentUser.id)
    .eq("seen", false);

  if (error) {
    console.log(error);
    return;
  }

  const unreadMessages = data ? data.length : 0;

  const badge = document.getElementById("chatBadge");

window.openInbox = async function (addHistory = true) {

  console.log("📥 OPEN INBOX:", {
    addHistory,
    restoring: window.appNavigation?.restoring
  });

  // =========================================
  // SAVE HOME SCROLL
  // =========================================

  if (typeof saveHomeScroll === "function") {
    saveHomeScroll();
  }

  // =========================================
  // CENTRAL NAVIGATION
  // =========================================

  if (typeof window.navigateToScreen === "function") {

    window.navigateToScreen(
      "inboxScreen",
      {
        userId: session?.user?.id || null,
        source: "topBar"
      },
      addHistory
    );

  }

  console.log("OPENING INBOX");

  // =========================================
  // STOP TYPING
  // =========================================

  if (
    session?.user &&
    currentChatUser
  ) {

    try {

      await supabase
        .from("typing_status")
        .upsert({
          user_id: session.user.id,
          receiver_id: currentChatUser,
          typing: false,
          updated_at: new Date()
        });

    } catch (err) {

      console.log(
        "Typing cleanup error:",
        err
      );

    }

  }

  // =========================================
  // REMOVE CHAT CHANNELS
  // =========================================

  if (window.chatStatusChannel) {

    supabase.removeChannel(
      window.chatStatusChannel
    );

    window.chatStatusChannel = null;

  }

  if (window.typingChannel) {

    supabase.removeChannel(
      window.typingChannel
    );

    window.typingChannel = null;

  }

  if (window.messageSeenChannel) {

    supabase.removeChannel(
      window.messageSeenChannel
    );

    window.messageSeenChannel = null;

  }

  currentChatUser = null;

  // =========================================
  // CLOSE COMPETING SCREENS
  // =========================================

  [
    "chatScreen",
    "searchScreen",
    "notificationsScreen",
    "storyViewer",
    "mediaViewer",
    "commentsScreen",
    "profileScreen",
    "profileSettingsScreen",
    "editProfileScreen",
    "languageSettingsScreen",
    "privacySettingsScreen",
    "followRequestsScreen",
    "savedPostsScreen"
  ].forEach(id => {

    if (document.getElementById(id)) {
      hideScreen(id);
    }

  });

  // =========================================
  // KEEP MAIN APP HIDDEN
  // =========================================

  const app =
    document.getElementById("app");

  if (app) {

    app.style.display = "none";
    app.style.visibility = "hidden";
    app.style.opacity = "0";
    app.style.pointerEvents = "none";

  }

  // =========================================
  // SHOW INBOX
  // =========================================

  const inboxScreen =
    document.getElementById("inboxScreen");

  if (!inboxScreen) {

    console.error(
      "❌ inboxScreen not found"
    );

    return;

  }

  if (!showScreen("inboxScreen")) {

    console.error(
      "❌ Could not open inboxScreen"
    );

    return;

  }

  inboxScreen.style.zIndex = "5000";

  // =========================================
  // LOCK BACKGROUND
  // =========================================

  if (typeof lockBackground === "function") {
    lockBackground();
  }

  // =========================================
  // CHAT BUTTON ACTIVE
  // =========================================

  if (
    typeof setActiveTopButton ===
    "function"
  ) {

    setActiveTopButton(
      "chatBtn"
    );

  }

  // =========================================
  // RESTORE TOP BAR
  // =========================================

  requestAnimationFrame(() => {

    if (typeof restoreTopBar === "function") {
      restoreTopBar();
    }

  });

  // =========================================
  // GET INBOX LIST
  // =========================================

  const inbox =
    document.getElementById("inboxList");

  if (!inbox) {

    console.error(
      "❌ inboxList not found"
    );

    return;

  }

  inbox.innerHTML = "Loading...";

  // =========================================
  // GET SESSION
  // =========================================

  const {
    data: sessionData
  } = await supabase.auth.getSession();

  const userId =
    sessionData.session?.user?.id;

  if (!userId) {

    inbox.innerHTML =
      "Please login first";

    return;

  }

  // =========================================
  // GET MESSAGES
  // =========================================

  const {
    data: messages,
    error
  } = await supabase
    .from("messages")
    .select("*")
    .or(
      `sender_id.eq.${userId},receiver_id.eq.${userId}`
    )
    .order(
      "created_at",
      {
        ascending: false
      }
    );

  if (error) {

    console.error(
      "Inbox error:",
      error
    );

    inbox.innerHTML =
      "Error loading chats";

    return;

  }

  // =========================================
  // NO CHATS
  // =========================================

  if (
    !messages ||
    messages.length === 0
  ) {

    inbox.innerHTML =
      "No chats yet";

    return;

  }

  // =========================================
  // REMOVE DUPLICATE USERS
  // =========================================

  const uniqueUsers = {};

  messages.forEach(msg => {

    const otherUser =
      msg.sender_id === userId
        ? msg.receiver_id
        : msg.sender_id;

    if (!uniqueUsers[otherUser]) {

      uniqueUsers[otherUser] =
        msg;

    }

  });

  const chats =
    Object.values(uniqueUsers);

  inbox.innerHTML = "";

  // =========================================
  // BUILD CHAT LIST
  // =========================================

  for (const msg of chats) {

    const otherUser =
      msg.sender_id === userId
        ? msg.receiver_id
        : msg.sender_id;

    const unreadCount =
      messages.filter(m =>
        m.sender_id === otherUser &&
        m.receiver_id === userId &&
        !m.seen
      ).length;

    const {
      data: profile
    } = await supabase
      .from("profiles")
      .select("*")
      .eq(
        "id",
        otherUser
      )
      .maybeSingle();

    const div =
      document.createElement("div");

    // =======================================
    // LONG PRESS
    // =======================================

    let pressTimer;

    div.ontouchstart = () => {

      pressTimer =
        setTimeout(async () => {

          const confirmDelete =
            confirm(
              "Delete this chat?"
            );

          if (!confirmDelete)
            return;

          await supabase
            .from("messages")
            .delete()
            .or(`
              and(sender_id.eq.${userId},receiver_id.eq.${otherUser}),
              and(sender_id.eq.${otherUser},receiver_id.eq.${userId})
            `);

          // REFRESH WITHOUT NEW HISTORY
          openInbox(
            false
          );

        }, 700);

    };

    div.ontouchend = () => {

      clearTimeout(
        pressTimer
      );

    };

    div.ontouchmove = () => {

      clearTimeout(
        pressTimer
      );

    };

    // =======================================
    // CLICK CHAT
    // =======================================

    div.onclick = async () => {

      // =====================================
      // FORWARD MULTIPLE
      // =====================================

      if (
        window.forwardingMessages
      ) {

        for (
          const forwardedMsg
          of window.forwardingMessages
        ) {

          const {
            error
          } = await supabase
            .from("messages")
            .insert({
              sender_id: userId,
              receiver_id: otherUser,
              content:
                forwardedMsg.content,
              media_url:
                forwardedMsg.media_url,
              media_type:
                forwardedMsg.media_type,
              forwarded: true
            });

          if (error) {

            alert(error.message);
            return;

          }

        }

        window.forwardingMessages =
          null;

        alert(
          "Messages forwarded"
        );

        openInbox(
          false
        );

        return;

      }

      // =====================================
      // FORWARD SINGLE
      // =====================================

      if (
        window.forwardingMessage
      ) {

        const {
          error
        } = await supabase
          .from("messages")
          .insert({
            sender_id: userId,
            receiver_id: otherUser,
            content:
              window.forwardingMessage.content,
            media_url:
              window.forwardingMessage.media_url,
            media_type:
              window.forwardingMessage.media_type,
            forwarded: true
          });

        if (error) {

          alert(error.message);
          return;

        }

        window.forwardingMessage =
          null;

        alert(
          "Message forwarded"
        );

        openInbox(
          false
        );

        return;

      }

      // =====================================
      // NORMAL CHAT
      // =====================================

chatOpenedFrom = "inbox";

openChat(
  otherUser,
  profile?.name || "User",
  {
    source: "inbox"
  }
 );

    };

    // =======================================
    // CHAT ROW STYLE
    // =======================================

    div.style = `
      display:flex;
      align-items:flex-start;
      gap:12px;
      padding:15px;
      border-bottom:1px solid #222;
      cursor:pointer;
    `;

    // =======================================
    // CHAT ROW
    // =======================================

    div.innerHTML = `

window.jumpToMessage = function(messageId) {

  const msg = document.getElementById(messageId);

  if (!msg) {
    console.log("Original message not found:", messageId);
    return;
  }

  msg.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });


  msg.classList.add("message-highlight");


  setTimeout(() => {
    msg.classList.remove("message-highlight");
  },2000);

};

async function sendMessage() {

  const input =
    document.getElementById("chatInput");

  const fileInput =
    document.getElementById("chatMedia");

  const file =
    fileInput.files[0];
    
    const text = input.value.trim();

const detectedLanguage =
    text
        ? await detectLanguage(text)
        : "unknown";
    
    if (!session?.user) {
  alert("Please login first");
  return;
}

  // allow text OR media
  if (
    !input.value.trim() &&
    !file
  ) return;

  let mediaUrl = null;
  let mediaType = null;
  let fileName = null;

  // =====================
  // UPLOAD FILE
  // =====================
  
  if (file) {

  const allowed = [
    "image/jpeg",
    "image/png",
    "image/webp",
    "video/mp4",
    "video/webm"
  ];

  if (!allowed.includes(file.type)) {
    alert("Unsupported file type");
    return;
  }

}

if (file && file.size > 50 * 1024 * 1024) {
  alert("File too large");
  return;
}

  if (file) {

    fileName =
  `${session.user.id}_${Date.now()}_${file.name}`;

    mediaType =
      file.type.startsWith("video")
        ? "video"
        : "image";

    const { error: uploadError } =
      await supabase.storage
        .from("chat-media")
        .upload(fileName, file);

    if (uploadError) {
      alert(uploadError.message);
      return;
    }

    const { data } =
      supabase.storage
        .from("chat-media")
        .getPublicUrl(fileName);

    mediaUrl = data.publicUrl;
  }

  // =====================
  // SAVE MESSAGE
  // =====================

  const { data: insertedMessage, error } =
await supabase
.from("messages")
.insert({
    sender_id: session.user.id,
    receiver_id: currentChatUser,
    content: text,
    media_url: mediaUrl,
    media_type: mediaType,
    file_name: fileName,
    reply_to: replyingTo,

    language_code: detectedLanguage,
    translated_text: null,
    translation_status: "pending"
})
.select()
.single();

  if (error || !insertedMessage) {
    alert(error?.message || "Failed to send message.");
    return;
}

const userLanguage = await getPreferredLanguage();

if (
    text &&
    detectedLanguage !== "unknown" &&
    detectedLanguage !== userLanguage
) {

    const translated = await translateText(
        text,
        detectedLanguage,
        userLanguage
    );

    if (translated) {

        await supabase
            .from("messages")
            .update({
                translated_text: translated,
                translation_status: "completed"
            })
            .eq("id", insertedMessage.id);

    }

}
  
  // Notify the receiver
const { data: profile } = await supabase
  .from("profiles")
  .select("name, avatar_url")
  .eq("id", session.user.id)
  .single();

const { data: existing } = await supabase
  .from("notifications")
  .select("*")
  .eq("user_id", currentChatUser)
  .eq("type", "message")
  .eq("sender_id", session.user.id)
  .maybeSingle();

if (existing) {

  await supabase
    .from("notifications")
    .update({
      count: (existing.count || 1) + 1,
      username: profile.name,
      avatar_url: profile.avatar_url,
      message: input.value.trim()
        ? "📩 sent you a message"
        : mediaType === "video"
          ? "🎥 sent you a video"
          : "📷 sent you a photo",
      last_time: new Date(),
      read: false
    })
    .eq("id", existing.id);

} else {

  await supabase
    .from("notifications")
    .insert({
      user_id: currentChatUser,
      sender_id: session.user.id,
      username: profile.name,
      avatar_url: profile.avatar_url,
      type: "message",
      message: input.value.trim()
        ? "📩 sent you a message"
        : mediaType === "video"
          ? "🎥 sent you a video"
          : "📷 sent you a photo",
      count: 1,
      created_at: new Date(),
      last_time: new Date(),
      read: false
    });

}

await supabase
  .from("typing_status")
  .upsert({
    user_id: session.user.id,
    receiver_id: currentChatUser,
    typing: false,
    updated_at: new Date()
  });

  input.value = "";
  replyingTo = null;
  const replyPreview = document.getElementById("replyPreview");
if (replyPreview) {
  replyPreview.style.display = "none";
}
  fileInput.value = "";

  loadMessages();
}

function listenTyping(userId) {

  if (window.typingChannel) {
    supabase.removeChannel(window.typingChannel);
  }

  window.typingChannel = supabase
    .channel("typing_" + userId)
    .on(
      "postgres_changes",
      {
        event: "*",
        schema: "public",
        table: "typing_status",
        filter: `user_id=eq.${userId}`
      },
      (payload) => {

        const row = payload.new;

        if (!row) return;

        document.getElementById("typingIndicator").style.display =
          row.typing ? "block" : "none";

      }
    )
    .subscribe();

}

function listenForSeenMessages(userId) {

  if (window.messageSeenChannel) {
    supabase.removeChannel(window.messageSeenChannel);
  }

  window.messageSeenChannel = supabase
    .channel("seen_" + userId)
    .on(
      "postgres_changes",
      {
        event: "INSERT",
        schema: "public",
        table: "messages",
        filter: `receiver_id=eq.${session.user.id}`
      },
      async (payload) => {

        const msg = payload.new;

        if (msg.sender_id !== userId) return;

        await supabase
          .from("messages")
          .update({
            seen: true,
            seen_at: new Date(),
            delivered: true
          })
          .eq("id", msg.id);

        await loadUnreadMessages();

        loadMessages();

        if (
          document.getElementById("inboxScreen")?.style.display === "flex"
        ) {
          openInbox();
        }

      }
    )
    .subscribe();

}

// CENTRAL NAVIGATION SAFE
// CHAT → PREVIOUS SCREEN
// =====================================================

window.closeChat = async function () {

  console.log("🔙 CLOSE CHAT");

  // =====================================================
  // STOP TYPING
  // =====================================================

  if (session?.user && currentChatUser) {

    try {

      await supabase
        .from("typing_status")
        .upsert({
          user_id: session.user.id,
          receiver_id: currentChatUser,
          typing: false,
          updated_at: new Date()
        });

    } catch (err) {

      console.log(
        "Typing cleanup error:",
        err
      );

    }

  }

  // =====================================================
  // REMOVE CHAT CHANNELS
  // =====================================================

  if (window.chatStatusChannel) {

    supabase.removeChannel(
      window.chatStatusChannel
    );

    window.chatStatusChannel = null;

  }

  if (window.typingChannel) {

    supabase.removeChannel(
      window.typingChannel
    );

    window.typingChannel = null;

  }

  if (window.messageSeenChannel) {

    supabase.removeChannel(
      window.messageSeenChannel
    );

    window.messageSeenChannel = null;

  }

  // =====================================================
  // CHECK CURRENT HISTORY
  // =====================================================

  const state =
    history.state || null;

  const current =
    window.appNavigation?.current || null;

  // =====================================================
  // CHAT IS A REAL HISTORY SCREEN
  //
  // LET CENTRAL NAVIGATION RESTORE THE PREVIOUS SCREEN.
  // =====================================================

  if (
    state?.appScreen === "chatScreen" ||
    current?.screen === "chatScreen"
  ) {

    console.log(
      "🌐 CHAT → history.back()"
    );

    history.back();

    return;
  }

  // =====================================================
  // FALLBACK ONLY
  // =====================================================

  console.warn(
    "⚠️ CHAT HISTORY NOT FOUND → FALLBACK"
  );

  const source =
    window._chatReturnState?.source ||
    chatOpenedFrom ||
    "inbox";

  currentChatUser = null;
  chatOpenedFrom = null;

  window._chatReturnState = null;

  // =====================================================
  // FALLBACK: NOTIFICATIONS
  // =====================================================

  if (source === "notifications") {

    if (
      typeof window.openNotifications ===
      "function"
    ) {

      await window.openNotifications(false);

    }

    return;
  }

  // =====================================================
  // FALLBACK: SEARCH
  // =====================================================

  if (source === "search") {

    if (
      typeof window.openSearch ===
      "function"
    ) {

      await window.openSearch(false);

    }

    return;
  }

  // =====================================================
  // FALLBACK: INBOX
  // =====================================================

  if (
    typeof window.openInbox ===
    "function"
  ) {

    await window.openInbox(false);

  }

};

  } else {

window.searchMessages = function () {

  const value = document
    .getElementById("chatSearch")
    .value
    .toLowerCase()
    .trim();

  searchResults = [];
  currentSearchIndex = -1;

  document.querySelectorAll(".chatMessage").forEach(msg => {

    msg.style.outline = "";

    if (
      value &&
      (msg.dataset.message || "").includes(value)
    ) {
      searchResults.push(msg);
    }

  });

  if (searchResults.length) {
    currentSearchIndex = 0;
    highlightSearchResult();
  }

};

function highlightSearchResult() {

  document
    .querySelectorAll(".chatMessage")
    .forEach(m => m.style.outline = "");

  const msg = searchResults[currentSearchIndex];

  if (!msg) return;

  msg.style.outline = "2px solid #1d9bf0";

  msg.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

}

window.nextSearchResult = function () {

  if (!searchResults.length) return;

  currentSearchIndex =
    (currentSearchIndex + 1) %
    searchResults.length;

  highlightSearchResult();

};

window.previousSearchResult = function () {

  if (!searchResults.length) return;

  currentSearchIndex =
    (currentSearchIndex - 1 + searchResults.length) %
    searchResults.length;

  highlightSearchResult();

};

window.formatLastSeen = function(date){

  if(!date) return "Offline";

  const now = new Date();

  const last = new Date(date);

  const diff =
    Math.floor(
      (now-last)/1000
    );


  if(diff < 60){

    return "just now";

  }


  if(diff < 3600){

    return Math.floor(diff/60)+" min ago";

  }


  if(diff < 86400){

    return Math.floor(diff/3600)+" hours ago";

  }


  return last.toLocaleDateString();

};
