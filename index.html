            updateHistory &&
            state?.appScreen ===
            "profileScreen"
        ) {

            const data = {
                ...(state.data || {}),
                userId,
                name: profileName,
                tab: tabName
            };


            history.replaceState(
                {
                    ...state,
                    data
                },
                "",
                location.href
            );


            if (
                window.appNavigation
            ) {

                window.appNavigation.current = {

                    screen:
                        "profileScreen",

                    data,

                    scrollY:
                        getProfileScrollY(),

                    timestamp:
                        Date.now()
                };


                sessionStorage.setItem(
                    "appNavigationState",
                    JSON.stringify(
                        window.appNavigation.current
                    )
                );
            }
        }
    }

    // =================================================
    // PROFILE SCROLL STATE
    // =================================================

    profileScrollContainer?.addEventListener(
        "scroll",
        () => {

            if (
                history.state?.appScreen !==
                "profileScreen"
            ) {
                return;
            }


            if (
                window.appNavigation?.current
            ) {

                window.appNavigation.current.scrollY =
                    getProfileScrollY();

                sessionStorage.setItem(
                    "appNavigationState",
                    JSON.stringify(
                        window.appNavigation.current
                    )
                );
            }
        },
        {
            passive: true
        }
    );


    // =================================================
    // POSTS TAB
    // =================================================

    postsTab?.addEventListener(
        "click",
        async () => {

            setProfileTab(
                postsTab,
                0,
                "posts"
            );

            await loadProfilePosts(
                userId
            );
        }
    );


    // =================================================
    // PHOTOS TAB
    // =================================================

    photosTab?.addEventListener(
        "click",
        async () => {

            setProfileTab(
                photosTab,
                1,
                "photos"
            );

            await loadProfilePhotos(
                userId
            );
        }
    );


    // =================================================
    // VIDEOS TAB
    // =================================================

    videosTab?.addEventListener(
        "click",
        async () => {

            setProfileTab(
                videosTab,
                2,
                "videos"
            );

            await loadProfileVideos(
                userId
            );
        }
    );


    // =================================================
    // INITIAL TAB
    // =================================================

    const initialTab =
        navigationOptions.tab ||
        "posts";


    if (
        initialTab ===
        "photos"
    ) {

        setProfileTab(
            photosTab,
            1,
            "photos",
            false
        );

        await loadProfilePhotos(
            userId
        );

    }
    else if (
        initialTab ===
        "videos"
    ) {

        setProfileTab(
            videosTab,
            2,
            "videos",
            false
        );

        await loadProfileVideos(
            userId
        );

    }
    else {

        setProfileTab(
            postsTab,
            0,
            "posts",
            false
        );

        await loadProfilePosts(
            userId
        );
    }


    // =================================================
    // FOLLOW BUTTON
    // =================================================

    const followContainer =
        document.getElementById(
            "followContainer"
        );


    if (
        session?.user?.id &&
        String(session.user.id) !==
        String(userId) &&
        followContainer
    ) {

        let existingFollow = null;
        let pendingRequest = null;


        try {

            const [
                followResult,
                requestResult
            ] = await Promise.all([

                supabase
                    .from("follows")
                    .select("id")
                    .eq(
                        "follower_id",
                        session.user.id
                    )
                    .eq(
                        "following_id",
                        userId
                    )
                    .maybeSingle(),

                supabase
                    .from("follow_requests")
                    .select("id,status")
                    .eq(
                        "sender_id",
                        session.user.id
                    )
                    .eq(
                        "receiver_id",
                        userId
                    )
                    .eq(
                        "status",
                        "pending"
                    )
                    .maybeSingle()
            ]);


            existingFollow =
                followResult?.data || null;

            pendingRequest =
                requestResult?.data || null;

        }
        catch (error) {

            console.warn(
                "⚠️ FOLLOW STATE LOAD FAILED:",
                error
            );
        }


        let state =
            existingFollow
                ? "following"
                : pendingRequest
                    ? "pending"
                    : "follow";


        const renderFollowButton =
            () => {

                let text =
                    "Follow";

                let background =
                    "#1d9bf0";


                if (
                    state ===
                    "following"
                ) {

                    text =
                        "Following";

                    background =
                        "#444";
                }
                else if (
                    state ===
                    "pending"
                ) {

                    text =
                        "Requested";

                    background =
                        "#444";
                }


                followContainer.innerHTML = `

<button
    id="followBtn"
    type="button"
    style="
        margin-top:10px;
        padding:8px 14px;
        border:none;
        border-radius:8px;
        background:${background};
        color:white;
        cursor:pointer;
    "
>
${text}
</button>
`;


                const button =
                    document.getElementById(
                        "followBtn"
                    );


                if (!button) {
                    return;
                }


                button.onclick =
                    async function () {

                        if (
                            !session?.user
                        ) {

                            alert(
                                "Please log in first."
                            );

                            return;
                        }


                        button.disabled =
                            true;


                        try {

                            if (
                                state ===
                                "following"
                            ) {

                                const {
                                    error
                                } =
                                    await supabase
                                        .from("follows")
                                        .delete()
                                        .eq(
                                            "follower_id",
                                            session.user.id
                                        )
                                        .eq(
                                            "following_id",
                                            userId
                                        );


                                if (error) {
                                    throw error;
                                }


                                state =
                                    "follow";


                                if (
                                    typeof window.loadFollowingUsers ===
                                    "function"
                                ) {

                                    await window
                                        .loadFollowingUsers();
                                }


                                renderFollowButton();

                                return;
                            }


                            if (
                                state ===
                                "pending"
                            ) {

                                alert(
                                    "⏳ Follow request is already pending."
                                );

                                button.disabled =
                                    false;

                                return;
                            }


                            if (
                                typeof window.followUser !==
                                "function"
                            ) {

                                throw new Error(
                                    "followUser() not found"
                                );
                            }


                            const result =
                                await window.followUser(
                                    userId
                                );


                            if (
                                result ===
                                "pending"
                            ) {

                                state =
                                    "pending";

                            }
                            else if (
                                result ===
                                "following" ||
                                result ===
                                "followed"
                            ) {

                                state =
                                    "following";

                            }
                            else {

                                throw new Error(
                                    "Unknown follow result: " +
                                    result
                                );
                            }


                            renderFollowButton();

                        }
                        catch (error) {

                            console.error(
                                "❌ FOLLOW ACTION FAILED:",
                                error
                            );

                            alert(
                                error?.message ||
                                "Could not update follow status."
                            );

                            button.disabled =
                                false;
                        }
                    };
            };


        renderFollowButton();
    }


    // =================================================
    // FINISHED
    // =================================================

    console.log(
        "✅ PROFILE OPENED:",
        userId,
        {
            source:
                navigationSource,

            tab:
                window.currentProfileTab
        }
    );


    return true;
};

window.loadProfilePosts = async function (userId) {

    const container =
        document.getElementById("profilePosts");

    if (!container) {

        console.warn(
            "⚠️ PROFILE POSTS CONTAINER NOT FOUND"
        );

        return;
    }


    container.innerHTML = `
        <div style="
            padding:20px;
            text-align:center;
            color:#aaa;
        ">
            Loading...
        </div>
    `;


    try {

        // ---------------------------------------------
        // GET POSTS
        // ---------------------------------------------

        const {
            data: posts,
            error
        } = await supabase
            .from("posts")
            .select("*")
            .eq("user_id", userId)
            .order("pinned", {
                ascending: false
            })
            .order("created_at", {
                ascending: false
            });


        if (error) {
            throw error;
        }


        // ---------------------------------------------
        // NO POSTS
        // ---------------------------------------------

        if (!posts || posts.length === 0) {

            container.innerHTML = `
                <div style="
                    padding:30px 20px;
                    text-align:center;
                    color:#888;
                ">
                    No posts yet
                </div>
            `;

            return;
        }


        // ---------------------------------------------
        // GET PROFILE
        // ---------------------------------------------

        const {
            data: profile,
            error: profileError
        } = await supabase
            .from("profiles")
            .select(`
                id,
                name,
                username,
                avatar_url,
                verified
            `)
            .eq("id", userId)
            .maybeSingle();


        if (profileError) {

            console.warn(
                "⚠️ PROFILE DATA ERROR:",
                profileError
            );
        }


        // ---------------------------------------------
        // ATTACH PROFILE DATA
        // ---------------------------------------------

        posts.forEach(post => {

            post.profiles =
                profile || null;

            post.name =
                profile?.name ||
                "User";

            post.username =
                profile?.username ||
                "";

            post.avatar_url =
                profile?.avatar_url ||
                "";

            post.verified =
                profile?.verified === true;

        });


        // ---------------------------------------------
        // SAVE CURRENT POSTS
        // ---------------------------------------------

        window.profilePosts =
            posts;


        // ---------------------------------------------
        // RENDER
        // ---------------------------------------------

        container.replaceChildren();

        window.renderedPosts =
            new Set();


        for (const post of posts) {

            try {

                const element =
                    renderPostElement(post);

                if (element) {

                    container.appendChild(
                        element
                    );
                }

            }
            catch (renderError) {

                console.error(
                    "❌ PROFILE POST RENDER ERROR:",
                    renderError,
                    post
                );
            }
        }


        console.log(
            "✅ PROFILE POSTS LOADED:",
            posts.length
        );

    }
    catch (error) {

        console.error(
            "❌ PROFILE POSTS ERROR:",
            error
        );

        container.innerHTML = `
            <div style="
                padding:30px 20px;
                text-align:center;
                color:#f88;
            ">
                Error loading posts
            </div>
        `;
    }
};

window.loadProfilePhotos = async function (userId) {

            .select("*")

            .eq("media_type", "image")
            .order("created_at", {
                ascending: false
            });


        if (error) {
            throw error;
        }


        // ---------------------------------------------
        // NO PHOTOS
        // ---------------------------------------------

        if (!posts || posts.length === 0) {

            window.profileGallery = [];
            window.profileGalleryIndex = 0;

            container.innerHTML = `
                <div style="
                    padding:30px 20px;
                    text-align:center;
                    color:#888;
                ">
                    No photos yet
                </div>
            `;

            return;
        }


        // ---------------------------------------------
        // GET PROFILE
        // ---------------------------------------------

        const {
            data: profile,
            error: profileError
        } = await supabase
            .from("profiles")
            .select(`
                id,
                name,
                username,
                avatar_url,
                verified
            `)
            .eq("id", userId)
            .maybeSingle();


        if (profileError) {

            console.warn(
                "⚠️ PHOTO PROFILE ERROR:",
                profileError
            );
        }


        // ---------------------------------------------
        // ATTACH PROFILE DATA
        // ---------------------------------------------

        posts.forEach(post => {

            post.profiles =
                profile || null;

            post.name =
                profile?.name ||
                "User";

            post.username =
                profile?.username ||
                "";

            post.avatar_url =
                profile?.avatar_url ||
                "";

            post.verified =
                profile?.verified === true;

        });


        // ---------------------------------------------
        // SAVE GALLERY DATA
        // ---------------------------------------------

        window.profileGallery =
            posts;

        window.profileGalleryIndex =
            0;


        // ---------------------------------------------
        // BUILD GRID
        // ---------------------------------------------

        container.replaceChildren();


        const grid =
            document.createElement("div");

        grid.style.cssText = `
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:4px;
            width:100%;
        `;


        posts.forEach((post, index) => {

            const url =
                typeof post.file_url === "string"
                    ? post.file_url.trim()
                    : "";


            // -----------------------------------------
            // INVALID IMAGE
            // -----------------------------------------

            if (!url) {

                const broken =
                    document.createElement("div");

                broken.style.cssText = `
                    width:100%;
                    aspect-ratio:1;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    background:#222;
                    color:#777;
                    border-radius:8px;
                    font-size:12px;
                `;

                broken.textContent =
                    "No image";

                grid.appendChild(
                    broken
                );

                return;
            }


            // -----------------------------------------
            // IMAGE
            // -----------------------------------------

            const image =
                document.createElement("img");

            image.src = url;

            image.alt =
                post.content ||
                "Photo";

            image.loading =
                "lazy";

            image.decoding =
                "async";

            image.style.cssText = `
                width:100%;
                aspect-ratio:1;
                object-fit:cover;
                border-radius:8px;
                cursor:pointer;
                display:block;
                background:#222;
            `;


            // -----------------------------------------
            // IMAGE ERROR
            // -----------------------------------------

            image.onerror =
                function () {

                    console.error(
                        "❌ PROFILE PHOTO FAILED:",
                        url
                    );

                    image.style.display =
                        "none";

                    const errorBox =
                        document.createElement("div");

                    errorBox.style.cssText = `
                        width:100%;
                        aspect-ratio:1;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        background:#222;
                        color:#777;
                        border-radius:8px;
                        font-size:12px;
                    `;

                    errorBox.textContent =
                        "Image unavailable";

                    image.parentElement?.appendChild(
                        errorBox
                    );
                };


            // -----------------------------------------
            // OPEN PHOTO GALLERY
            // -----------------------------------------

            image.addEventListener(
                "click",
                function (event) {

                    event.preventDefault();
                    event.stopPropagation();

                    console.log(
                        "🖼️ PROFILE PHOTO CLICK:",
                        {
                            index,
                            userId,
                            url
                        }
                    );


                    if (
                        typeof window.openPhotoGallery !==
                        "function"
                    ) {

                        console.error(
                            "❌ openPhotoGallery() NOT FOUND"
                        );

                        return;
                    }


                    window.openPhotoGallery(
                        index,
                        userId
                    );
                }
            );


            grid.appendChild(
                image
            );
        });


        container.appendChild(
            grid
        );


        console.log(
            "✅ PROFILE PHOTOS LOADED:",
            posts.length
        );

    }
    catch (error) {

        console.error(
            "❌ PROFILE PHOTOS ERROR:",
            error
        );

        window.profileGallery = [];
        window.profileGalleryIndex = 0;

        container.innerHTML = `
            <div style="
                padding:30px 20px;
                text-align:center;
                color:#f88;
            ">
                Error loading photos
            </div>
        `;
    }
};

function createVideoPage(post, index) {
    const page = document.createElement("div");

    page.dataset.index = String(index);
    page.className = "profile-video-item";

    page.style.cssText = `
        height:100vh;
        width:100%;
        position:relative;
        display:flex;
        justify-content:center;
        align-items:center;
        scroll-snap-align:start;
        overflow:hidden;
        background:#000;
        transform:translateY(0);
    `;

    // =====================================================
    // VIDEO
    // =====================================================

    const video = document.createElement("video");

    const videoUrl =
        typeof post?.file_url === "string"
            ? post.file_url.trim()
            : "";

    if (!videoUrl) {
        console.error("❌ PROFILE VIDEO URL MISSING:", post);
        return page;
    }

    video.src = videoUrl;

    video.autoplay = false;
    video.loop = false;
    video.muted = true;
    video.playsInline = true;
    video.controls = false;
    video.preload = "metadata";

    video.setAttribute("playsinline", "");
    video.setAttribute("webkit-playsinline", "");

    video.disablePictureInPicture = true;
    video.controlsList = "nodownload";

    video.style.cssText = `
        position:absolute;
        inset:0;
        width:100%;
        height:100%;
        display:block;
        visibility:visible;
        opacity:1;
        z-index:1;
        object-fit:contain;
        background:#000;
    `;

    // -----------------------------------------------------
    // Determine video display mode
    // -----------------------------------------------------

    video.addEventListener("loadedmetadata", () => {
        if (
            video.videoWidth > 0 &&
            video.videoHeight > 0
        ) {
            const ratio =
                video.videoWidth /
                video.videoHeight;

            video.style.objectFit =
                ratio > 1
                    ? "contain"
                    : "cover";
        }
    });

    video.addEventListener("error", () => {
        console.error(
            "❌ PROFILE VIDEO FAILED:",
            {
                postId: post.id,
                url: videoUrl,
                error: video.error
            }
        );
    });

    page.appendChild(video);

    // =====================================================
    // GRADIENT
    // =====================================================

    const gradient =
        document.createElement("div");

    gradient.className =
        "profile-video-gradient";

    gradient.style.cssText = `
        position:absolute;
        inset:0;
        z-index:2;
        pointer-events:none;
        background:transparent;
    `;

    page.appendChild(gradient);

    // =====================================================
    // LOADER
    // =====================================================

    const loader =
        document.createElement("div");

    loader.className =
        "profile-video-loader";

    loader.style.cssText = `
        display:none;
    `;

    page.appendChild(loader);

    // =====================================================
    // VIDEO ENDED
    // Observer controls actual playback.
    // =====================================================

    video.addEventListener("ended", () => {
        const next =
            page.nextElementSibling;

        if (!next) return;

        next.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    });

    // =====================================================
    // TAP / DOUBLE TAP
    // =====================================================

    let lastTap = 0;
    let tapTimer = null;

    video.addEventListener(
        "click",
        event => {
            const now = Date.now();

            if (now - lastTap < 300) {
                clearTimeout(tapTimer);
                tapTimer = null;

                const x = event.clientX;
                const width = page.clientWidth;

                // -----------------------------------------
                // DOUBLE TAP LEFT = REWIND
                // -----------------------------------------

                if (x < width / 3) {
                    if (Number.isFinite(video.duration)) {
                        video.currentTime =
                            Math.max(
                                0,
                                video.currentTime - 10
                            );
                    }

                    lastTap = 0;
                    return;
                }

                // -----------------------------------------
                // DOUBLE TAP RIGHT = FORWARD
                // -----------------------------------------

                if (x > width * 2 / 3) {
                    if (Number.isFinite(video.duration)) {
                        video.currentTime =
                            Math.min(
                                video.duration,
                                video.currentTime + 10
                            );
                    }

                    lastTap = 0;
                    return;
                }

                // -----------------------------------------
                // DOUBLE TAP CENTER = LIKE
                // -----------------------------------------

                if (
                    typeof window.likePost ===
                    "function"
                ) {
                    window.likePost(post.id);
                }

                const heart =
                    document.createElement("div");

                heart.className =
                    "heart-animation";

                heart.textContent = "❤️";

                page.appendChild(heart);

                requestAnimationFrame(() => {
                    heart.classList.add("show");
                });

                setTimeout(() => {
                    heart.remove();
                }, 700);

                lastTap = 0;
                return;
            }

            lastTap = now;

            clearTimeout(tapTimer);

            tapTimer = setTimeout(() => {
                tapTimer = null;

                if (video.paused) {
                    video.play().catch(error => {
                        console.warn(
                            "⚠️ VIDEO TAP PLAY FAILED:",
                            error
                        );
                    });
                } else {
                    video.pause();
                }
            }, 300);
        }
    );

    // =====================================================
    // LONG PRESS → 2× SPEED
    // =====================================================

    let pressTimer = null;
    let fastForward = false;

    video.addEventListener(
        "pointerdown",
        event => {
            if (
                event.clientX <=
                page.clientWidth * 0.65
            ) {
                return;
            }

            clearTimeout(pressTimer);

            pressTimer = setTimeout(() => {
                fastForward = true;

                video.playbackRate = 2;

                if (
                    !page.querySelector(
                        ".profile-video-speed"
                    )
                ) {
                    const speed =
                        document.createElement("div");

                    speed.className =
                        "profile-video-speed";

                    speed.textContent = "⏩ 2×";

                    page.appendChild(speed);
                }
            }, 250);
        }
    );

    video.addEventListener(
        "pointerup",
        () => {
            clearTimeout(pressTimer);

            if (!fastForward) return;

            fastForward = false;

            video.playbackRate = 1;

            page.querySelector(
                ".profile-video-speed"
            )?.remove();
        }
    );

    video.addEventListener(
        "pointercancel",
        () => {
            clearTimeout(pressTimer);

            fastForward = false;

            video.playbackRate = 1;

            page.querySelector(
                ".profile-video-speed"
            )?.remove();
        }
    );

    // =====================================================
    // INFO
    // =====================================================

    const info =
        document.createElement("div");

    info.className =
        "profile-video-info";

    info.innerHTML = `
        <div class="profile-video-username">
            ${escapeHtml(post.name || "User")}
            ${post.verified === true ? " ✓" : ""}
        </div>

        <div class="profile-video-caption">
            ${escapeHtml(post.content || "")}
        </div>
    `;

    const music =
        document.createElement("div");

    music.className =
        "profile-video-music";

    music.textContent =
        `🎵 ${post.music_name || "Original audio"}`;

    info.appendChild(music);
    page.appendChild(info);

    // =====================================================
    // ACTIONS
    // =====================================================

    const actions =
        document.createElement("div");

    actions.className =
        "profile-video-actions";

    actions.style.cssText = `
        position:absolute;
        right:16px;
        bottom:120px;
        width:60px;
        min-width:60px;
        min-height:220px;
        height:auto;
        display:flex;
        flex-direction:column;
        align-items:center;
        justify-content:flex-end;
        gap:18px;
        z-index:10;
        visibility:visible;
        opacity:1;
        pointer-events:auto;
    `;

    // =====================================================
    // AVATAR
    // =====================================================

    const avatarWrap =
        document.createElement("div");

    avatarWrap.className =
        "profile-video-avatar-wrap";

    const avatar =
        document.createElement("img");

    const avatarUrl =
        typeof post.avatar_url === "string"
            ? post.avatar_url.trim()
            : "";

    avatar.src =
        avatarUrl ||
        "https://via.placeholder.com/60";

    avatar.alt =
        post.name || "User";

    avatar.style.cssText = `
        width:50px;
        height:50px;
        border-radius:50%;
        object-fit:cover;
        cursor:pointer;
        display:block;
    `;

    avatar.addEventListener(
        "click",

                video.muted

                    : "🔊";

    );

    // PROGRESS BAR
    // =====================================================

    const progress =
        document.createElement("div");

        "video-progress";

    const fill =
        document.createElement("div");

    fill.className =
        "video-progress-fill";

    fill.style.width = "0%";

    progress.appendChild(fill);
    page.appendChild(progress);

    progress.addEventListener(
        "click",
        event => {
            event.stopPropagation();

            if (
                !Number.isFinite(
                    video.duration
                ) ||
                video.duration <= 0
            ) {
                return;
            }

            const rect =
                progress.getBoundingClientRect();

            const percent =
                Math.max(
                    0,
                    Math.min(
                        1,
                        (event.clientX -
                            rect.left) /
                            rect.width
                    )
                );

            video.currentTime =
                percent *
                video.duration;
        }
    );

    // =====================================================
    // SWIPE LEFT → COMMENTS
    // =====================================================

    let touchStartX = 0;
    let touchStartY = 0;

    page.addEventListener(
        "touchstart",
        event => {
            if (
                !event.changedTouches?.length
            ) {
                return;
            }

            touchStartX =
                event.changedTouches[0]
                    .screenX;

            touchStartY =
                event.changedTouches[0]
                    .screenY;
        },
        { passive: true }
    );

    page.addEventListener(
        "touchend",
        event => {
            if (
                !event.changedTouches?.length
            ) {
                return;
            }

            const touch =
                event.changedTouches[0];

            const diffX =
                touchStartX -
                touch.screenX;

            const diffY =
                touchStartY -
                touch.screenY;

            // Only treat it as horizontal
            // when horizontal movement is dominant.
            if (
                diffX > 80 &&
                Math.abs(diffX) >
                    Math.abs(diffY)
            ) {
                video.pause();

                window.currentVideo =
                    video;

                window.currentPostId =
                    post.id;

                if (
                    typeof window.openComments ===
                    "function"
                ) {
                    window.openComments(
                        post.id
                    );
                }
            }
        },
        { passive: true }
    );

// =====================================================
    // UI
// =====================================================

    function showUI() {
        info.style.opacity = "1";
        actions.style.opacity = "1";
        mute.style.opacity = "1";
        progress.style.opacity = "1";
    }

    function hideUI() {
        // Keep controls visible for now.
        showUI();
    }

// =====================================================
    // VIDEO EVENTS
// =====================================================

    video.addEventListener(
        "timeupdate",
        () => {
            if (
                !Number.isFinite(
                    video.duration
                ) ||
                video.duration <= 0
            ) {
                return;
            }

            const percent =
                (
                    video.currentTime /
                    video.duration
                ) * 100;

            fill.style.width =
                `${Math.min(
                    100,
                    Math.max(0, percent)
                )}%`;
        }
    );

    video.addEventListener(
        "canplay",
        () => {
            loader.style.display =
                "none";

            video.style.opacity = "1";
        }
    );

    video.addEventListener(
        "play",
        () => {
            showUI();
        }
    );

    video.addEventListener(
        "pause",
        () => {
            showUI();
        }
    );

// =====================================================
    // FINAL STATE
// =====================================================

    video.style.opacity = "1";

    return page;
}

window.observeProfileVideos = function (container) {

    if (!container) {
        console.error(
            "❌ observeProfileVideos(): container missing"
        );
        return null;
    }

    // -----------------------------------------------------
    // Disconnect an old observer if this feed is reused.
    // -----------------------------------------------------

    if (container._profileVideoObserver) {
        try {
            container._profileVideoObserver.disconnect();
        } catch (error) {
            console.warn(
                "⚠️ OLD VIDEO OBSERVER DISCONNECT FAILED:",
                error
            );
        }

        container._profileVideoObserver = null;
    }

    container.style.scrollSnapType = "y mandatory";
    container.style.scrollBehavior = "smooth";

    const observer =
        new IntersectionObserver(
            entries => {

                entries.forEach(entry => {

                    const video =
                        entry.target.querySelector(
                            "video"
                        );

                    if (!video) return;

                    // -------------------------------------------------
                    // ACTIVE VIDEO
                    // -------------------------------------------------

                    if (
                        entry.isIntersecting &&
                        entry.intersectionRatio >= 0.75
                    ) {

                        // Pause every other video.
                        container
                            .querySelectorAll("video")
                            .forEach(otherVideo => {

                                if (
                                    otherVideo !== video
                                ) {
                                    otherVideo.pause();
                                }

                            });

                        const currentIndex =
                            Number(
                                entry.target.dataset.index
                            );

                        if (
                            Number.isFinite(
                                currentIndex
                            )
                        ) {
                            window.profileVideoIndex =
                                currentIndex;
                        }

                        video.style.opacity = "1";

                        // -------------------------------------------------
                        // IMPORTANT:
                        // DO NOT reset currentTime.
                        // DO NOT call load().
                        //
                        // The observer is responsible for automatic
                        // playback, but it does not repeatedly seek.
                        // -------------------------------------------------

                        if (video.paused) {

                            video.play()
                                .catch(error => {

                                    console.warn(
                                        "⚠️ VIDEO AUTOPLAY BLOCKED:",
                                        error
                                    );

                                });

                        }

                        // -------------------------------------------------
                        // PRELOAD NEIGHBOURS
                        //
                        // Setting preload is enough.
                        // Do NOT call .load().
                        // -------------------------------------------------

                        const nextPage =
                            entry.target
                                .nextElementSibling;

                        if (nextPage) {

                            const nextVideo =
                                nextPage.querySelector(
                                    "video"
                                );

                            if (nextVideo) {
                                nextVideo.preload =
                                    "auto";
                            }

                        }

                        const previousPage =
                            entry.target
                                .previousElementSibling;

                        if (previousPage) {

                            const previousVideo =
                                previousPage.querySelector(
                                    "video"
                                );

                            if (previousVideo) {
                                previousVideo.preload =
                                    "auto";
                            }

                        }

                    }

                    // -------------------------------------------------
                    // INACTIVE VIDEO
                    // -------------------------------------------------

                    else {

                        video.pause();

                        // IMPORTANT:
                        // Do not reset currentTime here.
                    }

                });

            },
            {
                threshold: [0.75]
            }
        );

    container
        .querySelectorAll(
            ".profile-video-item"
        )
        .forEach(page => {

            observer.observe(page);

        });

    container._profileVideoObserver =
        observer;

    console.log(
        "✅ PROFILE VIDEO OBSERVER READY:",
        container.querySelectorAll(
            ".profile-video-item"
        ).length
    );

    return observer;
};

const mediaData = {

        history.state?.appScreen ||
        "profileScreen",

    sourceData:

        history.state?.data ||

        selectedPost.media_url ||
        "",

    type:
        "video"
};

// -----------------------------------------------------
    // HISTORY
// -----------------------------------------------------

    if (!alreadyOpen) {

        history.pushState(
            {
                appScreen: "mediaViewer",
                data: mediaData,
                scrollY: 0
            },
            "",
            location.href
        );

    } else {

        history.replaceState(
            {
                appScreen: "mediaViewer",
                data: mediaData,
                scrollY: 0
            },
            "",
            location.href
        );

    }

    // Keep navigation state synchronized.
    if (window.appNavigation) {

        window.appNavigation.current = {
            screen: "mediaViewer",
            data: mediaData,
            scrollY: 0,

        };

    try {

            "⚠️ hideTopBar() failed:",
            error
        );
    }

    try {
        lockBackground();
    } catch (error) {
        console.warn(
            "⚠️ lockBackground() failed:",
            error
        );
    }

    // -----------------------------------------------------
    // Clear existing viewer.
    // -----------------------------------------------------

    if (
        viewer._profileVideoObserver
    ) {

        try {
            viewer._profileVideoObserver
                .disconnect();
        } catch (error) {}

        viewer._profileVideoObserver = null;
    }

    viewer
        .querySelectorAll("video")
        .forEach(video => {

            try {
                video.pause();
            } catch (error) {}

        });

    viewer.innerHTML = "";

    // -----------------------------------------------------
    // Viewer styling
    // -----------------------------------------------------

    viewer.style.cssText = `
        position:fixed;
        inset:0;
        width:100vw;
        height:100vh;
        display:flex;
        visibility:visible;
        opacity:1;
        pointer-events:auto;
        background:#000;
        z-index:2147483647;
        overflow:hidden;
        transform:translateY(0);
    `;

    // -----------------------------------------------------
    // CLOSE BUTTON
    // -----------------------------------------------------

    const close =
        document.createElement("button");

    close.type = "button";
    close.className =
        "profile-video-close";

    close.textContent = "✕";

    close.style.cssText = `
        position:absolute;
        top:20px;
        left:20px;
        width:48px;
        height:48px;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:0;
        margin:0;
        border:0;
        background:transparent;
        color:#fff;
        font-size:34px;
        line-height:1;
        z-index:2147483647;
        cursor:pointer;
        pointer-events:auto;
    `;

    let closing = false;

    const closeViewer = () => {

        if (closing) return;

        closing = true;

        console.log(
            "🔙 CLOSE PROFILE VIDEO"
        );

        // Disconnect observer.
        const feed =
            viewer.querySelector(
                "#profileVideoFeed"
            );

        if (
            feed?._profileVideoObserver
        ) {

            try {
                feed._profileVideoObserver
                    .disconnect();
            } catch (error) {}

            feed._profileVideoObserver = null;

        }

        // Stop videos.
        viewer
            .querySelectorAll("video")
            .forEach(video => {

                try {
                    video.pause();
                    video.removeAttribute(
                        "src"
                    );
                    video.load();
                } catch (error) {}

            });

        viewer.innerHTML = "";

        viewer.style.display = "none";
        viewer.style.visibility = "hidden";
        viewer.style.opacity = "0";
        viewer.style.pointerEvents = "none";
        viewer.style.transform = "";
        viewer.style.transition = "";

        // Restore normal page scrolling.
        document.body.style.overflow = "";

console.log(
    "🎥 CLOSE VIDEO HISTORY CHECK:",
    {
        historyState: history.state,
        navigationCurrent:
            window.appNavigation?.current,
        navigationStack:
            window.appNavigation?.stack
    }
);

        // The history entry is the source of truth.
        if (
            history.state?.appScreen ===
            "mediaViewer"
        ) {

            history.back();

        } else {

            // Safety fallback.
            try {
                window.appNavigation.current =
                    null;
            } catch (error) {}

        }

    };

    close.addEventListener(
        "click",
        closeViewer
    );

    viewer.appendChild(close);

    // -----------------------------------------------------
    // VIDEO FEED
    // -----------------------------------------------------

    const feed =
        document.createElement("div");

    feed.id =
        "profileVideoFeed";

    feed.style.cssText = `
        width:100%;
        height:100%;
        overflow-y:auto;
        overflow-x:hidden;
        scroll-snap-type:y mandatory;
        scroll-behavior:smooth;
        -webkit-overflow-scrolling:touch;
        overscroll-behavior-y:contain;
        background:#000;
    `;

    viewer.appendChild(feed);

// -----------------------------------------------------
    // SWIPE DOWN TO CLOSE
// -----------------------------------------------------

    let startY = 0;
    let currentY = 0;
    let startX = 0;
    let currentX = 0;
    let dragging = false;
    let swipeDirection = null;

    feed.addEventListener(
        "touchstart",
        event => {

            if (!event.touches?.length) {
                return;
            }

            startY = event.touches[0].clientY;
            currentY = startY;

            startX = event.touches[0].clientX;
            currentX = startX;

            dragging = true;
            swipeDirection = null;

        },
        { passive: true }
    );

    feed.addEventListener(
        "touchmove",
        event => {

            if (
                !dragging ||
                !event.touches?.length
            ) {
                return;
            }

            currentY = event.touches[0].clientY;
            currentX = event.touches[0].clientX;

            const diffY = currentY - startY;
            const diffX = currentX - startX;

            /*
             * Wait until the gesture has a clear direction.
             * This prevents tiny movements from triggering
             * the close animation.
             */
            if (!swipeDirection) {

                if (
                    Math.abs(diffY) < 12 &&
                    Math.abs(diffX) < 12
                ) {
                    return;
                }

                swipeDirection =
                    Math.abs(diffY) > Math.abs(diffX)
                        ? "vertical"
                        : "horizontal";
            }

            /*
             * Only downward vertical movement can
             * become a close gesture.
             */
            if (
                swipeDirection !== "vertical" ||
                diffY <= 0
            ) {
                return;
            }

            viewer.style.transition = "";

            viewer.style.transform =
                `translateY(${diffY}px)`;

            viewer.style.opacity =
                String(
                    1 -
                    Math.min(
                        diffY / 400,
                        0.8
                    )
                );

        },
        { passive: true }
    );

    feed.addEventListener(
        "touchend",
        () => {

            if (!dragging) {
                return;
            }

            dragging = false;

            const diffY =
                currentY - startY;

            /*
             * Close only for a deliberate
             * downward vertical swipe.
             */
            if (
                swipeDirection === "vertical" &&
                diffY > 150
            ) {
                closeViewer();
                return;
            }

            /*
             * Otherwise return the viewer
             * to its normal position.
             */
            viewer.style.transition =
                "transform .25s ease, opacity .25s ease";

            viewer.style.transform =
                "translateY(0)";

            viewer.style.opacity =
                "1";

            setTimeout(() => {

                viewer.style.transition = "";

            }, 250);

        }
    );

    // CREATE PAGES
// -----------------------------------------------------

    feed.innerHTML = "";

    videos.forEach(
        (post, videoIndex) => {

            try {

                const page =
                    createVideoPage(
                        post,
                        videoIndex

            } catch (error) {

                console.error(
                    "❌ VIDEO PAGE CREATION FAILED:",
                    videoIndex,
                    error
                );

            }

        }
    );

    if (!feed.children.length) {

        console.error(
            "❌ NO PROFILE VIDEO PAGES CREATED"
        );

        return;
    }

    // -----------------------------------------------------
    // OBSERVER
    // -----------------------------------------------------

    observeProfileVideos(feed);

    // -----------------------------------------------------
    // Position selected video.
    //
    // No play()
    // No load()
    // No currentTime reset
    // -----------------------------------------------------

    requestAnimationFrame(() => {

        const currentPage =
            feed.querySelector(
                `[data-index="${index}"]`
            );

        if (!currentPage) {

            console.warn(
                "⚠️ PROFILE VIDEO PAGE NOT FOUND:",
                index
            );

            return;
        }

        currentPage.scrollIntoView({
            behavior: "auto",
            block: "start"
        });

        console.log(
            "🎥 POSITIONED PROFILE VIDEO:",
            index
        );

    });

};

        const {
            data: posts,
            error: postsError
        } = await supabase
            .from("posts")
            .select("*")
            .eq("user_id", userId)
            .eq("media_type", "video")
            .order("created_at", {
                ascending: false
            });

        if (postsError) {
            throw postsError;
        }

        if (
            !Array.isArray(posts) ||
            posts.length === 0
        ) {

            console.log(
                "🎥 NO PROFILE VIDEOS"
            );

            container.innerHTML = `
                <div style="
                    padding:30px 20px;
                    text-align:center;
                    color:#888;
                ">
                    No videos yet
                </div>
            `;

            return;
        }

        // =================================================
        // GET CURRENT PROFILE DATA
        // =================================================

        const {
            data: profile,
            error: profileError
        } = await supabase
            .from("profiles")
            .select(`
                id,
                name,
                username,
                avatar_url,
                verified
            `)
            .eq("id", userId)
            .maybeSingle();

        if (profileError) {

            console.warn(
                "⚠️ VIDEO PROFILE ERROR:",
                profileError
            );

        }

        // =================================================
        // ATTACH PROFILE DATA
        // =================================================

        posts.forEach(post => {

            post.profiles =
                profile || null;

            post.name =
                profile?.name ||
                "User";

            post.username =
                profile?.username ||
                "";

            post.avatar_url =
                profile?.avatar_url ||
                "";

            post.verified =
                profile?.verified === true;

            post.file_url =
                typeof post.file_url === "string"
                    ? post.file_url.trim()
                    : "";

        });

        // =================================================
        // REMOVE INVALID VIDEO RECORDS
        // =================================================

        const validVideos =
            posts.filter(post => {

                if (!post.file_url) {

                    console.warn(
                        "⚠️ PROFILE VIDEO HAS NO FILE URL:",
                        post.id
                    );

                    return false;
                }

                return true;

            });

        if (!validVideos.length) {

            container.innerHTML = `
                <div style="
                    padding:30px 20px;
                    text-align:center;
                    color:#888;
                ">
                    No videos yet
                </div>
            `;

            return;
        }

        // =================================================
        // SAVE PROFILE VIDEOS
        // =================================================

        window.profileVideos =
            validVideos;

        window.profileVideoIndex = 0;

        console.log(
            "🎥 PROFILE VIDEOS LOADED:",
            validVideos.map(post => ({
                id: post.id,
                media_type: post.media_type,
                file_url: post.file_url
            }))
        );

        // =================================================
        // RENDER GRID
        // =================================================

        container.replaceChildren();

        const grid =
            document.createElement("div");

        grid.style.cssText = `
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:4px;
            width:100%;
        `;

        validVideos.forEach(
            (post, index) => {

                const tile =
                    document.createElement("div");

                tile.style.cssText = `
                    position:relative;
                    aspect-ratio:1;
                    overflow:hidden;
                    border-radius:8px;
                    cursor:pointer;
                    background:#111;
                `;

                // -----------------------------------------
                // VIDEO THUMBNAIL
                // -----------------------------------------

                const video =
                    document.createElement("video");

                video.src =
                    post.file_url;

                video.muted = true;
                video.playsInline = true;
                video.preload = "metadata";

                video.setAttribute(
                    "playsinline",
                    ""
                );

                video.setAttribute(
                    "webkit-playsinline",
                    ""
                );

                video.style.cssText = `
                    width:100%;
                    height:100%;
                    object-fit:cover;
                    display:block;
                    pointer-events:none;
                    background:#111;
                `;

                video.addEventListener(
                    "error",
                    () => {

                        console.warn(
                            "⚠️ VIDEO THUMBNAIL FAILED:",
                            {
                                id: post.id,
                                url: post.file_url
                            }
                        );

                    }
                );

                tile.appendChild(video);

                // -----------------------------------------
                // PLAY ICON
                // -----------------------------------------

                const playIcon =
                    document.createElement("div");

                playIcon.textContent = "▶";

                playIcon.style.cssText = `
                    position:absolute;
                    top:50%;
                    left:50%;
                    transform:translate(-50%,-50%);
                    width:46px;
                    height:46px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:white;
                    font-size:24px;
                    text-shadow:0 0 10px black;
                    pointer-events:none;
                `;

                tile.appendChild(playIcon);

                // -----------------------------------------
                // OPEN FULL VIDEO
                // -----------------------------------------

                tile.addEventListener(
                    "click",
                    event => {

                        event.preventDefault();
                        event.stopPropagation();

                        console.log(
                            "🎥 PROFILE VIDEO CLICK:",
                            {
                                index,
                                id: post.id
                            }
                        );

                        if (
                            typeof window.openProfileVideoViewer !==
                            "function"
                        ) {

                            console.error(
                                "❌ openProfileVideoViewer() NOT FOUND"
                            );

                            return;
                        }

                        window.openProfileVideoViewer(
                            index
                        );

                    }
                );

                grid.appendChild(tile);

            }
        );

        container.appendChild(grid);

        console.log(
            "✅ PROFILE VIDEO GRID RENDERED:",
            validVideos.length
        );

    } catch (error) {

        console.error(
            "❌ PROFILE VIDEOS ERROR:",
            error
        );

        window.profileVideos = [];
        window.profileVideoIndex = 0;

        container.innerHTML = `
            <div style="
                padding:30px 20px;
                text-align:center;
                color:#f88;
            ">
                Error loading videos
            </div>
        `;
    }
};

window.openProfileVideoViewer = function (index) {

    index = Number(index);

    if (
        !Array.isArray(
            window.profileVideos
        ) ||
        !window.profileVideos.length
    ) {

        console.warn(
            "⚠️ PROFILE VIDEOS NOT LOADED"
        );

        return;
    }

    if (
        !Number.isInteger(index) ||
        index < 0 ||
        index >= window.profileVideos.length
    ) {

        console.warn(
            "⚠️ INVALID PROFILE VIDEO INDEX:",
            index
        );

        return;
    }

    const post =
        window.profileVideos[index];

    if (!post) {
        console.warn(
            "⚠️ PROFILE VIDEO NOT FOUND:",
            index
        );
        return;
    }

    window.profileVideoIndex =
        index;

    console.log(
        "🎥 OPEN PROFILE VIDEO VIEWER:",
        {
            index,
            postId: post.id
        }
    );

    if (
        typeof window.openProfileVideo !==
        "function"
    ) {

        console.error(
            "❌ openProfileVideo() NOT FOUND"
        );

        return;
    }

    window.openProfileVideo(index);
};

                        .split(".")
                        .pop()
                        .toLowerCase();

                const avatarPath =
                    `avatars/${currentUserId}_${Date.now()}.${extension}`;

                const {
                    error: avatarUploadError
                } =
                    await supabase
                    .storage
                    .from("avatars")
                    .upload(
                        avatarPath,
                        avatarFile,
                        {
                            upsert: true
                        }
                    );

                if (
                    avatarUploadError
                ) {

                    console.error(
                        "❌ AVATAR UPLOAD ERROR:",
                        avatarUploadError
                    );

                    alert(
                        "Failed to upload profile photo:\n\n" +
                        avatarUploadError.message
                    );

                    return;
                }

                const {
                    data: avatarPublic
                } =
                    supabase
                    .storage
                    .from("avatars")
                    .getPublicUrl(
                        avatarPath
                    );

                avatarUrl =
                    avatarPublic?.publicUrl ||
                    avatarUrl;

                changes.push(
                    "avatar"
                );
            }

            // -----------------------------------------
            // UPLOAD COVER
            // -----------------------------------------

            let coverUrl =
                profile.cover_url ||
                null;

            const coverFile =
                coverInput?.files?.[0] ||
                null;

            if (coverFile) {

                const extension =
                    coverFile.name
                        .split(".")
                        .pop()
                        .toLowerCase();

                const coverPath =
                    `covers/${currentUserId}_${Date.now()}.${extension}`;

                const {
                    error: coverUploadError
                } =
                    await supabase
                    .storage
                    .from("avatars")
                    .upload(
                        coverPath,
                        coverFile,
                        {
                            upsert: true
                        }
                    );

                if (
                    coverUploadError
                ) {

                    console.error(
                        "❌ COVER UPLOAD ERROR:",
                        coverUploadError
                    );

                    alert(
                        "Failed to upload cover photo:\n\n" +
                        coverUploadError.message
                    );

                    return;
                }

                const {
                    data: coverPublic
                } =
                    supabase
                    .storage
                    .from("avatars")
                    .getPublicUrl(
                        coverPath
                    );

                coverUrl =
                    coverPublic?.publicUrl ||
                    coverUrl;

                changes.push(
                    "cover"
                );
            }

            // -----------------------------------------
            // UPDATE PROFILE
            // -----------------------------------------

            const {
                error: updateError
            } =
                await supabase
                .from("profiles")
                .update({

                    name:
                        name || null,

                    username:
                        username || null,

                    website:
                        website || null,

                    location:
                        location || null,

                    bio:
                        bio || null,

                    avatar_url:
                        avatarUrl,

                    cover_url:
                        coverUrl

                })
                .eq(
                    "id",
                    currentUserId
                );

            if (updateError) {

                console.error(
                    "❌ PROFILE UPDATE ERROR:",
                    updateError
                );

                alert(
                    "Failed to save profile:\n\n" +
                    updateError.message
                );

                return;
            }

            // -----------------------------------------
            // NOTIFY FOLLOWERS
            // -----------------------------------------

            if (changes.length > 0) {

                const {
                    data: followers
                } =
                    await supabase
                    .from("follows")
                    .select(
                        "follower_id"
                    )
                    .eq(
                        "following_id",
                        currentUserId
                    );

                const {
                    data: following
                } =
                    await supabase
                    .from("follows")
                    .select(
                        "following_id"
                    )
                    .eq(
                        "follower_id",
                        currentUserId
                    );

                const recipientIds =
                    new Set();

                (followers || [])
                    .forEach(row => {

                        if (
                            row.follower_id !==
                            currentUserId
                        ) {

                            recipientIds.add(
                                row.follower_id
                            );
                        }
                    });

                (following || [])
                    .forEach(row => {

                        if (
                            row.following_id !==
                            currentUserId
                        ) {

                            recipientIds.add(
                                row.following_id
                            );
                        }
                    });

                const notificationTime =
                    new Date().toISOString();

                const notificationRows =
                    Array.from(
                        recipientIds
                    ).map(
                        recipientId => ({

                            user_id:
                                recipientId,

                            sender_id:
                                currentUserId,

                            username:
                                name ||
                                "User",

                            avatar_url:
                                avatarUrl,

                            type:
                                "profile_update",

                            message:
                                "updated their profile",

                            read:
                                false,

                            created_at:
                                notificationTime,

                            last_time:
                                notificationTime
                        })
                    );

                if (
                    notificationRows.length
                ) {

                    const {
                        error:
                            notificationError
                    } =
                        await supabase
                        .from(
                            "notifications"
                        )
                        .insert(
                            notificationRows
                        );

                    if (
                        notificationError
                    ) {

                        console.error(
                            "⚠️ PROFILE NOTIFICATION ERROR:",
                            notificationError
                        );
                    }
                }
            }

            // -----------------------------------------
            // REFRESH MAIN FEED
            // -----------------------------------------

            if (
                typeof window.loadPosts ===
                "function"
            ) {

                try {
                    await window.loadPosts();
                } catch (error) {

                    console.warn(
                        "⚠️ FEED REFRESH ERROR:",
                        error
                    );
                }
            }

            // -----------------------------------------
            // REMEMBER PROFILE TAB
            // -----------------------------------------

            const profileTab =
                window.currentProfileTab ||
                "posts";

            // -----------------------------------------
            // REMOVE EDIT SCREEN
            // -----------------------------------------

            screen.style.display =
                "none";

            // -----------------------------------------
            // RETURN TO EXISTING SETTINGS
            // -----------------------------------------

            if (
                history.state?.appScreen ===
                "editProfileScreen"
            ) {

                history.back();

                return;
            }

            // -----------------------------------------
            // FALLBACK
            // -----------------------------------------

            await window.openProfile(
                currentUserId,
                name,
                {
                    returnSource: "home",
                    tab: profileTab
                }
            );

        } catch (error) {

            console.error(
                "❌ SAVE PROFILE ERROR:",
                error
            );

            alert(
                "Failed to save profile:\n\n" +
                (
                    error?.message ||
                    String(error)
                )
            );

        } finally {

            saving = false;

            saveButtons.forEach(button => {

                if (!button) return;

                button.disabled = false;

                button.style.opacity = "1";
            });

            const top =
                document.getElementById(
                    "editProfileSaveTop"
                );

            const bottom =
                document.getElementById(
                    "editProfileSaveBottom"
                );

            if (top) {
                top.innerText = "Save";
            }

            if (bottom) {
                bottom.innerText =
                    "Save Changes";
            }
        }
    };

    // =================================================
    // BACK
    // =================================================

    const goBack = function () {

        console.log(
            "🔙 EDIT PROFILE → SETTINGS"
        );

        if (
            history.state?.appScreen ===
            "editProfileScreen"
        ) {

            history.back();

            return;
        }

        window.backToProfileSettings();
    };

    document
        .getElementById(
            "editProfileBackButton"
        )
        ?.addEventListener(
            "click",
            goBack
        );

    document
        .getElementById(
            "editProfileDiscard"
        )
        ?.addEventListener(
            "click",
            goBack
        );

    // =================================================
    // SAVE BUTTONS
    // =================================================

    document
        .getElementById(
            "editProfileSaveTop"
        )
        ?.addEventListener(
            "click",
            saveProfile
        );

    document
        .getElementById(
            "editProfileSaveBottom"
        )
        ?.addEventListener(
            "click",
            saveProfile
        );

    console.log(
        "✅ EDIT PROFILE OPENED"
    );
};
