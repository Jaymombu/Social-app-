window.loadNestedReplyButton = async function(parentId) {

    if (!parentId) {
        return;
    }

    const exactParentId =
        String(parentId);

    console.log(
        "🔘 CHECK NESTED REPLIES:",
        exactParentId
    );


    // =====================================================
    // FIND PARENT COMMENT
    // =====================================================

    const parentCard =
        document.getElementById(
            "comment-" + exactParentId
        );

    if (!parentCard) {

        console.warn(
            "⚠️ Parent comment not in DOM:",
            exactParentId
        );

        return;
    }


    // =====================================================
    // FIND OR CREATE REPLIES CONTAINER
    // =====================================================

    let repliesContainer =
        document.getElementById(
            "replies-" + exactParentId
        );


    if (!repliesContainer) {

        repliesContainer =
            document.createElement("div");

        repliesContainer.id =
            "replies-" + exactParentId;

        repliesContainer.className =
            "nestedReplies";

repliesContainer.style.cssText = `
    display:none;
    width:100%;
    max-width:100%;
    margin:3px 0 0 0;
    padding-left:12px;
    box-sizing:border-box;
    border-left:1px solid #292929;
`;

        /*
         * Replies are placed AFTER the
         * comment card.
         */

        parentCard.parentNode.insertBefore(
            repliesContainer,
            parentCard.nextSibling
        );

    }

// =====================================================
    // GET REPLY COUNT
// =====================================================

    const {
        count,
        error
    } = await supabase
        .from("comments")
        .select("id", {
            count: "exact",
            head: true
        })
        .eq(
            "parent_id",
            exactParentId
        )
        .eq(
            "hidden",
            false
        );

// =====================================================
    // HANDLE QUERY ERROR
// =====================================================

    if (error) {

        console.error(
            "❌ loadNestedReplyButton error:",
            error
        );

        return;
    }

    const replyCount =
        Number(count || 0);

    console.log(
        "🔘 REPLY COUNT:",
        exactParentId,
        replyCount
    );

// =====================================================
    // FIND EXISTING BUTTON
// =====================================================

    let button =
        document.getElementById(
            "threadBtn-" + exactParentId
        );

// =====================================================
    // NO REPLIES
// =====================================================

    if (replyCount === 0) {

        if (button) {

            button.style.display =
                "none";

        }

        return;
    }

// =====================================================
    // CREATE BUTTON IF MISSING
// =====================================================

    if (!button) {

        button =
            document.createElement("button");

        button.id =
            "threadBtn-" + exactParentId;

        button.type =
            "button";

button.style.cssText = `
    display:block;
    border:0;
    background:none;
    color:#8e8e8e;
    font-size:12px;
    padding:5px 0;
    margin-left:42px;
    margin-top:2px;
    margin-bottom:3px;
    cursor:pointer;
    text-align:left;
`;

        button.onclick =
            async function(event) {

                event.preventDefault();
                event.stopPropagation();

                if (
                    typeof window.toggleReplies !==
                    "function"
                ) {

                    console.error(
                        "❌ toggleReplies() is unavailable"
                    );

                    return;
                }

                await window.toggleReplies(
                    exactParentId
                );

            };


        /*
         * IMPORTANT:
         *
         * Put the button completely AFTER
         * the comment card.
         */

        parentCard.parentNode.insertBefore(
            button,
            repliesContainer
        );

    }


    // =====================================================
    // IF BUTTON EXISTS BUT IS INSIDE CARD,
    // MOVE IT OUTSIDE
    // =====================================================

    if (
        button.parentElement === parentCard ||
        !button.parentElement
    ) {

        parentCard.parentNode.insertBefore(
            button,

async function insertComment(commentId) {

    const {
        data: { session }
    } = await supabase.auth.getSession();

    const myId =
        session?.user?.id || null;

    const {
        data: comment,
        error
    } = await supabase
        .from("comments")
        .select(`
            *,
            comment_user:profiles!comments_user_id_fkey(
                id,
                name,
                avatar_url,
                verified
            ),
            reply_to_user:profiles!comments_reply_to_user_id_fkey(
                id,
                name
            ),
            comment_likes(
                user_id
            ),
            comment_reactions(
                user_id,
                emoji
            ),
            comment_reads(
                user_id
            )
        `)
        .eq("id", commentId)
        .maybeSingle();

    if (error || !comment) {
    return;
    }


    // =====================================================
    // ALREADY RENDERED
    // =====================================================

    if (
        document.getElementById(
            `comment-${comment.id}`
        )
    ) {
        return;
    }


    // =====================================================
    // TOP LEVEL COMMENT
    // =====================================================

    if (!comment.parent_id) {

        const container =
            document.getElementById(
                "panelComments"
            );

        if (!container) return;

        container.insertAdjacentHTML(
            "afterbegin",
            renderComment(
                comment,
                myId
            )
        );

        await loadNestedReplyButton(
            comment.id
        );

        return;
    }


    // =====================================================
    // REPLY
    // =====================================================

    let parentReplies =
        document.getElementById(
            `replies-${comment.parent_id}`
        );


    // =====================================================
    // PARENT CARD
    // =====================================================

    let parentCard =
        document.getElementById(
            `comment-${comment.parent_id}`
        );


    /*
     * If parent is not loaded, do NOT simply discard
     * the realtime reply.
     *
     * Load the parent through ensureCommentInDOM().
     */

    if (!parentCard) {
        
        parentCard =
            await window.ensureCommentInDOM(
                comment.parent_id
            );

    }


    if (!parentCard) {
        
        return;
    }


    // =====================================================
    // CREATE REPLIES CONTAINER
    // =====================================================

    if (!parentReplies) {

        parentReplies =
            document.createElement(
                "div"
            );

        parentReplies.id =
            `replies-${comment.parent_id}`;

        parentReplies.className =
            "nestedReplies";

        parentReplies.style.cssText = `
            display:block;
            margin-left:8px;
            margin-top:3px;
            border-left:1px solid #292929;
            padding-left:8px;
        `;

        parentCard.appendChild(
            parentReplies
        );

    }


    // =====================================================
    // INSERT REPLY
    // =====================================================

    if (
        !document.getElementById(
            `comment-${comment.id}`
        )
    ) {

        parentReplies.insertAdjacentHTML(
            "beforeend",
            renderReply(comment)
        );

    }


    parentReplies.style.display =
        "block";


    // =====================================================
    // EXPANDED STATE
    // =====================================================

    window.expandedReplies =
        window.expandedReplies ||
        new Set();

    window.expandedReplies.add(
        comment.parent_id
    );


    // =====================================================
    // UPDATE THREAD BUTTON
    // =====================================================

    const threadButton =
        document.getElementById(
            `threadBtn-${comment.parent_id}`
        );

    if (threadButton) {

        threadButton.style.display =
            "block";

        threadButton.textContent =
            "Hide replies";

    }


    // =====================================================
    // MARK READ
    // =====================================================

    if (
        myId &&
        !comment.comment_reads?.some(
            read =>
                read.user_id === myId
        )
    ) {

        await supabase
            .from("comment_reads")
            .upsert(
                {
                    comment_id:
                        comment.id,

                    user_id:
                        myId
                },
                {
                    onConflict:
                        "comment_id,user_id"
                }
            );

    }


    // =====================================================
    // UPDATE REPLY BUTTON
    // =====================================================

    await loadNestedReplyButton(
        comment.parent_id
    );

}

window.updateReplyCount = async function(parentId) {

    if (!parentId) return;

    const {
        count,
        error
    } = await supabase
        .from("comments")
        .select("id", {
            count: "exact",
            head: true
        })
        .eq("parent_id", parentId)
        .eq("hidden", false);

    if (error) {

        console.error(
            "updateReplyCount error:",
            error
        );

        return;
    }

    const replyCount =
        Number(count) || 0;

    const button =
        document.getElementById(
            "threadBtn-" + parentId
        );


    // ==========================================
    // NO REPLIES
    // ==========================================

    if (replyCount === 0) {

        if (button) {

            button.style.display =
                "none";

            button.textContent =
                "View replies";
        }

        /*
         * IMPORTANT:
         *
         * DO NOT DO THIS:
         *
         * replies.innerHTML = "";
         *
         * The realtime DELETE handler already
         * removes the deleted reply.
         *
         * Clearing the container can wipe the
         * entire visible reply tree.
         */

        if (
            window.expandedReplies instanceof Set
        ) {

            window.expandedReplies.delete(
                parentId
            );

        }

        return;
    }


    // ==========================================
    // REPLIES STILL EXIST
    // ==========================================

    if (!button) {
        return;
    }

    button.style.display =
        "block";


    const isOpen =
        window.expandedReplies instanceof Set &&
        window.expandedReplies.has(parentId);


    button.textContent =
        isOpen
            ? "Hide replies"
            : `View ${replyCount} ${
                replyCount === 1
                    ? "reply"
                    : "replies"
            }`;
};

function shouldShowTranslate(languageCode) {

    if (!languageCode) return false;

    const userLang =
        (navigator.language || "en")
        .split("-")[0]
        .toLowerCase();

    return (
        languageCode !== "unknown" &&
        languageCode !== userLang
    );
}

async function detectLanguage(text) {

    try {

        const response = await fetch(
            "https://translate.argosopentech.com/detect",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    q: text
                })
            }
        );

        if (!response.ok) throw new Error("Detection failed");

        const result = await response.json();

        if (Array.isArray(result) && result.length) {
            return result[0].language || "unknown";
        }

    } catch (err) {

        console.error("Language detection:", err);

    }

    return "unknown";
}

async function translateText(text, source, target) {

    try {

        const response = await fetch(
            "https://translate.argosopentech.com/translate",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    q: text,
                    source: source,
                    target: target,
                    format: "text"
                })
            }
        );

        if (!response.ok) throw new Error("Translation failed");

        const result = await response.json();

        return result.translatedText || null;

    } catch (err) {

        console.error(err);

        return null;

    }

}

window.likeComment = async function(commentId) {

    if (!commentId) return;

    const button =
        document.getElementById("commentLike-" + commentId);

    const count =
        document.getElementById("commentLikeCount-" + commentId);

    /*
     * -----------------------------------------
     * GET SESSION
     * -----------------------------------------
     */

    const {
        data: { session },
        error: sessionError
    } = await supabase.auth.getSession();

    if (sessionError) {

        commentDebug(
            "❌ SESSION ERROR",
            sessionError
        );

        return;
    }

    /*
     * Logged-out users can SEE likes,
     * but cannot CREATE them.
     */

    if (!session) {

        commentDebug(
            "ℹ️ LOGIN REQUIRED",
            {
                message: "You must be logged in to like a comment."
            }
        );

        return;
    }

    const userId = session.user.id;

    /*
     * -----------------------------------------
     * PREVENT DOUBLE TAP / RAPID REQUESTS
     * -----------------------------------------
     */

    if (button?.dataset.liking === "true") {
        return;
    }

    if (button) {
        button.dataset.liking = "true";
    }

    /*
     * -----------------------------------------
     * CHECK EXISTING LIKE
     * -----------------------------------------
     */

    const {
        data: existing,
        error: existingError
    } = await supabase
        .from("comment_likes")
        .select("id")
        .eq("comment_id", commentId)
        .eq("user_id", userId)
        .maybeSingle();

    if (existingError) {

        commentDebug(
            "❌ CHECK LIKE FAILED",
            existingError
        );

        if (button) {
            button.dataset.liking = "false";
        }

        return;
    }

    /*
     * =========================================
     * UNLIKE
     * =========================================
     */

    if (existing) {

        /*
         * Optimistic UI update
         */

        if (button) {
            button.style.background = "#232323";
        }

        if (count) {

            count.textContent = Math.max(
                0,
                Number(count.textContent || 0) - 1
            );
        }

        /*
         * Delete from database
         */

        const {
            error: deleteError
        } = await supabase
            .from("comment_likes")
            .delete()
            .eq("id", existing.id);

        if (deleteError) {

            /*
             * Roll UI back if database failed
             */

            if (button) {
                button.style.background = "#ff3040";
            }

            if (count) {
                count.textContent =
                    Number(count.textContent || 0) + 1;
            }

            commentDebug(
                "❌ UNLIKE FAILED",
                deleteError
            );

            if (button) {
                button.dataset.liking = "false";
            }

            return;
        }

        /*
         * Update comments.likes_count
         */

        const {
            error: rpcError
        } = await supabase.rpc(
            "decrement_comment_likes",
            {
                comment_id_input: commentId
            }
        );

        if (rpcError) {

            console.error(
                "decrement_comment_likes:",
                rpcError
            );
        }

        if (button) {
            button.dataset.liking = "false";
        }

        return;
    }

    /*
     * =========================================
     * LIKE
     * =========================================
     */

    /*
     * Optimistic UI update FIRST
     */

    if (button) {
        button.style.background = "#ff3040";
    }

    if (count) {

        count.textContent =
            Number(count.textContent || 0) + 1;
    }

    /*
     * Insert into database
     */

    const {
        data: insertedLike,
        error: insertError
    } = await supabase
        .from("comment_likes")
        .insert({
            comment_id: commentId,
            user_id: userId
        })
        .select()
        .single();

    if (insertError) {

        /*
         * Roll UI back
         */

        if (button) {
            button.style.background = "#232323";
        }

        if (count) {

            count.textContent = Math.max(
                0,
                Number(count.textContent || 0) - 1
            );
        }

        commentDebug(
            "❌ LIKE INSERT FAILED",
            {
                message: insertError.message,
                details: insertError.details,
                hint: insertError.hint,
                code: insertError.code
            }
        );

        if (button) {
            button.dataset.liking = "false";
        }

        return;
    }

    /*
     * -----------------------------------------
     * UPDATE STORED COMMENT COUNT
     * -----------------------------------------
     */

    const {
        error: rpcError
    } = await supabase.rpc(
        "increment_comment_likes",
        {
            comment_id_input: commentId
        }
    );

    if (rpcError) {

        console.error(
            "increment_comment_likes:",
            rpcError
        );
    }

    /*
     * -----------------------------------------
     * DONE
     * -----------------------------------------
     */

    if (button) {
        button.dataset.liking = "false";
    }

    console.log(
        "❤️ Comment liked:",
        commentId,
        insertedLike
    );
};

        commentPressTimer = null;

    const exactId = String(commentId);

    if (
        !exactId ||
        exactId === "undefined" ||
        exactId === "null"
    ) {

    commentPressTarget =
        event.currentTarget ||
        event.target.closest(".commentCard");

    commentPressTimer = setTimeout(() => {

        // Make sure this is EXACTLY the selected card
        if (
            commentPressTarget.id !==
            "comment-" + exactId
        ) {
            commentPressTimer = null;
            return;
        }

        openCommentMenu(
            exactId,
            String(userId || "")
        );

        commentPressTimer = null;

    }, 800);
}

let commentSwipeStartX = 0;
let commentSwipeStartY = 0;
let commentSwipeTarget = null;
let commentSwipeActive = false;

function commentSwipeStart(e, commentId, name, userId) {

    if (!e.touches || !e.touches.length) {
        return;
    }

    const touch = e.touches[0];

    commentSwipeStartX = touch.clientX;
    commentSwipeStartY = touch.clientY;

    commentSwipeTarget = {
        commentId: String(commentId),
        name: String(name || "User"),
        userId: String(userId || "")
    };

    commentSwipeActive = false;
}


function commentSwipeMove(e) {

    if (
        !commentSwipeTarget ||
        !e.touches ||
        !e.touches.length
    ) {
        return;
    }

    const touch = e.touches[0];

    const diffX =
        touch.clientX - commentSwipeStartX;

    const diffY =
        touch.clientY - commentSwipeStartY;

    // Ignore normal vertical scrolling
    if (Math.abs(diffY) > Math.abs(diffX)) {
        return;
    }

    // Only allow right swipe
    if (diffX <= 0) {
        return;
    }

    /*
     * USER HAS STARTED SWIPING
     * Cancel long-press menu timer
     */
    if (typeof commentPressTimer !== "undefined") {
        clearTimeout(commentPressTimer);
        commentPressTimer = null;
    }

    const card = document.getElementById(
        "comment-" + commentSwipeTarget.commentId
    );

    if (!card) {
        return;
    }

    commentSwipeActive = true;

    e.preventDefault();

    const distance = Math.min(diffX, 80);

    card.style.transform =
        `translateX(${distance}px)`;
}


function commentSwipeEnd(e) {

    if (!commentSwipeTarget) {
        return;
    }

    const target = {
        commentId: commentSwipeTarget.commentId,
        name: commentSwipeTarget.name,
        userId: commentSwipeTarget.userId
    };

    const card = document.getElementById(
        "comment-" + target.commentId
    );

    let moved = 0;

    if (card) {

        const transform =
            card.style.transform || "";

        const match =
            transform.match(
                /translateX\(([-\d.]+)px\)/
            );

        if (match) {
            moved = parseFloat(match[1]) || 0;
        }

        card.style.transform = "";
    }

    commentSwipeTarget = null;
    commentSwipeActive = false;

    if (moved >= 60) {

        console.log(
            "🎯 SWIPE REPLY EXACT COMMENT:",
            target.commentId
        );

        replyToComment(
            target.commentId,
            target.name,
            target.userId
        );
    }
}

async function deleteComment(commentId) {

    closeCommentMenu();

    const exactId = String(commentId);

    if (
        !exactId ||
        exactId === "undefined" ||
        exactId === "null"
    ) {
        return;
    }

    const ok = confirm("Delete this comment?");

    if (!ok) return;

    // ==========================================
    // GET EXACT COMMENT
    // ==========================================

    const {
        data: comment,
        error: findError
    } = await supabase
        .from("comments")
        .select(`
            id,
            parent_id,
            user_id,
            hidden
        `)
        .eq("id", exactId)
        .maybeSingle();

    if (findError) {

        console.error(
            "❌ Could not find comment:",
            findError
        );

        return;
    }

    if (!comment) {

        console.error(
            "❌ Comment does not exist:",
            exactId
        );

        return;
    }

    console.log(
        "🗑️ DELETING EXACT COMMENT:",
        {
            id: comment.id,
            parent_id: comment.parent_id,
            user_id: comment.user_id
        }
    );

    // ==========================================
    // SOFT DELETE
    // ==========================================

    const {
        data: updatedComment,
        error: updateError
    } = await supabase
        .from("comments")
        .update({
            hidden: true
        })
        .eq("id", exactId)
        .select(`
            id,
            parent_id,
            hidden
        `)
        .maybeSingle();

    if (updateError) {

        console.error(
            "❌ DELETE FAILED:",
            updateError
        );

        alert("Could not delete comment.");

        return;
    }

    if (!updatedComment) {

        console.error(
            "❌ Nothing was updated for:",
            exactId
        );

        return;
    }

    console.log(
        "✅ ONLY THIS COMMENT WAS HIDDEN:",
        updatedComment
    );

    // ==========================================
    // REMOVE ONLY SELECTED DOM NODE
    // ==========================================

    const element =
        document.getElementById(
            "comment-" + exactId
        );

    if (element) {

        element.style.transition =
            "opacity .25s ease, transform .25s ease";

        element.style.opacity = "0";

        element.style.transform =
            "translateX(-20px)";

        setTimeout(() => {

            /*
             * IMPORTANT:
             *
             * We remove ONLY this comment element.
             *
             * We DO NOT remove:
             *
             * replies-${exactId}
             *
             * because child replies must survive.
             */

            element.remove();

        }, 250);
    }

    // ==========================================
    // UPDATE PARENT REPLY COUNT
    // ==========================================

    if (comment.parent_id) {

        await updateReplyCount(
            comment.parent_id
        );

    }

}

function formatCommentTime(date) {

    const seconds = Math.floor(
        (Date.now() - new Date(date).getTime()) / 1000
    );

    if (seconds < 60) return "now";

    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + "m";

    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + "h";

    const days = Math.floor(hours / 24);
    if (days < 7) return days + "d";

    const weeks = Math.floor(days / 7);
    if (weeks < 4) return weeks + "w";

    const months = Math.floor(days / 30);
    if (months < 12) return months + "mo";

    return Math.floor(days / 365) + "y";
}

window.commentMediaRecorder = null;

// =====================================================
// GET AUTHORITATIVE VOICE PLAYBACK DURATION
// SINGLE SOURCE OF TRUTH
// =====================================================

window.getAuthoritativeVoiceDuration = function (id) {

    const audio =
        document.getElementById(
            "voiceAudio-" + id
        );

    const player =
        document.getElementById(
            "commentVoice-" + id
        );


    if (!audio) {
        return 0;
    }


    // =================================================
    // DATABASE DURATION
    // =================================================

    const playerDuration =
        player
            ? Number(
                player.dataset.voiceDuration
            )
            : 0;


    const databaseDuration =
        Number(
            audio.dataset.databaseDuration
        );


    // =================================================
    // VALIDATE DATABASE VALUES
    // =================================================

    if (
        Number.isFinite(playerDuration) &&
        playerDuration > 0
    ) {

        return playerDuration;

    }


    if (
        Number.isFinite(databaseDuration) &&
        databaseDuration > 0
    ) {

        return databaseDuration;

    }


    // =================================================
    // BROWSER DURATION
    // FALLBACK ONLY
    // =================================================

    const browserDuration =
        Number(audio.duration);


    if (
        Number.isFinite(browserDuration) &&
        browserDuration > 0 &&
        browserDuration !== Infinity
    ) {

        return browserDuration;

    }


    return 0;

};

// =====================================================
// START COMMENT VOICE RECORDING
// SINGLE AUTHORITATIVE RECORDING CLOCK
// =====================================================

window.startCommentVoiceRecording = async function () {

    console.log("🎙️ START COMMENT VOICE");

    // -------------------------------------------------
    // DEBUG
    // -------------------------------------------------

    window.showVoiceDebug = function (message) {

        let box =
            document.getElementById("voiceRecordingDebug");

        if (!box) {

            box = document.createElement("div");

            box.id = "voiceRecordingDebug";

            box.style =
                "position:fixed;" +
                "top:60px;" +
                "left:10px;" +
                "right:10px;" +
                "background:#111;" +
                "color:#00ff66;" +
                "padding:10px;" +
                "border-radius:10px;" +
                "font-size:12px;" +
                "z-index:999999999;" +
                "font-family:monospace;";

            document.body.appendChild(box);
        }

        box.textContent = message;
    };


    // -------------------------------------------------
    // PREVENT DUPLICATE START
    // -------------------------------------------------

    if (
        window.commentRecording ||
        window.commentVoiceStarting
    ) {

        console.log("⚠️ Already recording/starting");

        return;
    }


    window.commentVoiceStarting = true;

    window.commentVoiceStopRequested = false;

    window.commentMediaRecorder = null;

    window.commentAudioChunks = [];

    window.commentRecordingStartedAt = 0;

    window.commentVoiceStartTime = null;

    window.recordedVoiceDuration = 0;


    // -------------------------------------------------
    // CLEAR PREVIOUS RECORDING
    // -------------------------------------------------

    window.recordedVoiceBlob = null;

    if (window.recordedVoiceUrl) {

        try {

            URL.revokeObjectURL(
                window.recordedVoiceUrl
            );

        } catch (error) {

            console.warn(
                "⚠️ Old voice URL cleanup failed:",
                error
            );

        }

        window.recordedVoiceUrl = null;
    }


    // -------------------------------------------------
    // BUTTON
    // -------------------------------------------------

    const voiceBtn =
        window.getCommentVoiceButton
            ? window.getCommentVoiceButton()
            : document.getElementById("voiceBtn");


    if (voiceBtn) {

        voiceBtn.innerHTML = "⏳";

        voiceBtn.style.background = "#ff3040";

        voiceBtn.style.transform = "scale(1.08)";
    }


    try {

        // =================================================
        // MICROPHONE CHECK
        // =================================================

        if (
            !navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia
        ) {

            throw new Error(
                "Microphone API unavailable"
            );
        }


        // =================================================
        // REQUEST MICROPHONE
        // =================================================

        const stream =
            await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            });


        window.commentVoiceStream = stream;


        console.log("✅ Microphone granted");


        // =================================================
        // USER RELEASED DURING PERMISSION
        // =================================================

        if (window.commentVoiceStopRequested) {

            console.log(
                "🛑 Stop requested during microphone permission"
            );


            stream
                .getTracks()
                .forEach(track => track.stop());


            window.commentVoiceStream = null;

            window.commentVoiceStarting = false;

            window.commentRecording = false;

            window.resetCommentVoiceButton();

            return;
        }


        // =================================================
        // FIND SUPPORTED MIME TYPE
        // =================================================

        let mimeType = "";


        if (
            typeof MediaRecorder !== "undefined"
        ) {

            if (
                MediaRecorder.isTypeSupported(
                    "audio/webm;codecs=opus"
                )
            ) {

                mimeType =
                    "audio/webm;codecs=opus";

            }

            else if (
                MediaRecorder.isTypeSupported(
                    "audio/webm"
                )
            ) {

                mimeType =
                    "audio/webm";

            }

            else if (
                MediaRecorder.isTypeSupported(
                    "audio/mp4"
                )
            ) {

                mimeType =
                    "audio/mp4";

            }

            else if (
                MediaRecorder.isTypeSupported(
                    "audio/ogg;codecs=opus"
                )
            ) {

                mimeType =
                    "audio/ogg;codecs=opus";

            }
        }


        // =================================================
        // CREATE RECORDER
        // =================================================

        const recorder =
            mimeType
                ? new MediaRecorder(
                    stream,
                    {
                        mimeType: mimeType
                    }
                )
                : new MediaRecorder(stream);


        window.commentMediaRecorder =
            recorder;


        window.commentVoiceMimeType =
            recorder.mimeType ||
            mimeType ||
            "audio/webm";


        console.log(
            "🎧 Recorder MIME:",
            window.commentVoiceMimeType
        );


        // =================================================
        // AUDIO DATA
        // =================================================

        recorder.ondataavailable =
            function (event) {

                if (
                    event.data &&
                    event.data.size > 0
                ) {

                    window.commentAudioChunks.push(
                        event.data
                    );

                }

            };


        // =================================================
        // ERROR
        // =================================================

        recorder.onerror =
            function (event) {

                console.error(
                    "❌ MediaRecorder error:",
                    event
                );

            };


        // =================================================
        // STOP
        // =================================================

        recorder.onstop =
            async function () {

                console.log(
                    "🛑 COMMENT RECORDER STOPPED"
                );


                // -----------------------------------------
                // FINAL AUTHORITATIVE DURATION
                // -----------------------------------------

                let duration = 0;


                if (
                    Number.isFinite(
                        window.commentRecordingStartedAt
                    ) &&
                    window.commentRecordingStartedAt > 0
                ) {

                    duration =
                        (
                            Date.now() -
                            window.commentRecordingStartedAt
                        ) / 1000;

                }


                if (
                    !Number.isFinite(duration) ||
                    duration < 0
                ) {

                    duration = 0;

                }


                window.recordedVoiceDuration =
                    Math.round(
                        duration * 1000
                    ) / 1000;


                console.log(
                    "⏱️ RECORDER DURATION:",
                    window.recordedVoiceDuration.toFixed(3),
                    "seconds"
                );


                // -----------------------------------------
                // STOP DISPLAY TIMER
                // -----------------------------------------

                if (
                    typeof window.stopCommentVoiceTimer ===
                    "function"
                ) {

                    window.stopCommentVoiceTimer();

                }


                // -----------------------------------------
                // CREATE FINAL BLOB
                // -----------------------------------------

                const blob =
                    new Blob(
                        window.commentAudioChunks,
                        {
                            type:
                                recorder.mimeType ||
                                window.commentVoiceMimeType ||
                                "audio/webm"
                        }
                    );


                console.log(
                    "🎧 FINAL BLOB:",
                    blob.size,
                    blob.type
                );


                // -----------------------------------------
                // STOP MICROPHONE
                // -----------------------------------------

                if (
                    window.commentVoiceStream
                ) {

                    window.commentVoiceStream
                        .getTracks()
                        .forEach(
                            track => track.stop()
                        );

                }


                window.commentVoiceStream = null;


                // -----------------------------------------
                // RESET RECORDER STATE
                // -----------------------------------------

                window.commentMediaRecorder = null;

                window.commentAudioChunks = [];

                window.commentRecording = false;

                window.commentVoiceStarting = false;

                window.commentVoiceStopRequested = false;


                window.resetCommentVoiceButton();


                // -----------------------------------------
                // CHECK BLOB
                // -----------------------------------------

                if (
                    !blob ||
                    blob.size <= 0
                ) {

                    console.warn(
                        "⚠️ No audio data produced"
                    );

                    if (
                        typeof showToast === "function"
                    ) {

                        showToast(
                            "No audio was recorded."
                        );

                    }

                    return;
                }


                // -----------------------------------------
                // SAVE BLOB
                // -----------------------------------------

                window.recordedVoiceBlob =
                    blob;


                // -----------------------------------------
                // CREATE OBJECT URL
                // -----------------------------------------

                if (
                    window.recordedVoiceUrl
                ) {

                    try {

                        URL.revokeObjectURL(
                            window.recordedVoiceUrl
                        );

                    } catch (error) {

                        console.warn(
                            "⚠️ Previous URL cleanup failed:",
                            error
                        );

                    }

                }


                window.recordedVoiceUrl =
                    URL.createObjectURL(blob);


                // -----------------------------------------
                // DEBUG
                // -----------------------------------------

                window.showVoiceDebug(
                    "RECORDED: " +
                    window.recordedVoiceDuration.toFixed(3) +
                    "s\n" +
                    "BLOB: " +
                    blob.size +
                    " bytes\n" +
                    "TYPE: " +
                    blob.type
                );


                // -----------------------------------------
                // SHOW PREVIEW
                // -----------------------------------------

                if (
                    typeof window.showVoicePreview ===
                    "function"
                ) {

                    await window.showVoicePreview();

                }

            };


        // =================================================
        // START RECORDER
        // =================================================

        recorder.start(100);


        // =================================================
        // VERIFY
        // =================================================

        if (
            recorder.state !== "recording"
        ) {

            throw new Error(
                "Recorder did not enter recording state."
            );

        }


        // =================================================
        // AUTHORITATIVE START TIME
        // =================================================

        const startTime =
            Date.now();


        window.commentRecordingStartedAt =
            startTime;

        window.commentVoiceStartTime =
            startTime;

        window.recordedVoiceStartTime =
            startTime;


        window.commentRecording =
            true;

        window.commentVoiceStarting =
            false;


        console.log(
            "🔴 RECORDING ACTIVE:",
            startTime
        );


        // =================================================
        // BUTTON
        // =================================================

        if (voiceBtn) {

            voiceBtn.innerHTML = "🔴";

        }


        // =================================================
        // START DISPLAY TIMER
        // =================================================

        if (
            typeof window.startCommentVoiceTimer ===
            "function"
        ) {

            window.startCommentVoiceTimer(
                startTime
            );

        }


        // =================================================
        // RELEASED DURING STARTUP
        // =================================================

        if (
            window.commentVoiceStopRequested &&
            recorder.state !== "inactive"
        ) {

            console.log(
                "🛑 Immediate stop requested"
            );

            recorder.stop();

        }

    }

    catch (error) {

        console.error(
            "❌ COMMENT VOICE START ERROR:",
            error
        );


        if (
            window.commentVoiceStream
        ) {

            window.commentVoiceStream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }


        window.commentVoiceStream = null;

        window.commentMediaRecorder = null;

        window.commentAudioChunks = [];

        window.commentRecording = false;

        window.commentVoiceStarting = false;

        window.commentVoiceStopRequested = false;

        window.commentRecordingStartedAt = 0;

        window.commentVoiceStartTime = null;


        if (
            typeof window.stopCommentVoiceTimer ===
            "function"
        ) {

            window.stopCommentVoiceTimer();

        }


        window.resetCommentVoiceButton();


        if (
            error.name === "NotAllowedError"
        ) {

            if (
                typeof showToast === "function"
            ) {

                showToast(
                    "Microphone permission was denied."
                );

            }

        }

        else {

            if (
                typeof showToast === "function"
            ) {

                showToast(
                    "Could not start voice recording."
                );

            }

        }

    }

};


// =====================================================
// STOP COMMENT VOICE RECORDING
// SAFE HOLD-TO-RECORD VERSION
// =====================================================

window.stopCommentVoiceRecording = function () {

    console.log(
        "🛑 stopCommentVoiceRecording()"
    );


    // =================================================
    // TELL START FUNCTION TO STOP
    // =================================================

    window.commentVoiceStopRequested = true;


    // =================================================
    // STOP WHEN RECORDER IS READY
    // =================================================

    const stopWhenReady = function () {

        const recorder =
            window.commentMediaRecorder;


        // -------------------------------------------------
        // RECORDER IS STILL STARTING
        // -------------------------------------------------

        if (!recorder) {

            if (
                window.commentVoiceStarting
            ) {

                console.log(
                    "⏳ Recorder still starting..."
                );


                setTimeout(
                    stopWhenReady,
                    30
                );


                return;
            }


            console.log(
                "ℹ️ No active recorder."
            );


            return;
        }


        // -------------------------------------------------
        // ALREADY STOPPED
        // -------------------------------------------------

        if (
            recorder.state === "inactive"
        ) {

            console.log(
                "ℹ️ Recorder already inactive."
            );


            return;
        }


        // -------------------------------------------------
        // STOP RECORDER
        // -------------------------------------------------

        try {

            console.log(
                "🛑 Stopping recorder:",
                recorder.state
            );


            recorder.stop();

        }

        catch (error) {

            console.error(
                "❌ Stop recording error:",
                error
            );

        }

    };


    stopWhenReady();

};


// =====================================================
// FORMAT VOICE TIME
// =====================================================

window.formatVoiceTime = function (seconds) {

    seconds = Number(seconds);

    if (
        !Number.isFinite(seconds) ||
        seconds < 0
    ) {

        return "0:00";
    }


    const minutes =
        Math.floor(seconds / 60);


    const remainingSeconds =
        Math.floor(seconds % 60);


    return (
        minutes +
        ":" +
        String(remainingSeconds)
            .padStart(2, "0")
    );

};


// =====================================================
// START COMMENT VOICE TIMER
// USE RECORDER'S AUTHORITATIVE START TIME
// =====================================================

window.startCommentVoiceTimer = function (
    authoritativeStartTime
) {

    // -------------------------------------------------
    // STOP OLD TIMER
    // -------------------------------------------------

    if (window.commentVoiceTimer) {

        clearInterval(
            window.commentVoiceTimer
        );

        window.commentVoiceTimer = null;
    }


    // -------------------------------------------------
    // DO NOT CREATE A NEW CLOCK
    // -------------------------------------------------

    const startTime =
        Number(authoritativeStartTime);


    if (
        !Number.isFinite(startTime) ||
        startTime <= 0
    ) {

        console.warn(
            "⚠️ Invalid authoritative recording start time"
        );

        return;
    }


    // -------------------------------------------------
    // KEEP SAME START TIME EVERYWHERE
    // -------------------------------------------------

    window.commentRecordingStartedAt =
        startTime;

    window.commentVoiceStartTime =
        startTime;

    window.recordedVoiceStartTime =
        startTime;


    window.recordedVoiceDuration =
        0;


    // -------------------------------------------------
    // RECORDING TIME ELEMENT
    // -------------------------------------------------

    const timeElement =
        document.getElementById(
            "commentVoiceRecordingTime"
        );


    if (timeElement) {

        timeElement.textContent =
            "0:00";

        timeElement.style.display =
            "inline-block";
    }


    // -------------------------------------------------
    // UPDATE DISPLAY
    // -------------------------------------------------

    const updateTimer =
        function () {

            if (
                !window.commentRecording
            ) {

                return;
            }


            const elapsed =
                (
                    Date.now() -
                    startTime
                ) / 1000;


            if (
                !Number.isFinite(elapsed) ||
                elapsed < 0
            ) {

                return;
            }


            // -----------------------------------------
            // KEEP INTERNAL PRECISION
            // -----------------------------------------

            window.recordedVoiceDuration =
                elapsed;


            // -----------------------------------------
            // DISPLAY
            // -----------------------------------------

            if (timeElement) {

                timeElement.textContent =
                    window.formatVoiceTime(
                        elapsed
                    );
            }

        };


    // -------------------------------------------------
    // IMMEDIATE UPDATE
    // -------------------------------------------------

    updateTimer();


    // -------------------------------------------------
    // START DISPLAY INTERVAL
    // -------------------------------------------------

    window.commentVoiceTimer =
        setInterval(
            updateTimer,
            100
        );


    console.log(
        "⏱️ Voice display timer started:",
        startTime
    );

};


// =====================================================
// STOP COMMENT VOICE TIMER
// DO NOT RESET AUTHORITATIVE DURATION
// =====================================================

window.stopCommentVoiceTimer = function () {

    // -------------------------------------------------
    // STOP INTERVAL
    // -------------------------------------------------

    if (window.commentVoiceTimer) {

        clearInterval(
            window.commentVoiceTimer
        );

        window.commentVoiceTimer =
            null;
    }


    // -------------------------------------------------
    // FINAL DISPLAY CALCULATION
    // -------------------------------------------------

    const startTime =
        Number(
            window.commentRecordingStartedAt
        );


    if (
        Number.isFinite(startTime) &&
        startTime > 0
    ) {

        const elapsed =
            (
                Date.now() -
                startTime
            ) / 1000;


        if (
            Number.isFinite(elapsed) &&
            elapsed >= 0
        ) {

            /*
             * Keep the exact value internally.
             *
             * Function 1 will calculate the final
             * authoritative duration again inside
             * MediaRecorder.onstop.
             */

            window.recordedVoiceDuration =
                elapsed;

        }

    }


    // -------------------------------------------------
    // HIDE RECORDING TIMER
    // -------------------------------------------------

    const timeElement =
        document.getElementById(
            "commentVoiceRecordingTime"
        );


    if (timeElement) {

        timeElement.style.display =
            "none";
    }


    console.log(
        "🛑 Voice display timer stopped:",
        Number(
            window.recordedVoiceDuration || 0
        ).toFixed(3),
        "seconds"
    );

};

// =====================================================
// SETUP COMMENT VOICE BUTTON
// HOLD = RECORD
// RELEASE = STOP
// =====================================================

window.setupCommentVoiceButton = function () {

    const voiceBtn =
        document.getElementById("voiceBtn");


    // -------------------------------------------------
    // BUTTON NOT FOUND
    // -------------------------------------------------

    if (!voiceBtn) {

        console.log(
            "⏳ Comment voice button not found yet"
        );

        return false;
    }


    // -------------------------------------------------
    // PREVENT DUPLICATE LISTENERS
    // -------------------------------------------------

    if (
        voiceBtn.dataset.commentVoiceReady === "true"
    ) {

        console.log(
            "✅ Comment voice button already connected"
        );

        return true;
    }


    console.log(
        "🎤 Connecting comment voice button..."
    );


    voiceBtn.dataset.commentVoiceReady =
        "true";


    let pressStarted = false;


    // =================================================
    // START RECORDING
    // =================================================

    const startRecording = function (event) {

        if (event) {

            event.preventDefault();
            event.stopPropagation();

        }


        // ---------------------------------------------
        // IGNORE SECOND POINTER
        // ---------------------------------------------

        if (pressStarted) {

            return;
        }


        // ---------------------------------------------
        // IGNORE IF ALREADY RECORDING
        // ---------------------------------------------

        if (
            window.commentRecording ||
            window.commentVoiceStarting
        ) {

            return;
        }


        pressStarted = true;


        console.log(
            "🎙️ COMMENT VOICE PRESS DOWN"
        );


        if (
            typeof window.startCommentVoiceRecording ===
            "function"
        ) {

            window.startCommentVoiceRecording();

        }

        else {

            console.error(
                "❌ startCommentVoiceRecording is missing"
            );

            pressStarted = false;

        }

    };


    // =================================================
    // STOP RECORDING
    // =================================================

    const stopRecording = function (event) {

        if (event) {

            event.preventDefault();
            event.stopPropagation();

        }


        if (!pressStarted) {

            return;
        }


        pressStarted = false;


        console.log(
            "🛑 COMMENT VOICE RELEASE"
        );


        if (
            typeof window.stopCommentVoiceRecording ===
            "function"
        ) {

            window.stopCommentVoiceRecording();

        }

        else {

            console.error(
                "❌ stopCommentVoiceRecording is missing"
            );

        }

    };


    // =================================================
    // POINTER DOWN
    // =================================================

    voiceBtn.addEventListener(
        "pointerdown",
        startRecording,
        {
            passive: false
        }
    );


    // =================================================
    // POINTER UP
    // =================================================

    voiceBtn.addEventListener(
        "pointerup",
        stopRecording,
        {
            passive: false
        }
    );


    // =================================================
    // POINTER CANCEL
    // =================================================

    voiceBtn.addEventListener(
        "pointercancel",
        stopRecording,
        {
            passive: false
        }
    );


    // =================================================
    // POINTER LEAVES BUTTON
    // =================================================

    voiceBtn.addEventListener(
        "pointerleave",
        function (event) {

            if (pressStarted) {

                stopRecording(event);

            }

        },
        {
            passive: false
        }
    );


    // =================================================
    // POINTER UP ANYWHERE ON DOCUMENT
    // IMPORTANT FOR MOBILE
    // =================================================

    document.addEventListener(
        "pointerup",
        function (event) {

            if (!pressStarted) {

                return;
            }


            /*
             * The button may not receive pointerup
             * when the finger is released outside it.
             *
             * Therefore document-level pointerup
             * guarantees the recording stops.
             */

            stopRecording(event);

        },
        {
            passive: false
        }
    );


    // =================================================
    // POINTER CANCEL ANYWHERE
    // =================================================

    document.addEventListener(
        "pointercancel",
        function (event) {

            if (!pressStarted) {

                return;
            }


            stopRecording(event);

        },
        {
            passive: false
        }
    );


    // =================================================
    // WINDOW BLUR
    // SAFETY STOP
    // =================================================

    window.addEventListener(
        "blur",
        function () {

            if (!pressStarted) {

                return;
            }


            console.log(
                "🛑 Window lost focus — stopping voice"
            );


            stopRecording();

        }
    );


    // =================================================
    // VISIBILITY CHANGE
    // SAFETY STOP
    // =================================================

    document.addEventListener(
        "visibilitychange",
        function () {

            if (
                document.hidden &&
                pressStarted
            ) {

                console.log(
                    "🛑 Page hidden — stopping voice"
                );


                stopRecording();

            }

        }
    );


    console.log(
        "✅ COMMENT voice button connected"
    );


    return true;

};
    

// =====================================================
// SHOW VOICE COMMENT PREVIEW

window.showVoicePreview = async function () {

    const preview =
        document.getElementById("voicePreview");

    const audio =
        document.getElementById("voicePreviewAudio");

    const playBtn =
        document.getElementById("voicePreviewPlay");

    const time =
        document.getElementById("voicePreviewTime");

    const deleteBtn =
        document.getElementById("voicePreviewDelete");

    const postBtn =
        document.getElementById("voicePreviewPost");


    // =================================================
    // CHECK HTML
    // =================================================

    if (!preview || !audio) {

        console.warn(
            "⚠️ Voice preview HTML not found"
        );

        return false;
    }


    // =================================================
    // CHECK BLOB
    // =================================================

    const blob =
        window.recordedVoiceBlob;


    if (
        !blob ||
        blob.size <= 0
    ) {

        console.warn(
            "⚠️ No recorded voice blob"
        );

        return false;
    }


    // =================================================
    // SHOW PREVIEW
    // =================================================

    preview.style.display =
        "block";


    if (playBtn) {
        playBtn.innerHTML = "▶";
    }


    // =================================================
    // DETERMINE DURATION
    // =================================================

    let duration =
        Number(
            window.recordedVoiceDuration
        );


    // -------------------------------------------------
    // USE REAL AUDIO DURATION WHEN AVAILABLE
    // -------------------------------------------------

    if (
        typeof window.getVoiceAudioDuration ===
        "function"
    ) {

        try {

            const detectedDuration =
                await window.getVoiceAudioDuration(
                    blob
                );


            if (
                Number.isFinite(detectedDuration) &&
                detectedDuration > 0
            ) {

                duration =
                    detectedDuration;

                console.log(
                    "🎧 PREVIEW REAL DURATION:",
                    duration.toFixed(3),
                    "seconds"
                );

            }

        }

        catch (error) {

            console.warn(
                "⚠️ Preview duration detection failed:",
                error
            );

        }

    }


    // =================================================
    // FINALIZE DURATION
    // =================================================

    if (
        !Number.isFinite(duration) ||
        duration < 0
    ) {

        duration = 0;

    }


    duration =
        Math.round(
            duration * 1000
        ) / 1000;


    window.recordedVoiceDuration =
        duration;


    console.log(
        "⏱️ PREVIEW DURATION:",
        duration.toFixed(3),
        "seconds"
    );


    // =================================================
    // CREATE OBJECT URL IF NECESSARY
    // =================================================

    if (!window.recordedVoiceUrl) {

        window.recordedVoiceUrl =
            URL.createObjectURL(
                blob
            );

    }


    // =================================================
    // RESET AUDIO
    // =================================================

    audio.pause();

    audio.removeAttribute("src");

    audio.load();

    audio.src =
        window.recordedVoiceUrl;

    audio.preload =
        "auto";

    audio.load();


    // =================================================
    // INITIAL TIME
    // =================================================

    if (time) {

        time.textContent =
            window.formatVoiceTime(
                duration
            );

    }


    // =================================================
    // PLAY / PAUSE
    // =================================================

    if (playBtn) {

        playBtn.onclick =
            async function (event) {

                event.preventDefault();
                event.stopPropagation();


                if (audio.paused) {

                    if (audio.ended) {
                        audio.currentTime = 0;
                    }


                    try {

                        await audio.play();

                        playBtn.innerHTML =
                            "⏸";

                    }

                    catch (error) {

                        console.error(
                            "❌ Preview playback error:",
                            error
                        );

                    }

                }

                else {

                    audio.pause();

                    playBtn.innerHTML =
                        "▶";

                }

            };

    }


    // =================================================
    // TIME UPDATE
    // =================================================

    audio.ontimeupdate =
        function () {

            if (!time) {
                return;
            }


            let current =
                Number(
                    audio.currentTime
                );


            if (
                !Number.isFinite(current) ||
                current < 0
            ) {

                current = 0;

            }


            if (duration > 0) {

                current =
                    Math.min(
                        current,
                        duration
                    );

            }


            time.textContent =
                window.formatVoiceTime(
                    current
                );

        };


    // =================================================
    // ENDED
    // =================================================

    audio.onended =
        function () {

            if (playBtn) {
                playBtn.innerHTML = "▶";
            }


            if (time) {

                time.textContent =
                    window.formatVoiceTime(
                        duration
                    );

            }

        };


    // =================================================
    // AUDIO ERROR
    // =================================================

    audio.onerror =
        function (event) {

            console.error(
                "❌ Preview audio error:",
                event
            );

        };


    // =================================================
    // DELETE
    // =================================================

    if (deleteBtn) {

        deleteBtn.onclick =
            function (event) {

                event.preventDefault();
                event.stopPropagation();


                if (
                    typeof window.clearVoicePreview ===
                    "function"
                ) {

                    window.clearVoicePreview();

                }

            };

    }


    // =================================================
    // POST
    // =================================================

    if (postBtn) {

        postBtn.onclick =
            async function (event) {

                event.preventDefault();
                event.stopPropagation();


                if (
                    !window.recordedVoiceBlob ||
                    window.recordedVoiceBlob.size <= 0
                ) {

                    if (
                        typeof showToast ===
                        "function"
                    ) {

                        showToast(
                            "No voice recording."
                        );

                    }

                    return;
                }


                if (
                    window.postingRecordedVoice
                ) {

                    return;

                }


                postBtn.disabled =
                    true;

                postBtn.innerHTML =
                    "⏳";


                try {

                    const success =
                        await window.uploadVoiceComment(
                            window.recordedVoiceBlob
                        );


                    if (success) {

                        window.clearVoicePreview();

                    }

                }

                catch (error) {

                    console.error(
                        "❌ Voice comment post error:",
                        error
                    );


                    if (
                        typeof showToast ===
                        "function"
                    ) {

                        showToast(
                            "Couldn't post voice comment."
                        );

                    }

                }

                finally {

                    postBtn.disabled =
                        false;

                    postBtn.innerHTML =
                        "➤";

                }

            };

    }


    console.log(
        "✅ Voice preview ready:",
        duration.toFixed(3),
        "seconds"
    );


    return true;

};

// =====================================================
// PLAY / PAUSE POSTED VOICE COMMENT
// SINGLE AUTHORITATIVE DURATION SOURCE
// =====================================================

window.toggleVoice = function (id) {

    const audio =
        document.getElementById(
            "voiceAudio-" + id
        );

    const btn =
        document.getElementById(
            "voiceBtn-" + id
        );

    const waveform =
        document.getElementById(
            "voiceWaveform-" + id
        );

    const time =
        document.getElementById(
            "voiceTime-" + id
        );

    const player =
        document.getElementById(
            "commentVoice-" + id
        );


    if (!audio || !btn) {
        return;
    }


    // =================================================
    // GET ONE AUTHORITATIVE DURATION
    // =================================================

    let duration = 0;


    if (
        typeof window.getAuthoritativeVoiceDuration ===
        "function"
    ) {

        duration =
            Number(
                window.getAuthoritativeVoiceDuration(id)
            );

    }


    if (
        !Number.isFinite(duration) ||
        duration <= 0
    ) {

        duration = 0;

    }


    console.log(
        "🎧 VOICE DURATION:",
        duration.toFixed(3),
        "seconds"
    );


    // =================================================
    // CREATE WAVEFORM
    // =================================================

    if (
        waveform &&
        !waveform.querySelector(".voiceWaveBar")
    ) {

        if (
            typeof window.createVoiceWaveform ===
            "function"
        ) {

            window.createVoiceWaveform(id);

        }

    }


    // =================================================
    // UPDATE UI
    // =================================================

    const updateUI =
        function () {

            let current =
                Number(
                    audio.currentTime
                );


            if (
                !Number.isFinite(current) ||
                current < 0
            ) {

                current = 0;

            }


            // -----------------------------------------
            // NEVER EXCEED AUTHORITATIVE DURATION
            // -----------------------------------------

            if (duration > 0) {

                current =
                    Math.min(
                        current,
                        duration
                    );

            }


            // -----------------------------------------
            // TIME
            // -----------------------------------------

            if (time) {

                time.textContent =
                    window.formatVoiceTime(
                        current
                    );

            }


            // -----------------------------------------
            // WAVEFORM
            // -----------------------------------------

            if (
                waveform &&
                duration > 0
            ) {

                const bars =
                    waveform.querySelectorAll(
                        ".voiceWaveBar"
                    );


                const progress =
                    Math.max(
                        0,
                        Math.min(
                            1,
                            current / duration
                        )
                    );


                const activeBars =
                    Math.floor(
                        progress *
                        bars.length
                    );


                bars.forEach(
                    function (bar, index) {

                        if (
                            index < activeBars
                        ) {

                            bar.classList.add(
                                "played"
                            );

                        }

                        else {

                            bar.classList.remove(
                                "played"
                            );

                        }

                    }
                );

            }

        };


    // =================================================
    // STOP OTHER VOICE COMMENTS
    // =================================================

    document
        .querySelectorAll(
            ".commentVoice audio"
        )
        .forEach(
            function (otherAudio) {

                if (
                    otherAudio === audio
                ) {
                    return;
                }


                otherAudio.pause();

                try {
                    otherAudio.currentTime = 0;
                }
                catch (error) {
                    console.warn(
                        "⚠️ Could not reset other voice:",
                        error
                    );
                }


                const otherId =
                    otherAudio.id.replace(
                        "voiceAudio-",
                        ""
                    );


                const otherBtn =
                    document.getElementById(
                        "voiceBtn-" + otherId
                    );


                if (otherBtn) {

                    otherBtn.innerHTML =
                        "▶";

                }


                const otherPlayer =
                    document.getElementById(
                        "commentVoice-" +
                        otherId
                    );


                if (otherPlayer) {

                    otherPlayer.classList.remove(
                        "playing"
                    );

                }


                const otherWave =
                    document.getElementById(
                        "voiceWaveform-" +
                        otherId
                    );


                if (otherWave) {

                    otherWave
                        .querySelectorAll(
                            ".voiceWaveBar"
                        )
                        .forEach(
                            function (bar) {

                                bar.classList.remove(
                                    "played"
                                );

                            }
                        );

                }


                const otherTime =
                    document.getElementById(
                        "voiceTime-" +
                        otherId
                    );


                if (otherTime) {

                    let otherDuration = 0;


                    if (
                        typeof window.getAuthoritativeVoiceDuration ===
                        "function"
                    ) {

                        otherDuration =
                            Number(
                                window.getAuthoritativeVoiceDuration(
                                    otherId
                                )
                            );

                    }


                    otherTime.textContent =
                        otherDuration > 0
                            ? window.formatVoiceTime(
                                otherDuration
                            )
                            : "0:00";

                }

            }
        );


    // =================================================
    // CONNECT PLAYBACK EVENTS
    // =================================================

    audio.ontimeupdate =
        updateUI;


    audio.onseeked =
        updateUI;


    audio.onloadedmetadata =
        function () {

            console.log(
                "🎧 Browser metadata:",
                audio.duration,
                "| Authoritative:",
                duration
            );

            updateUI();

        };


    // =================================================
    // PLAY
    // =================================================

    if (audio.paused) {

        if (audio.ended) {

            try {
                audio.currentTime = 0;
            }
            catch (error) {
                console.warn(
                    "⚠️ Could not reset audio:",
                    error
                );
            }

        }


        audio.play()
            .then(
                function () {

                    btn.innerHTML =
                        "⏸";


                    if (player) {

                        player.classList.add(
                            "playing"
                        );

                    }


                    updateUI();

                }
            )
            .catch(
                function (error) {

                    console.error(
                        "❌ Voice playback error:",
                        error
                    );

                }
            );

    }


    // =================================================
    // PAUSE
    // =================================================

    else {

        audio.pause();


        btn.innerHTML =
            "▶";


        if (player) {

            player.classList.remove(
                "playing"
            );

        }


        updateUI();

    }


    // =================================================
    // PLAYBACK ENDED
    // =================================================

    audio.onended =
        function () {

            console.log(
                "✅ VOICE PLAYBACK FINISHED:",
                id
            );


            if (duration > 0) {

                if (time) {

                    time.textContent =
                        window.formatVoiceTime(
                            duration
                        );

                }

            }


            if (waveform) {

                waveform
                    .querySelectorAll(
                        ".voiceWaveBar"
                    )
                    .forEach(
                        function (bar) {

                            bar.classList.add(
                                "played"
                            );

                        }
                    );

            }


            btn.innerHTML =
                "▶";


            if (player) {

                player.classList.remove(
                    "playing"
                );

            }

        };

};
