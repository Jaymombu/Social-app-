window.openMedia = function (
    url,
    type = "image",
    options = {}
) {

    if (
        typeof url !== "string" ||
        !url.trim()
    ) {
        console.warn(
            "❌ openMedia: invalid URL"
        );
        return false;
    }

    url = url.trim();

    if (
        type !== "image" &&
        type !== "video"
    ) {
        console.warn(
            "⚠️ openMedia: invalid media type:",
            type
        );

        type = "image";
    }

    const viewer =
        document.getElementById(
            "mediaViewer"
        );

    if (!viewer) {
        console.error(
            "❌ #mediaViewer NOT FOUND"
        );
        return false;
    }

    const restoring =
        options?.restoring === true;

    console.log(
        "🖼️ OPEN MEDIA:",
        {
            type,
            url,
            restoring
        }
    );

    // =================================================
    // CAPTURE SOURCE SCREEN
    // =================================================

    const currentNavigation =
        window.appNavigation?.current ||
        null;

    const historyScreen =
        history.state?.appScreen ||
        null;

    const sourceScreen =
        options?.sourceScreen ||
        currentNavigation?.screen ||
        historyScreen ||
        "app";

    const sourceData =
        options?.sourceData ||
        currentNavigation?.data ||
        history.state?.data ||
        {};

    const mediaData = {
        sourceScreen,
        sourceData,
        type,
        url
    };

    window._mediaReturnState = {
        screen: sourceScreen,
        data: sourceData
    };

    // =================================================
    // PAUSE VIDEOS OUTSIDE VIEWER
    // =================================================

    document
        .querySelectorAll("video")
        .forEach(video => {

            if (!viewer.contains(video)) {

                try {
                    video.pause();
                } catch (error) {}

            }
        });

    // =================================================
    // HISTORY
    // =================================================

    if (!restoring) {

        if (
            history.state?.appScreen !==
            "mediaViewer"
        ) {

            history.pushState(
                {
                    appScreen:
                        "mediaViewer",

                    data:
                        mediaData,

                    scrollY:
                        0
                },
                "",
                location.href
            );

        } else {

            history.replaceState(
                {
                    appScreen:
                        "mediaViewer",

                    data:
                        mediaData,

                    scrollY:
                        0
                },
                "",
                location.href
            );
        }

    } else {

        /*
         * During restoration we must NOT
         * create another history entry.
         */
        if (
            history.state?.appScreen !==
            "mediaViewer"
        ) {

            history.replaceState(
                {
                    appScreen:
                        "mediaViewer",

                    data:
                        mediaData,

                    scrollY:
                        0
                },
                "",
                location.href
            );
        }
    }

    // =================================================
    // CENTRAL NAVIGATION STATE
    // =================================================

    if (window.appNavigation) {

        window.appNavigation.current = {
            screen:
                "mediaViewer",

            data:
                mediaData,

            scrollY:
                0,

            timestamp:
                Date.now()
        };

        try {

            sessionStorage.setItem(
                "appNavigationState",
                JSON.stringify(
                    window.appNavigation.current
                )
            );

        } catch (error) {

            console.warn(
                "⚠️ MEDIA NAVIGATION SAVE FAILED:",
                error
            );
        }
    }

    // =================================================
    // RESET VIEWER
    // =================================================

    viewer.innerHTML = "";

    viewer.style.cssText = `
        position:fixed;
        inset:0;
        width:100vw;
        height:100vh;
        z-index:2147483647;
        background:rgba(0,0,0,.97);
        display:flex;
        align-items:center;
        justify-content:center;
        overflow:hidden;
        visibility:visible;
        opacity:0;
        pointer-events:auto;
        touch-action:none;
        transform:translate3d(0,0,0);
        transition:opacity .2s ease;
    `;

    // =================================================
    // LOCK BACKGROUND
    // =================================================

    try {

        if (
            typeof window.lockBackground ===
            "function"
        ) {

            window.lockBackground();

        } else {

            document.body.style.overflow =
                "hidden";
        }

    } catch (error) {

        document.body.style.overflow =
            "hidden";
    }

    // =================================================
    // CLOSE BUTTON
    // =================================================

    const closeButton =
        document.createElement("button");

    closeButton.type = "button";

    closeButton.textContent = "✕";

    closeButton.setAttribute(
        "aria-label",
        "Close media"
    );

    closeButton.style.cssText = `
        position:absolute;
        top:18px;
        left:18px;
        width:48px;
        height:48px;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:0;
        margin:0;
        border:0;
        border-radius:50%;
        background:rgba(20,20,20,.8);
        color:#fff;
        font-size:27px;
        line-height:1;
        z-index:100;
        cursor:pointer;
        pointer-events:auto;
        touch-action:manipulation;
    `;

    closeButton.addEventListener(
        "click",
        event => {

            event.preventDefault();
            event.stopPropagation();

            window.closeMedia();
        }
    );

    viewer.appendChild(
        closeButton
    );

    // =================================================
    // MEDIA CONTAINER
    // =================================================

    const container =
        document.createElement("div");

    container.style.cssText = `
        position:relative;
        width:100%;
        height:100%;
        display:flex;
        align-items:center;
        justify-content:center;
        overflow:hidden;
        touch-action:none;
    `;

    viewer.appendChild(
        container
    );

    // =================================================
    // IMAGE STATE
    // =================================================

    let imageScale = 1;

    // =================================================
    // IMAGE
    // =================================================

    if (type === "image") {

        const image =
            document.createElement("img");

        image.src = url;

        image.alt = "Media";

        image.draggable = false;

        image.style.cssText = `
            max-width:96vw;
            max-height:96vh;
            width:auto;
            height:auto;
            object-fit:contain;
            display:block;
            touch-action:none;
            user-select:none;
            -webkit-user-select:none;
            -webkit-user-drag:none;
            transform-origin:center center;
            transform:translate3d(0,0,0) scale(1);
            transition:transform .15s ease;
        `;

        image.addEventListener(
            "error",
            () => {

                console.error(
                    "❌ MEDIA IMAGE FAILED:",
                    url
                );
            }
        );

        container.appendChild(
            image
        );

        let scale = 1;

        let currentX = 0;
        let currentY = 0;

        let startDistance = 0;

        let dragging = false;

        let startX = 0;
        let startY = 0;

        let lastTap = 0;

        function updateTransform() {

            image.style.transform =
                `translate3d(${currentX}px,${currentY}px,0) scale(${scale})`;

            imageScale = scale;
        }

        function distance(a, b) {

            return Math.hypot(
                b.clientX - a.clientX,
                b.clientY - a.clientY
            );
        }

        function resetZoom() {

            scale = 1;

            currentX = 0;
            currentY = 0;

            updateTransform();
        }

        function toggleZoom() {

            if (scale > 1) {

                resetZoom();

                return;
            }

            scale = 2;

            currentX = 0;
            currentY = 0;

            updateTransform();
        }

        // =================================================
        // DOUBLE CLICK
        // =================================================

        image.addEventListener(
            "dblclick",
            event => {

                event.preventDefault();
                event.stopPropagation();

                toggleZoom();
            }
        );

        // =================================================
        // IMAGE TOUCH ZOOM / PAN
        // =================================================

        image.addEventListener(
            "touchstart",
            event => {

                if (
                    event.touches.length === 2
                ) {

                    startDistance =
                        distance(
                            event.touches[0],
                            event.touches[1]
                        );

                    dragging = false;

                    return;
                }

                if (
                    event.touches.length === 1 &&
                    scale > 1
                ) {

                    const touch =
                        event.touches[0];

                    dragging = true;

                    startX =
                        touch.clientX -
                        currentX;

                    startY =
                        touch.clientY -
                        currentY;
                }

            },
            {
                passive: true
            }
        );

        image.addEventListener(
            "touchmove",
            event => {

                if (
                    event.touches.length === 2
                ) {

                    event.preventDefault();

                    const newDistance =
                        distance(
                            event.touches[0],
                            event.touches[1]
                        );

                    if (
                        startDistance > 0
                    ) {

                        scale *=
                            newDistance /
                            startDistance;

                        scale =
                            Math.max(
                                1,
                                Math.min(
                                    scale,
                                    5
                                )
                            );

                        startDistance =
                            newDistance;

                        updateTransform();
                    }

                    return;
                }

                if (
                    event.touches.length === 1 &&
                    dragging &&
                    scale > 1
                ) {

                    event.preventDefault();

                    const touch =
                        event.touches[0];

                    currentX =
                        touch.clientX -
                        startX;

                    currentY =
                        touch.clientY -
                        startY;

                    updateTransform();
                }

            },
            {
                passive: false
            }
        );

        image.addEventListener(
            "touchend",
            event => {

                dragging = false;

                const now =
                    Date.now();

                if (
                    now - lastTap < 300
                ) {

                    event.preventDefault();

                    toggleZoom();

                    lastTap = 0;

                    return;
                }

                lastTap = now;
            }
        );

        // =================================================
        // DOWNLOAD
        // =================================================

        const downloadButton =
            document.createElement("a");

        downloadButton.href = url;

        downloadButton.download = "";

        downloadButton.target = "_blank";

        downloadButton.rel =
            "noopener noreferrer";

        downloadButton.textContent = "⬇";

        downloadButton.setAttribute(
            "aria-label",
            "Download image"
        );

        downloadButton.style.cssText = `
            position:absolute;
            top:18px;
            right:18px;
            width:48px;
            height:48px;
            display:flex;
            align-items:center;
            justify-content:center;
            border-radius:50%;
            background:rgba(20,20,20,.8);
            color:#fff;
            font-size:25px;
            line-height:1;
            text-decoration:none;
            z-index:100;
            cursor:pointer;
            touch-action:manipulation;
        `;

        downloadButton.addEventListener(
            "click",
            event => {
                event.stopPropagation();
            }
        );

        viewer.appendChild(
            downloadButton
        );
    }

    // =================================================
    // VIDEO
    // =================================================

    if (type === "video") {

        const video =
            document.createElement("video");

        video.id =
            "mediaVideo";

        video.src = url;

        video.controls = true;

        video.autoplay = true;

        video.playsInline = true;

        video.muted =
            window.storyMuted ?? true;

        video.setAttribute(
            "playsinline",
            ""
        );

        video.setAttribute(
            "webkit-playsinline",
            ""
        );

        video.preload = "metadata";

        video.style.cssText = `
            max-width:96vw;
            max-height:96vh;
            width:auto;
            height:auto;
            object-fit:contain;
            display:block;
            background:#000;
            border-radius:10px;
            touch-action:none;
        `;

        video.addEventListener(
            "error",
            () => {

                console.error(
                    "❌ MEDIA VIDEO ERROR:",
                    {
                        url,
                        error:
                            video.error
                    }
                );
            }
        );

        video.addEventListener(
            "loadedmetadata",
            () => {

                console.log(
                    "✅ MEDIA VIDEO LOADED:",
                    video.videoWidth,
                    video.videoHeight
                );
            }
        );

        container.appendChild(
            video
        );

        video.play().catch(
            error => {

                console.warn(
                    "⚠️ MEDIA VIDEO AUTOPLAY BLOCKED:",
                    error
                );
            }
        );
    }

    // =================================================
    // BACKGROUND CLICK
    // =================================================

    viewer.addEventListener(
        "click",
        event => {

            if (
                event.target === viewer
            ) {

                window.closeMedia();
            }
        }
    );

    // =================================================
    // POINTER SWIPE-TO-CLOSE
    // =================================================
    //
    // This is the ONLY swipe-close system
    // inside this function.
    //
    // We use Pointer Events so Android touch
    // input is handled consistently.
    // =================================================

    let pointerActive = false;

    let pointerId = null;

    let pointerStartX = 0;

    let pointerStartY = 0;

    let pointerCurrentX = 0;

    let pointerCurrentY = 0;

    let pointerDirectionLocked = false;

    let pointerVerticalSwipe = false;

    const SWIPE_CLOSE_DISTANCE = 120;

    const SWIPE_DIRECTION_RATIO = 1.15;

    function resetViewerPosition() {

        viewer.style.transition =
            "transform .2s ease, opacity .2s ease";

        viewer.style.transform =
            "translate3d(0,0,0)";

        viewer.style.opacity =
            "1";
    }

    function cancelMediaPointer() {

        pointerActive = false;

        pointerId = null;

        pointerDirectionLocked =
            false;

        pointerVerticalSwipe =
            false;

        resetViewerPosition();
    }

    function onPointerDown(event) {

        /*
         * Only touch/stylus input should
         * trigger swipe-to-close.
         */
        if (
            event.pointerType !== "touch" &&
            event.pointerType !== "pen"
        ) {
            return;
        }

        /*
         * A zoomed image owns the gesture.
         * Do not treat image panning as viewer swipe.
         */
        if (
            type === "image" &&
            imageScale > 1
        ) {
            return;
        }

        /*
         * Ignore buttons.
         */
        if (
            event.target === closeButton ||
            event.target.closest?.("a,button")
        ) {
            return;
        }

        /*
         * Only one pointer can control
         * the viewer swipe.
         */
        if (pointerActive) {
            return;
        }

        pointerActive = true;

        pointerId =
            event.pointerId;

        pointerStartX =
            event.clientX;

        pointerStartY =
            event.clientY;

        pointerCurrentX =
            event.clientX;

        pointerCurrentY =
            event.clientY;

        pointerDirectionLocked =
            false;

        pointerVerticalSwipe =
            false;

        viewer.style.transition =
            "none";

        /*
         * Capture the pointer on the viewer.
         * This is important when the finger moves
         * from the media element onto another area.
         */
        try {

            viewer.setPointerCapture(
                event.pointerId
            );

        } catch (error) {}
    }

    function onPointerMove(event) {

        if (
            !pointerActive ||
            event.pointerId !== pointerId
        ) {
            return;
        }

        pointerCurrentX =
            event.clientX;

        pointerCurrentY =
            event.clientY;

        const deltaX =
            pointerCurrentX -
            pointerStartX;

        const deltaY =
            pointerCurrentY -
            pointerStartY;

        const absX =
            Math.abs(deltaX);

        const absY =
            Math.abs(deltaY);

        /*
         * Wait until the gesture has moved
         * enough to determine its direction.
         */
        if (
            !pointerDirectionLocked
        ) {

            if (
                absX < 10 &&
                absY < 10
            ) {
                return;
            }

            pointerDirectionLocked =
                true;

            /*
             * Horizontal movement is not
             * a viewer close gesture.
             */
            if (
                absX >
                absY
            ) {

                pointerVerticalSwipe =
                    false;

                pointerActive =
                    false;

                try {

                    viewer.releasePointerCapture(
                        event.pointerId
                    );

                } catch (error) {}

                return;
            }

            /*
             * Only downward movement closes.
             */
            if (
                deltaY <= 0
            ) {

                pointerVerticalSwipe =
                    false;

                pointerActive =
                    false;

                try {

                    viewer.releasePointerCapture(
                        event.pointerId
                    );

                } catch (error) {}

                return;
            }

            pointerVerticalSwipe =
                true;
        }

        if (
            !pointerVerticalSwipe
        ) {
            return;
        }

        /*
         * Stop browser/native gesture handling.
         */
        event.preventDefault();

        event.stopPropagation();

        const distance =
            Math.max(
                0,
                deltaY
            );

        const limitedDistance =
            Math.min(
                distance,
                window.innerHeight
            );

        viewer.style.transform =
            `translate3d(0,${limitedDistance}px,0)`;

        const progress =
            Math.min(
                limitedDistance /
                    Math.max(
                        window.innerHeight,
                        1
                    ),
                1
            );

        viewer.style.opacity =
            String(
                Math.max(
                    0.15,
                    1 - progress
                )
            );
    }

    function onPointerUp(event) {

        if (
            !pointerActive ||
            event.pointerId !== pointerId
        ) {
            return;
        }

        const deltaX =
            pointerCurrentX -
            pointerStartX;

        const deltaY =
            pointerCurrentY -
            pointerStartY;

        const shouldClose =
            pointerVerticalSwipe &&
            deltaY >=
                SWIPE_CLOSE_DISTANCE &&
            deltaY >
                Math.abs(deltaX) *
                SWIPE_DIRECTION_RATIO;

        pointerActive =
            false;

        pointerId =
            null;

        pointerDirectionLocked =
            false;

        pointerVerticalSwipe =
            false;

        try {

            viewer.releasePointerCapture(
                event.pointerId
            );

        } catch (error) {}

        if (shouldClose) {

            console.log(
                "⬇️ MEDIA SWIPE CLOSE:",
                {
                    deltaX,
                    deltaY
                }
            );

            viewer.style.transition =
                "transform .2s ease, opacity .2s ease";

            viewer.style.transform =
                `translate3d(0,${window.innerHeight}px,0)`;

            viewer.style.opacity =
                "0";

            setTimeout(() => {

                window.closeMedia();

            }, 180);

            return;
        }

        resetViewerPosition();
    }

    function onPointerCancel(event) {

        if (
            !pointerActive ||
            event.pointerId !== pointerId
        ) {
            return;
        }

        console.log(
            "↩️ MEDIA SWIPE CANCELLED"
        );

        pointerActive =
            false;

        pointerId =
            null;

        pointerDirectionLocked =
            false;

        pointerVerticalSwipe =
            false;

        resetViewerPosition();
    }

    viewer.addEventListener(
        "pointerdown",
        onPointerDown,
        {
            passive: true
        }
    );

    viewer.addEventListener(
        "pointermove",
        onPointerMove,
        {
            passive: false
        }
    );

    viewer.addEventListener(
        "pointerup",
        onPointerUp,
        {
            passive: true
        }
    );

    viewer.addEventListener(
        "pointercancel",
        onPointerCancel,
        {
            passive: true
        }
    );

    // =================================================
    // FADE IN
    // =================================================

    requestAnimationFrame(() => {

        viewer.style.opacity =
            "1";
    });

    return true;
};

// =====================================================

window.notificationProfileCache =
  window.notificationProfileCache || new Map();

window.loadNotificationProfiles = async function(notifications) {

  const senderIds = [
    ...new Set(
      notifications
        .map(n => n.sender_id)
        .filter(Boolean)
    )
  ];

  if (!senderIds.length) return;

  const { data, error } = await supabase
    .from("profiles")
    .select(`
      id,
      name,
      username,
      avatar_url
    `)
    .in("id", senderIds);

  if (error) {
    console.log(
      "❌ NOTIFICATION PROFILE ERROR:",
      error
    );
    return;
  }

  (data || []).forEach(profile => {

    window.notificationProfileCache.set(
      profile.id,
      profile
    );

  });

};

// =====================================================
// LOAD NOTIFICATIONS
// =====================================================

async function loadNotifications() {

  if (!currentUser) return;

  const { data, error } = await supabase
    .from("notifications")
    .select("*")
    .eq("user_id", currentUser.id);

  console.log("CURRENT USER:", currentUser.id);
  console.log("NOTIFICATION ERROR:", error);
  console.log("NOTIFICATION DATA:", data);

  if (error) {
    console.log(error);
    return;
  }

  notificationCache =
    mergeFromServer(
      [...notificationCache],
      data || []
    );

  // Get latest sender profiles
  await loadNotificationProfiles(
    notificationCache
  );

// =====================================================
  // START FROM CACHE
// =====================================================

  let notifications =
    [...notificationCache].sort(
      (a, b) =>
        new Date(
          b.last_time || b.created_at
        ) -
        new Date(
          a.last_time || a.created_at
        )
    );

// =====================================================
  // FILTER
// =====================================================

  if (notificationFilter !== "all") {

    if (notificationFilter === "stories") {

      notifications =
        notifications.filter(n =>
          n.type === "story_reply" ||
          n.type === "story_reaction"
        );

    } else {

      notifications =
        notifications.filter(
          n =>
            n.type === notificationFilter
        );

    }

  }

// =====================================================
  // SEARCH
// =====================================================

  const search =
    document
      .getElementById("notificationSearch")
      ?.value
      ?.toLowerCase()
      .trim() || "";

  if (search) {

    notifications =
      notifications.filter(n => {

        const profile =
          window.notificationProfileCache.get(
            n.sender_id
          ) || {};

        const currentName =
          profile.name ||
          profile.username ||
          "";

        const currentUsername =
          profile.username ||
          "";

        const message =
          n.message || "";

        return (
          currentName
            .toLowerCase()
            .includes(search) ||

          currentUsername
            .toLowerCase()
            .includes(search) ||

          message
            .toLowerCase()
            .includes(search)
        );

      });

  }

// =====================================================
  // RENDER
// =====================================================

  const list =
    document.getElementById(
      "notificationsList"
    );

  if (!list) {

    console.warn(
      "notificationsList missing in DOM"
    );

    return;

  }

  renderNotifications(
    notifications
  );

}

// =====================================================
// OPEN NOTIFICATION

window.openNotification = async function(id) {

  setActiveTopButton("notificationBtn");

  const {
    data,
    error
  } = await supabase
    .from("notifications")
    .select("*")
    .eq("id", id)
    .single();

  if (error || !data) return;

  // =====================================================
  // MARK AS READ
  // =====================================================

  await supabase
    .from("notifications")
    .update({
      read: true
    })
    .eq("id", id);

  // =====================================================
  // UPDATE CACHE
  // =====================================================

  const item = notificationCache.find(
    n => n.id === id
  );

  if (item) {
    item.read = true;
  }

  loadUnreadCount();

  // =====================================================
  // HIDE NOTIFICATIONS SCREEN
  // =====================================================

  const screen =
    document.getElementById("notificationsScreen");

  if (screen) {
    hideScreen("notificationsScreen");
  }

  // =====================================================
  // STORY REPLY
  // =====================================================

  if (data.type === "story_reply") {

    if (!data.story_id) return;

    if (
      window.__openingStory ===
      data.story_id
    ) {
      return;
    }

    window.__openingStory =
      data.story_id;

    window.openStoryById(
      data.story_id,
      {
        type: "reply",
        story_id: data.story_id
      }
    );

    setTimeout(() => {

      window.__openingStory = null;
      window.storyOpenContext = null;

    }, 1000);

    return;
  }

  // =====================================================
  // STORY REACTION
  // =====================================================

  if (data.type === "story_reaction") {

    if (!data.story_id) return;

    window.openStoryById(
      data.story_id,
      {
        type: "reaction",
        story_id: data.story_id
      }
    );

    return;
  }

  // =====================================================
  // LIKE
  // =====================================================

  if (data.type === "like") {

    if (data.post_id) {

      openedLikedPostFromNotification = true;

      openExactPostFromNotification(
        data.post_id
      );
    }

    return;
  }

  // =====================================================
  // COMMENT
  // =====================================================

  if (data.type === "comment") {

    if (
      data.post_id &&
      data.comment_id
    ) {

      openedCommentsFromNotification = true;

      await openComments(
        data.post_id,
        data.comment_id
      );
    }

    return;
  }

  // =====================================================
  // COMMENT LIKE
  // =====================================================

  if (data.type === "comment_like") {

    if (
      data.post_id &&
      data.comment_id
    ) {

      openedCommentsFromNotification = true;

      await openComments(
        data.post_id,
        data.comment_id
      );
    }

    return;
  }

  // =====================================================
  // COMMENT REPLY
  // =====================================================

  if (data.type === "comment_reply") {

    if (
      data.post_id &&
      data.comment_id
    ) {

      openedCommentsFromNotification = true;

      await openComments(
        data.post_id,
        data.comment_id
      );
    }

    return;
  }

  // =====================================================
  // COMMENT REACTION
  // =====================================================

  if (data.type === "comment_reaction") {

    if (
      data.post_id &&
      data.comment_id
    ) {

      openedCommentsFromNotification = true;

      await openComments(
        data.post_id,
        data.comment_id
      );
    }

    return;
  }

  // =====================================================
  // FOLLOW
  // =====================================================

  if (data.type === "follow") {

    if (data.sender_id) {

      openedProfileFromNotification = true;

      window.profileNavigationSource =
        "notifications";

      await openProfile(
        data.sender_id,
        data.username || "User"
      );
    }

    return;
  }

  // =====================================================
  // FOLLOW ACCEPTED
  // =====================================================

  if (data.type === "follow_accept") {

    if (data.sender_id) {

      openedProfileFromNotification = true;

      window.profileNavigationSource =
        "notifications";

      await openProfile(
        data.sender_id,
        data.username || "User"
      );
    }

    return;
  }

  // =====================================================
  // MESSAGE / MESSAGE REACTION
  // =====================================================

  if (
    data.type === "message" ||
    data.type === "message_reaction"
  ) {

    if (data.sender_id) {

      // IMPORTANT:
      // Remember exactly where Chat was opened from.
      chatOpenedFrom = "notifications";
      window.chatOpenedFrom = "notifications";

      await openChat(
        data.sender_id,
        data.username || "User",
        {
          source: "notifications"
        }
      );
    }

    return;
  }

  // =====================================================
  // PROFILE UPDATE
  // =====================================================

  if (data.type === "profile_update") {

    if (data.sender_id) {

      openedProfileFromNotification = true;

      window.profileNavigationSource =
        "notifications";

      await openProfile(
        data.sender_id,
        data.username || "User"
      );
    }

    return;
  }

  // =====================================================
  // FOLLOW REQUEST
  // =====================================================

  if (data.type === "follow_request") {

    openedFollowRequestsFromNotification = true;

    window.currentFollowRequestsSource =
      "notifications";

    window.openedFollowRequestsFromNotification =
      true;

    window.openedFollowRequestsFromSettings =
      false;

    await openFollowRequests(
      true,
      "notifications"
    );

    return;
  }

  // =====================================================
  // FALLBACK
  // =====================================================

  renderNotifications();
};

async function loadUnreadCount() {

  if (!currentUser) return;

  const {
    data,
    error
  } =
    await supabase
      .from("notifications")
      .select(
        "id",
        {
          count: "exact"
        }
      )
      .eq(
        "user_id",
        currentUser.id
      )
      .eq(
        "read",
        false
      );

  if (error) {

    console.log(error);

    return;

  }

  unreadCount =
    data
      ? data.length
      : 0;

  updateNotifBadge();

}

function updateNotifBadge() {

  const badge =
    document.getElementById(
      "notificationBadge"
    );

  if (!badge) return;

  if (unreadCount > 0) {

    badge.style.display =
      "flex";

    badge.style.alignItems =
      "center";

    badge.style.justifyContent =
      "center";

    badge.textContent =
      unreadCount > 99
        ? "99+"
        : unreadCount;

  } else {

    badge.style.display =
      "none";

  }

}

// =====================================================
// MERGE NOTIFICATION
// =====================================================

function mergeNotification(n) {

  const index =
    notificationCache.findIndex(
      x => x.id === n.id
    );

  if (index >= 0) {

    notificationCache[index] = {
      ...notificationCache[index],
      ...n
    };

  } else {

    notificationCache.unshift({
      ...n,
      count: n.count || 1
    });

  }

  notificationCache.sort(
    (a, b) =>
      new Date(
        b.last_time ||
        b.created_at
      ) -
      new Date(
        a.last_time ||
        a.created_at
      )
  );

}

// =====================================================
// MERGE SERVER DATA
// =====================================================

function mergeFromServer(
  cache,
  serverData
) {

  const map =
    new Map();

  // Server data wins
  serverData.forEach(n => {

    map.set(
      n.id,
      {
        ...n
      }
    );

  });

  // Keep local items not yet on server
  cache.forEach(n => {

    if (!map.has(n.id)) {

      map.set(
        n.id,
        {
          ...n
        }
      );

    }

  });

  return [
    ...map.values()
  ].sort(
    (a, b) =>
      new Date(
        b.last_time ||
        b.created_at
      ) -
      new Date(
        a.last_time ||
        a.created_at
      )
  );

}

// =====================================================
// FORMAT TIME
// =====================================================

function formatTime(dateString) {

  const mins =
    Math.floor(
      (
        Date.now() -
        new Date(
          dateString
        )
      ) / 60000
    );

  if (mins < 1)
    return "now";

  if (mins < 60)
    return mins + "m";

  if (mins < 1440)
    return (
      Math.floor(
        mins / 60
      ) + "h"
    );

  return (
    Math.floor(
      mins / 1440
    ) + "d"
  );

}

// =====================================================
// NOTIFICATION REALTIME
// =====================================================

function getNotifKey(n) {

  return n.id;

}

if (!window.notificationsSubscription) {

  window.notificationsSubscription =
    supabase
      .channel(
        "notifications_channel"
      )

      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "notifications"
        },

        async payload => {
          const n =
            payload.new;

          if (
            !currentUser ||
            n.user_id !==
              currentUser.id
          ) {

            return;

          }

          // Load latest sender profile
          if (n.sender_id) {
            const {
              data: profile
            } =
              await supabase
                .from("profiles")
                .select(`
                  id,
                  name,
                  username,
                  avatar_url
                `)
                .eq(
                  "id",
                  n.sender_id
                )
                .maybeSingle();

            if (profile) {

              window
                .notificationProfileCache
                .set(
                  profile.id,
                  profile
                );

            }

          }

          const key =
            getNotifKey(n);

          if (
            seenNotifications.has(
              key
            )
          ) {

            return;

          }

          seenNotifications.add(
            key
          );

          // Sync other tab
          if (
            window.tabChannel
          ) {

            tabChannel.postMessage(
              n
            );

          }

          mergeNotification(n);

          loadUnreadCount();

          showToastNotification(n);

          const screen =
            document.getElementById(
              "notificationsScreen"
            );

          if (
            screen &&
            screen.style.display ===
              "flex"
          ) {

            renderNotifications(
              notificationCache
            );

          }

        }
      )

      .on(
        "postgres_changes",
        {
          event: "UPDATE",
          schema: "public",
          table: "notifications"
        },

        payload => {

          const updated =
            payload.new;

          const item =
            notificationCache.find(
              n =>
                n.id ===
                updated.id
            );

          if (item) {

            Object.assign(
              item,
              updated
            );

          }

          renderNotifications(
            notificationCache
          );

          loadUnreadCount();

        }
      )

      .subscribe();

}

if (

async function openExactPostFromNotification(postId) {

    console.log("❤️ OPENING EXACT LIKED POST:", postId);

    // ------------------------------------------
    // REMEMBER WE CAME FROM NOTIFICATIONS
    // ------------------------------------------

    openedLikedPostFromNotification = true;

    // ------------------------------------------
    // HIDE NOTIFICATIONS
    // ------------------------------------------

    const notificationsScreen =
        document.getElementById("notificationsScreen");

    if (notificationsScreen) {
        notificationsScreen.style.display = "none";
    }

    // ------------------------------------------
    // SHOW MAIN APP
    // ------------------------------------------

    const app =
        document.getElementById("app");

    if (app) {
        app.style.display = "";
    }

    document.body.style.overflow = "";

    // ------------------------------------------
    // CHECK IF EXACT POST IS ALREADY RENDERED
    // ------------------------------------------

    let postElement =
        document.getElementById(`post-${postId}`);

    if (postElement) {

        console.log(
            "✅ EXACT LIKED POST ALREADY EXISTS"
        );

        postElement.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        highlightExactPost(postElement);

        return;
    }

    // ------------------------------------------
    // POST IS NOT IN CURRENT FEED
    // LOAD IT
    // ------------------------------------------

    console.log(
        "📥 EXACT POST NOT IN CURRENT FEED:",
        postId
    );

    const { data: post, error } =
        await supabase
            .from("posts")
            .select("*")
            .eq("id", postId)
            .single();

    if (error || !post) {

        console.error(
            "❌ COULD NOT LOAD EXACT LIKED POST:",
            error
        );

        return;
    }

    // ------------------------------------------
    // LOAD PROFILE
    // ------------------------------------------

    if (post.user_id) {

        const { data: profile } =
            await supabase
                .from("profiles")
                .select(`
                    id,
                    name,
                    username,
                    avatar_url,
                    cover_url,
                    verified
                `)
                .eq("id", post.user_id)
                .maybeSingle();

        post.profile = profile || null;
    }

    // ------------------------------------------
    // LOAD SAVED STATE
    // ------------------------------------------

    if (session?.user?.id) {

        const { data: saved } =
            await supabase
                .from("saved_posts")
                .select("id")
                .eq("user_id", session.user.id)
                .eq("post_id", postId)
                .maybeSingle();

        post.saved = !!saved;
    }

    // ------------------------------------------
    // ADD POST TO POSTS STATE
    // ------------------------------------------

    if (!window.postsState) {
        window.postsState = [];
    }

    const existingIndex =
        window.postsState.findIndex(
            p => String(p.id) === String(postId)
        );

    if (existingIndex >= 0) {

        window.postsState[existingIndex] = {
            ...window.postsState[existingIndex],
            ...post
        };

    } else {

        window.postsState.unshift(post);
    }

    // ------------------------------------------
    // RENDER FEED
    // ------------------------------------------

    renderFeed(window.postsState);

    // ------------------------------------------
    // FIND EXACT POST AFTER RENDER
    // ------------------------------------------

    requestAnimationFrame(() => {

        const exactPost =
            document.getElementById(
                `post-${postId}`
            );

        if (!exactPost) {

            console.error(
                "❌ EXACT POST STILL NOT FOUND:",
                postId
            );

            return;
        }

        console.log(
            "🎯 FOUND EXACT LIKED POST:",
            exactPost.id
        );

        exactPost.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

        highlightExactPost(exactPost);

    });
}

    if (!state?.screen) return;

    try {
        sessionStorage.setItem(
            "appNavigationState",
            JSON.stringify(state)
        );
    } catch (error) {
        console.warn(
            "⚠️ NAVIGATION SESSION SAVE FAILED:",
            error
        );
    }
};


window.setCurrentNavigationState = function (
    screen,
    data = {},
    scrollY = 0
) {

    if (!screen) return;

    const state = {
        screen,
        data: data || {},
        scrollY:
            Number.isFinite(Number(scrollY))
                ? Number(scrollY)
                : 0,
        timestamp: Date.now()
    };

    window.appNavigation.current =
        state;

    window.syncNavigationSession(state);

    return state;
};

window.closeMedia = function () {

    const viewer =
        document.getElementById("mediaViewer");

    if (!viewer) {
        console.warn(
            "⚠️ closeMedia: mediaViewer NOT FOUND"
        );
        return;
    }

    console.log(
        "🔙 CLOSE HOME MEDIA VIEWER"
    );

    // Stop and fully release any video.
    viewer
        .querySelectorAll("video")
        .forEach(video => {

            try {
                video.pause();
                video.removeAttribute("src");
                video.load();
            } catch (error) {}
        });

    // Remove current media.
    viewer.innerHTML = "";

    // Hide viewer.
    viewer.style.display = "none";
    viewer.style.visibility = "hidden";
    viewer.style.opacity = "0";
    viewer.style.pointerEvents = "none";
    viewer.style.transform = "";
    viewer.style.transition = "";

    // Restore page scrolling.
    try {

        if (
            typeof window.unlockBackground ===
            "function"
        ) {
            window.unlockBackground();
        } else {
            document.body.style.overflow = "";
            document.documentElement.style.overflow = "";
            document.body.style.touchAction = "";
            document.documentElement.style.touchAction = "";
        }

    } catch (error) {

        document.body.style.overflow = "";
        document.documentElement.style.overflow = "";
        document.body.style.touchAction = "";
        document.documentElement.style.touchAction = "";
    }

    // Let the existing navigation system
    // restore the screen and scroll position.
    if (
        history.state?.appScreen ===
        "mediaViewer"
    ) {
        history.back();
    }

};

window.initializeAppNavigation = function () {

    if (
        window.appNavigation.initialized ===
        true
    ) {
        return;
    }

    window.appNavigation.initialized =
        true;

    const state =
        history.state;

    if (
        !state ||
        !state.appScreen
    ) {

        const homeState = {
            appScreen: "app",
            data: {},
            scrollY: 0
        };

        history.replaceState(
            homeState,
            "",
            "#app"
        );

        window.setCurrentNavigationState(
            "app",
            {},
            0
        );

        console.log(
            "🧭 NAVIGATION INITIALIZED → HOME"
        );

        return;
    }

    window.setCurrentNavigationState(
        state.appScreen,
        state.data || {},
        state.scrollY || 0
    );

    console.log(
        "🧭 NAVIGATION INITIALIZED:",
        window.appNavigation.current
    );
};

        {
            from:
                previous?.screen ||

            to:

                nextData,

            addHistory,

            restoring:

    if (

            nextData?.userId != null
                ? String(

                )
                : null;


        if (

        ) {

    if (

                }

        }
    }


    // =================================================
    // COMMENTS SCREEN

    // =================================================

    if (
        sameDestination &&
        screen === "commentsScreen"
    ) {

        const previousPostId =
            previous?.data?.postId != null

                    previous.data.postId

                : null;


        const nextPostId =

        if (

                {
                    from:
                        previousPostId,

                    to:
                        nextPostId
                }
            );
        }
    }


    // =================================================
    // SAME DESTINATION

    // Example:

    // Profile A → Profile A Photos

    // This should NOT create another browser entry.
    // =================================================

    if (
        sameDestination

        history.replaceState(

                    currentScrollY

            "#" + screen

        console.log(

            screen

        return true;
    }

    // =================================================
    // MIRROR PREVIOUS SCREEN
    //

    // The internal stack mirrors it for fallback/debugging.
    // =================================================

    if (previous) {

        navigation.stack.push({

            screen:
                previous.screen,

            data: {
                ...(previous.data || {})

            scrollY:
                previous.scrollY || 0,

            timestamp:
                previous.timestamp ||
                Date.now()
        });


        console.log(
            "📚 NAVIGATION STACK PUSH:",
            {
                screen:
                    previous.screen,

                data:
                    previous.data
            }
        );
    }

    // =================================================
    // SAVE NEW CURRENT SCREEN
    // =================================================

    navigation.current =
        nextState;

    window.syncNavigationSession(
        nextState
    );

    // =================================================
    // BROWSER HISTORY
    // =================================================

    history.pushState(
        {
            appScreen:
                screen,

            data:
                nextData,

            scrollY:
                currentScrollY
        },
        "",
        "#" + screen
    );

    console.log(
        "🌐 HISTORY PUSH:",
        screen,
        nextData
    );

    return true;
};

        );

            window.appNavigation?.stack
        );

            "================================="
        );


        if (
            window.appNavigation.restoring ===
            true
        ) {

            console.log(
                "⏳ RESTORE ALREADY RUNNING"
            );

            return;
        }


        window.appNavigation.restoring =
            true;


        try {

            // =================================================
            // NORMAL APP HISTORY ENTRY
            // =================================================

            if (
                event.state &&
                event.state.appScreen
            ) {

                const restoreState = {

                    screen:
                        event.state.appScreen,

                    data:
                        event.state.data ||
                        {},

                    scrollY:
                        event.state.scrollY ||
                        0
                };


                /*
                 * If Back has moved away from an overlay,
                 * immediately remove the overlay before
                 * restoring the underlying screen.
                 */
                if (
                    restoreState.screen !==
                    "mediaViewer"
                ) {

                    window.hideMediaViewerForNavigation();
                }

                if (
                    restoreState.screen !==
                    "photoGallery"
                ) {

                    window.hidePhotoGalleryForNavigation();
                }

                // Story is an overlay/navigation state. When Back moves to
                // another screen, remove the old story before restoring it.
                if (restoreState.screen !== "storyViewer") {
                    const storyViewer = document.getElementById("storyViewer");
                    if (storyViewer) {
                        storyViewer.classList.remove("active");
                        storyViewer.style.display = "none";
                        storyViewer.style.visibility = "hidden";
                        storyViewer.style.opacity = "0";
                        storyViewer.style.pointerEvents = "none";
                    }
                    window.__storyOpen = false;
                    if (typeof window.restoreTopBar === "function") {
                        window.restoreTopBar();
                    }
                }


                // ---------------------------------------------
                // SYNCHRONIZE MIRROR STACK
                // ---------------------------------------------

                const stack =
                    window.appNavigation.stack;

                if (
                    stack.length > 0
                ) {

                    const expected =
                        stack[
                            stack.length - 1
                        ];

                    if (
                        expected &&
                        expected.screen ===
                            restoreState.screen
                    ) {

                        stack.pop();

                        console.log(
                            "📚 STACK SYNCHRONIZED:",
                            restoreState.screen
                        );
                    }
                }


                await window.restoreNavigationState(
                    restoreState
                );


                // ---------------------------------------------
                // RESTORE SCROLL
                // ---------------------------------------------

                if (
                    restoreState.scrollY !=
                    null
                ) {

                    requestAnimationFrame(
                        () => {

                            window.scrollTo(
                                0,
                                restoreState.scrollY
                            );
                        }
                    );
                }

                return;
            }


            // =================================================
            // NO APP HISTORY
            // =================================================

            console.log(
                "🌐 NO APP HISTORY → HOME"
            );

            window.hideMediaViewerForNavigation();

            window.hidePhotoGalleryForNavigation();

            window.appNavigation.stack =
                [];

            await window.goHome(false);

        } catch (error) {

            console.error(
                "❌ NAVIGATION RESTORE FAILED:",
                error
            );

            window.hideMediaViewerForNavigation();

            window.hidePhotoGalleryForNavigation();

            window.appNavigation.stack =
                [];

            await window.goHome(false);

        } finally {

            window.appNavigation.restoring =
                false;
        }
    }

window.restoreNavigationAfterReload =
    async function () {

        let saved = null;

        try {

            saved =
                JSON.parse(
                    sessionStorage.getItem(
                        "appNavigationState"
                    )
                );

        } catch (error) {

            console.warn(
                "⚠️ SAVED NAVIGATION INVALID:",
                error
            );
        }


        if (!saved?.screen) {

            console.log(
                "🏠 NO SAVED NAVIGATION"
            );

            return;
        }


        console.log(
            "🔄 RELOAD → RESTORE:",
            saved
        );


        window.appNavigation.restoring =
            true;


        try {

            /*
             * Special case:
             *
             * The page was reloaded while an
             * overlay was open.
             */
            if (
                saved.screen ===
                    "mediaViewer"
            ) {

                /*
                 * We need the media viewer's
                 * underlying screen to exist
                 * before opening the media again.
                 */
                const sourceScreen =
                    saved.data?.sourceScreen ||
                    saved.data?.source ||
                    "app";

                const sourceData =
                    saved.data?.sourceData ||
                    {};

                if (
                    sourceScreen !==
                    "app"
                ) {

                    await window.restoreNavigationState({
                        screen:
                            sourceScreen,

                        data:
                            sourceData,

                        scrollY:
                            0
                    });
                }

                /*
                 * Now restore the actual viewer.
                 */
                if (
                    saved.data?.url &&
                    typeof window.openMedia ===
                        "function"
                ) {

                    /*
                     * openMedia() sees the current
                     * history state as mediaViewer,
                     * so it replaces rather than pushes.
                     */
                    window.openMedia(
                        saved.data.url,
                        saved.data.type ||
                            "image"
                    );
                }

                return;
            }


            if (
                saved.screen ===
                    "photoGallery"
            ) {

                const sourceScreen =
                    saved.data?.sourceScreen ||
                    saved.data?.source ||
                    "app";

                const sourceData =
                    saved.data?.sourceData ||
                    {};

                /*
                 * Restore the profile underneath
                 * the gallery first.
                 */
                if (
                    sourceScreen !==
                    "app"
                ) {

                    await window.restoreNavigationState({
                        screen:
                            sourceScreen,

                        data:
                            sourceData,

                        scrollY:
                            0
                    });
                }

                /*
                 * The gallery data may not yet be
                 * loaded. If profile loading created
                 * the gallery, restore its index.
                 */
                if (
                    Number.isInteger(
                        Number(
                            saved.data?.index
                        )
                    )
                ) {

                    window.profileGalleryIndex =
                        Number(
                            saved.data.index
                        );
                }

                /*
                 * Re-create the gallery without
                 * pushing another history entry.
                 */
                if (
                    typeof window.renderPhotoGallery ===
                    "function"
                ) {

                    let overlay =
                        document.getElementById(
                            "photoGallery"
                        );

                    if (!overlay) {

                        overlay =
                            document.createElement(
                                "div"
                            );

                        overlay.id =
                            "photoGallery";

                        overlay.style.cssText = `
                            position:fixed;
                            inset:0;
                            width:100vw;
                            height:100vh;
                            display:flex;
                            align-items:center;
                            justify-content:center;
                            background:#000;
                            z-index:2147483646;
                            overflow:hidden;
                            visibility:visible;
                            opacity:1;
                            pointer-events:auto;
                            touch-action:none;
                        `;

                        document.body.appendChild(
                            overlay
                        );
                    }

                    try {

                        if (
                            typeof window.lockBackground ===
                            "function"
                        ) {

                            window.lockBackground();

                        } else {

                            document.body.style.overflow =
                                "hidden";
                        }

                    } catch (error) {}

                    window.renderPhotoGallery();
                }

                return;
            }


            /*
             * Normal screen reload.
             */
            await window.restoreNavigationState(
                saved
            );

        } catch (error) {

            console.error(
                "❌ RELOAD RESTORE FAILED:",
                error
            );

            window.hideMediaViewerForNavigation();

            window.hidePhotoGalleryForNavigation();

            await window.goHome(false);

        } finally {

            window.appNavigation.restoring =
                false;
        }
    };

    window.scrollTo({
      top: 0,
      left: 0,
      behavior: "auto"
    });

  });

  return;
}

  // ===============================================
  // RETURN FROM ANOTHER SCREEN
  // NO RELOAD
  // ===============================================

  console.log(
    "↩️ RETURNING HOME → RESTORE:",
    window.homeScrollY
  );

  restoreHomeScroll();

};

// =====================================================
// SAVE HOME SCROLL POSITION
// =====================================================

window.saveHomeScroll = function () {

  const posts = document.getElementById("posts");

  // If #posts is the actual scrolling container
  if (
    posts &&
    posts.scrollHeight > posts.clientHeight
  ) {

    window.homeScrollElement = "posts";
    window.homeScrollY = posts.scrollTop;

  } else {

    // Otherwise the page itself is scrolling
    window.homeScrollElement = "window";

    window.homeScrollY =
      window.scrollY ||
      document.documentElement.scrollTop ||
      document.body.scrollTop ||
      0;
  }

  console.log(
    "💾 HOME POSITION SAVED:",
    window.homeScrollElement,
    window.homeScrollY
  );
};


// =====================================================
// RESTORE HOME SCROLL POSITION
// =====================================================

window.restoreHomeScroll = function () {

  const y = window.homeScrollY || 0;

  requestAnimationFrame(() => {

    if (
      window.homeScrollElement === "posts"
    ) {

      const posts =
        document.getElementById("posts");

      if (posts) {

        posts.scrollTop = y;

      }

    } else {

      window.scrollTo({
        top: y,
        left: 0,
        behavior: "instant"
      });

    }

    requestAnimationFrame(() => {

      if (
        window.homeScrollElement === "posts"
      ) {

        const posts =
          document.getElementById("posts");

        if (posts) {
          posts.scrollTop = y;
        }

      } else {

        window.scrollTo({
          top: y,
          left: 0,
          behavior: "instant"
        });

      }

    });

  });

  console.log(
    "↩️ HOME POSITION RESTORED:",
    window.homeScrollElement,
    y
  );

};

async function registerPush() {

  if (
    !("serviceWorker" in navigator) ||
    !("Notification" in window)
  ) {
    console.log("Push notifications not supported.");
    return;
  }

  const permission = await Notification.requestPermission();

  if (permission !== "granted") return;

  const reg = await navigator.serviceWorker.register("./sw.js");

  const subscription = await reg.pushManager.subscribe({
    userVisibleOnly: true,
    applicationServerKey: urlBase64ToUint8Array(
"BKasJ4tLBWnUvRWEUMvqcWeqUq9qKmFeqvH-tNotanADuKj0aLixYV2xnkTurxdvV-ACw3QuFKvG2ZRZ_tEyuGk"
)
  });

  await supabase.from("push_subscriptions").upsert({
    user_id: currentUser.id,
    subscription
  });

  window.userSubscription = subscription;
}

function urlBase64ToUint8Array(base64String) {
  const padding = "=".repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding)
    .replace(/-/g, "+")
    .replace(/_/g, "/");

  const rawData = window.atob(base64);
  return Uint8Array.from([...rawData].map(char => char.charCodeAt(0)));
}

const videoObserver = new IntersectionObserver(
  (entries) => {

    entries.forEach((entry) => {

      const video =
        entry.target.querySelector("video");

      if (!video) return;

      if (
        entry.isIntersecting &&
        entry.intersectionRatio >= 0.75
      ) {

        // 🔥 ONLY ONE HOME VIDEO CAN PLAY
        document
          .querySelectorAll("#posts .post-card video")
          .forEach((otherVideo) => {

            if (otherVideo !== video) {
              otherVideo.pause();
            }

          });

        video.play().catch(() => {});

      } else {

        video.pause();

      }

    });

  },
  {
    threshold: [0.6, 0.75, 0.9]
  }
);


// =====================================================
// HOME FEED VIDEO OBSERVER
// =====================================================

function observeVideos() {

  console.log("🎬 observeVideos START");

  videoObserver.disconnect();

  const posts =
    document.querySelectorAll("#posts .post-card");

  const videos =
    document.querySelectorAll("#posts .post-card video");

  console.log("🎬 HOME POSTS:", posts.length);
  console.log("🎬 HOME VIDEOS:", videos.length);

  videos.forEach(video => {

    console.log(
      "🎬 VIDEO:",
      video,
      "paused:",
      video.paused
    );

    video.pause();

  });

  posts.forEach(post => {

    console.log(
      "👀 OBSERVING POST:",
      post.id
    );

    videoObserver.observe(post);

  });

  console.log("🎬 observeVideos END");

}
